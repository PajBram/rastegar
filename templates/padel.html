<section class="pagehead">
  <span class="kicker">{{when_label}}</span>
  <h1 class="pagehead__title">{{title}}</h1>
  <p class="pagehead__sub">{{summary}}</p>
</section>

<section class="section section--tight wrap">
  <div class="countdown" data-starts="{{starts}}">
    <p class="countdown__state">Counting down to the first serve</p>
    <div class="countdown__clock">
      <span class="countdown__unit"><b data-unit="days">--</b><small>days</small></span>
      <span class="countdown__unit"><b data-unit="hours">--</b><small>hours</small></span>
      <span class="countdown__unit"><b data-unit="minutes">--</b><small>minutes</small></span>
      <span class="countdown__unit"><b data-unit="seconds">--</b><small>seconds</small></span>
    </div>
    <p class="countdown__fallback">{{when_long}}</p>
  </div>
</section>

{{celebration}}

<section class="section wrap">
  <p class="shout">{{shout}}</p>
</section>
