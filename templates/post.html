<article class="section section--post">
  <header class="posthead">
    <div class="post-meta"><time datetime="{{iso_date}}">{{date}}</time>{{tags}}</div>
    <h1 class="posthead__title">{{title}}</h1>
  </header>
  <div class="panel prose prose--wide">{{content}}</div>
  <a class="more more--block" href="/devlog/"><span aria-hidden="true">&larr;</span> All entries</a>
</article>
