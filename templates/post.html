<article class="section wrap">
  <header class="posthead">
    <div class="post-meta"><time datetime="{{iso_date}}">{{date}}</time>{{tags}}</div>
    <h1 class="posthead__title">{{title}}</h1>
    <hr class="rule">
  </header>
  <div class="prose">{{content}}</div>
  <a class="more more--block" href="/devlog/">All entries</a>
</article>
