<header class="pagehead pagehead--game">
  <span class="kicker">{{kind}}</span>
  <h1 class="pagehead__title">{{title}}</h1>
  <p class="pagehead__sub">{{tagline}}</p>
</header>

<section class="section--game wrap">
  <div class="panel panel--stage">
    <div id="game-root" data-game="{{slug}}"{{data_attrs}}>{{mount}}</div>
  </div>
</section>

<section class="section wrap">
  <div class="grid grid--split">
    <div class="prose">
      <h3>About</h3>
      {{spoiler}}
      {{about}}
      <h4>Controls</h4>
      <ul class="controls">{{controls}}</ul>
    </div>
    {{aside}}
  </div>
</section>

{{scores_script}}
{{scripts}}
