<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="/static/css/style.css">
<link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
<script src="/static/js/config.js" defer></script>
<script src="/static/js/main.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="masthead">
  <div class="masthead__inner">
    <a class="logo" href="/" aria-label="rastegar.se">
      <span class="logo__script" aria-hidden="true">Rastegar</span>
      <span class="logo__rule" aria-hidden="true"></span>
      <span class="logo__domain" aria-hidden="true">rastegar.se</span>
    </a>
    <button class="menu-toggle" aria-expanded="false" aria-controls="sitenav">
      <span class="menu-toggle__bars" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="sr-only">Menu</span>
    </button>
    <nav id="sitenav" class="sitenav">{{nav}}</nav>
  </div>
</header>

<main id="main">
{{body}}
</main>

<footer class="footer">
  <div class="footer__inner">
    <p class="footer__line">Built by hand, one project at a time.</p>
    <p class="footer__small">&copy; {{year}} {{site_name}} &middot; <a href="/about/">About</a> &middot; <a href="/guestbook/">Guestbook</a> &middot; <a href="/tag/privacy/">TAG privacy</a></p>
  </div>
</footer>
</body>
</html>
