<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="A winged figure above an arena, closing in from every edge">
  <defs>
    <radialGradient id="arena" cx="50%" cy="50%" r="62%">
      <stop offset="0%" stop-color="#fdf7ec"/><stop offset="70%" stop-color="#e9dcc8"/>
      <stop offset="100%" stop-color="#c9b79c"/>
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#arena)"/>
  <g stroke="#16120f" stroke-width="2" opacity=".12" fill="none">
    <circle cx="200" cy="150" r="52"/><circle cx="200" cy="150" r="92"/><circle cx="200" cy="150" r="132"/>
  </g>

  <!-- the pack, pressing in from the edges -->
  <g fill="#16120f">
    <path d="M28 60 l22 14 -22 14 z"/>
    <path d="M64 34 l20 12 -20 12 z" opacity=".85"/>
    <path d="M372 96 l-22 14 22 14 z"/>
    <path d="M340 52 l-20 12 20 12 z" opacity=".85"/>
    <path d="M46 240 l22 -14 -4 26 z"/>
    <path d="M330 246 l-22 -14 4 26 z" opacity=".9"/>
    <path d="M198 280 l14 -22 14 22 z" opacity=".8"/>
  </g>

  <!-- shots already in the air -->
  <g fill="#ff2d55">
    <circle cx="264" cy="118" r="5"/><circle cx="292" cy="104" r="4"/><circle cx="318" cy="92" r="3"/>
  </g>

  <!-- the winged thing in the middle -->
  <g transform="translate(200 150)">
    <path d="M-14 -6 q-52 -30 -74 -6 q30 6 44 22 q-30 -2 -44 10 q34 8 60 -4 z" fill="#16120f"/>
    <path d="M14 -6 q52 -30 74 -6 q-30 6 -44 22 q30 -2 44 10 q-34 8 -60 -4 z" fill="#16120f"/>
    <ellipse cx="0" cy="0" rx="15" ry="21" fill="#ff2d55"/>
    <ellipse cx="0" cy="0" rx="15" ry="21" fill="none" stroke="#16120f" stroke-width="4"/>
    <circle cx="0" cy="-8" r="4" fill="#fdf7ec"/>
  </g>
</svg>
