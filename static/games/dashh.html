class EscortMission extends Mission {
  constructor(level, ctx, mgr) {
    super(level);
    this.title = 'ESCORT THE HAULER';
    this.label = 'HAULER';

    const p = ctx.player.pos;
    const a = rand(TAU);
    this.x = p.x + Math.cos(a) * 8;
    this.z = p.z + Math.sin(a) * 8;
    this.y = terrainHeight(this.x, this.z);

    // målet ligger tvärs över kartan, med hela vägen innanför arenan
    const dir = Math.atan2(-this.z, -this.x) + rand(-0.8, 0.8);
    const len = rand(100, 140);
    const goal = clampToArena({
      x: this.x + Math.cos(dir) * len,
      z: this.z + Math.sin(dir) * len,
    });
    this.goal = { x: goal.x, z: goal.z };
    this.routeLen = Math.hypot(this.goal.x - this.x, this.goal.z - this.z);

    this.maxHp = 240 + level * 30;
    this.hp = this.maxHp;
    this.speed = 3.4;
    this.waiting = true;

    // lägren står längs vägen — resan är gatloppet
    for (const f of [0.45, 0.7, 0.92]) {
      const bx = this.x + (this.goal.x - this.x) * f;
      const bz = this.z + (this.goal.z - this.z) * f;
      const side = rand(-14, 14);
      const nx = -(this.goal.z - this.z) / this.routeLen, nz = (this.goal.x - this.x) / this.routeLen;
      const spot = clampToArena({ x: bx + nx * side, z: bz + nz * side });
      mgr.spawnCamp(ctx, { x: spot.x, z: spot.z }, mgr.plan.budget / 3);
    }
  }

  get status() { return `${Math.max(0, Math.round(this.hp / this.maxHp * 100))} %`; }

  update(dt, ctx) {
    if (this.done || this.failed) return;
    const p = ctx.player.pos;
    const toGoal = Math.hypot(this.goal.x - this.x, this.goal.z - this.z);

    // Lastaren väntar in spelaren i stället för att rulla iväg ensam — en
    // följeslagare man springer efter är bara irriterande.
    const near = Math.hypot(this.x - p.x, this.z - p.z) < 26;
    this.waiting = !near;
    if (near && toGoal > 5) {
      const k = this.speed * dt / toGoal;
      this.x += (this.goal.x - this.x) * k;
      this.z += (this.goal.z - this.z) * k;
    }
    // den svävar, så ingen sten eller backe kan sätta stopp
    this.y += ((terrainHeight(this.x, this.z) + 1.6) - this.y) * Math.min(1, dt * 3);

    // Skada från monster som står intill, reparation när det är lugnt.
    // Fler än fyra på en gång räknas inte — annars smälter lastaren bort på
    // några sekunder så fort ett läger vaknar, och då är uppdraget förlorat
    // innan man hunnit dit.
    let threat = 0;
    for (const e of ctx.enemies) {
      if (!e.alive || e.guard) continue;
      if (Math.hypot(e.pos.x - this.x, e.pos.z - this.z) < 4.5) threat++;
    }
    threat = Math.min(4, threat);
    if (threat) {
      this.hp -= threat * (4 + this.level * 0.4) * dt;
      if (Math.random() < 0.5) {
        ctx.particles.spawn({
          x: this.x + rand(-1, 1), y: this.y + rand(0, 1.4), z: this.z + rand(-1, 1),
          vx: rand(-1, 1), vy: rand(1, 3), vz: rand(-1, 1), life: rand(0.3, 0.6),
          size: rand(0.2, 0.45), size2: 0, col: [1.0, 0.45, 0.2], alpha: 0.9, drag: 0.5,
        });
      }
      if (!this.hurtT || this.hurtT <= 0) { this.hurtT = 4; ctx.toast('The hauler is under attack!'); }
    } else if (this.hp < this.maxHp) {
      this.hp = Math.min(this.maxHp, this.hp + 12 * dt);
    }
    if (this.hurtT > 0) this.hurtT -= dt;

    if (this.hp <= 0) { this.hp = 0; this.failed = true; return; }
    if (toGoal <= 5) {
      this.done = true;
      ctx.particles.burst(this.x, this.y + 1, this.z, 30, {
        speed: 10, life: 0.9, size: 0.6, size2: 0.05, col: GREEN, alpha: 0.95, drag: 0.6, grav: -4,
      });
    }
  }

  markers() {
    return [{ x: this.x, z: this.z, col: '#5cffa0' }, { x: this.goal.x, z: this.goal.z, col: '#4df3ff' }];
  }

  draw(rend, time) {
    const B = rend.dyn;
    const hurt = this.hp / this.maxHp;
    // Mässing och blinkande ljus, inte grått — annars ser lastaren ut som
    // ännu ett stenblock i landskapet och man tappar bort den.
    const body = [0.68, 0.52, 0.26];
    const bob = Math.sin(time * 2.2) * 0.14;
    const y = this.y + bob;
    B.box.push(this.x, y + 1.0, this.z, 1.9, 1.15, 1.4, body, 0, time * 0.25, 0, 0.1);
    B.box.push(this.x, y + 2.2, this.z, 1.1, 0.35, 0.85, [0.35, 0.3, 0.2], 0, time * 0.25, 0, 0.05);
    // ljuset ovanpå skiftar mot rött när den är illa däran
    B.sphere.push(this.x, y + 2.85, this.z, 0.42, 0.42, 0.42,
      [1.0, 0.25 + hurt * 0.7, 0.2 + hurt * 0.4], 0, 0, 0, 1.6);
    B.cyl.push(this.x, y + 0.15, this.z, 1.7, 0.12, 1.7, CYAN, 0, 0, 0, 1.0);
    for (let i = 0; i < 4; i++) {
      const a = time * 1.1 + i * (TAU / 4);
      B.sphere.push(this.x + Math.cos(a) * 1.9, y + 0.55, this.z + Math.sin(a) * 1.9,
        0.2, 0.2, 0.2, CYAN, 0, 0, 0, 1.3);
    }
    if (Math.random() < 0.5) {
      rend.particles.spawn({
        x: this.x + rand(-0.8, 0.8), y: y - 0.2, z: this.z + rand(-0.8, 0.8),
        vx: 0, vy: rand(-1.6, -0.6), vz: 0, life: rand(0.3, 0.6),
        size: rand(0.12, 0.26), size2: 0, col: CYAN, alpha: 0.5, drag: 0.3,
      });
    }
    // målpelaren syns på långt håll
    const gy = terrainHeight(this.goal.x, this.goal.z);
    B.cyl.push(this.goal.x, gy + 6, this.goal.z, 0.16, 6, 0.16, CYAN, 0, 0, 0, 1.1);
    B.octa.push(this.goal.x, gy + 12.5 + Math.sin(time * 2) * 0.4, this.goal.z,
      0.7, 1.1, 0.7, CYAN, 0, time * 1.2, 0, 1.4);
  }
}

// ------------------------------------------------------------------- boss

class BossMission extends Mission {
  constructor(level, ctx, mgr) {
    super(level);
    this.title = 'SOMETHING WAITS OUT THERE';
    this.label = 'THE BOSS';
    for (let i = 0; i < mgr.plan.camps; i++) {
      mgr.spawnCamp(ctx, mgr.campSpot(ctx, 48, ARENA_RADIUS - 14), mgr.plan.budget / mgr.plan.camps);
    }
    const spot = mgr.campSpot(ctx, 62, ARENA_RADIUS - 18);
    // äventyret har egna bossar — vågläget behåller sina
    const type = ctx.worldId === 'city' ? 'cityboss' : 'vildboss';
    const e = ctx.spawnEnemy(type, spot.x, spot.z, true);
    e.postGuard(38);
    this.target = e;
  }

  get status() {
    const t = this.target;
    if (!t.alive) return 'DOWN';
    return t.guard ? 'FIND IT' : `${Math.max(0, Math.round(t.hp / t.maxHp * 100))} %`;
  }

  update(dt, ctx) {
    if (!this.target.alive && !this.done) this.done = true;
  }

  markers() {
    return this.target.alive ? [{ x: this.target.pos.x, z: this.target.pos.z, col: '#ff3d7f' }] : [];
  }
}

// ---------------------------------------------------------------- val av typ

// Namnet måste vara eget: bundlern slår ihop alla moduler till en enda
// namnrymd, och `TYPES` är redan fiendetyperna i enemies.js.
const MISSION_TYPES = ['collect', 'hunt', 'defend', 'escort'];

/** Väljer uppdragstyp: nivå 1 lär ut kartan, sedan varieras det. */
function pickMissionType(level, last) {
  if (level === 1) return 'collect';
  if (level === 2) return 'hunt';
  const pool = MISSION_TYPES.filter((t) => t !== last && (t !== 'escort' || level >= 4));
  return pool[randInt(0, pool.length - 1)];
}

function createMission(type, level, ctx, mgr) {
  switch (type) {
    case 'boss': return new BossMission(level, ctx, mgr);
    case 'defend': return new DefendMission(level, ctx, mgr);
    case 'hunt': return new HuntMission(level, ctx, mgr);
    case 'escort': return new EscortMission(level, ctx, mgr);
    default: return new CollectMission(level, ctx, mgr);
  }
}

// ═══ adventure.js ═══
// Äventyrsläget: nivåer med utplacerade monster i stället för vågor mot arenan.
//
// Skillnaden mot vågläget är var monstren finns. Här står de i läger utspridda
// över kartan och rör sig inte förrän spelaren kommer nära — annars vore en
// "karta" bara en våg som råkar ha startat längre bort.



const CHECKPOINT_EVERY = 10;   // var tionde nivå sparas som utgångspunkt

class AdventureManager {
  constructor() { this.reset(); }

  reset() {
    this.level = 0;
    this.state = 'idle';     // idle → running → cleared
    this.timer = 1.0;
    this.total = 0;          // monster nivån började med
    this.sinceKill = 0;
    this.levelTime = 0;
    this.hunted = false;
    this.plan = null;
    this.mission = null;
    this.lastType = null;
    this.forceType = null;
    this.missionType = null;
  }

  isBossLevel(level) { return level % 3 === 0; }

  /**
   * Nivåns omfång varierar med flit: en kort utrensning, en vanlig runda eller
   * en lång vandring. Enformig längd gör att alla nivåer smälter ihop.
   * Försvar och eskort skapar eget motstånd och får därför färre läger.
   */
  makePlan(level, type) {
    if (type === 'boss') return { size: 'boss', camps: 2, budget: 5 + level * 1.5 };
    if (type === 'defend') return { size: 'short', camps: 2, budget: 6 + level * 1.4 };
    if (type === 'escort') return { size: 'long', camps: 3, budget: 9 + level * 2.2 };
    const r = Math.random();
    if (r < 0.30) return { size: 'short', camps: 2, budget: 5 + level * 1.7 };
    if (r < 0.75) return { size: 'normal', camps: 4, budget: 8 + level * 2.3 };
    return { size: 'long', camps: 6, budget: 11 + level * 3.0 };
  }

  /** Monsterlista för ett läger, prisad så svårare typer blir färre. */
  compose(budget, level, worldId) {
    const list = [];
    const options = [];
    if (worldId === 'city') {
      options.push(['drone', 0.7]);
      if (level >= 2) options.push(['sniper', 2.5]);
      if (level >= 3) options.push(['spitter', 1.6]);
      if (level >= 4) options.push(['hover', 4.2]);
    } else {
      options.push(['grunt', 1]);
      if (level >= 2) options.push(['spitter', 1.6]);
      if (level >= 3) options.push(['charger', 2.2]);
      if (level >= 5) options.push(['tank', 3.4]);
    }
    let spent = 0;
    while (spent < budget) {
      const [type, cost] = options[randInt(0, options.length - 1)];
      if (type === 'drone') {
        const n = randInt(2, 4);
        for (let i = 0; i < n; i++) list.push('drone');
        spent += cost * n;
      } else {
        list.push(type);
        spent += cost;
      }
    }
    return list;
  }

  /**
   * En plats för ett läger: inte ovanpå spelaren, inte i vattnet.
   *
   * Avståndet till spelaren måste vara större än vakternas syn (max 28 m),
   * annars vaknar hela lägret i samma stund som nivån börjar och rusar mot
   * en — då är det ingen karta att utforska, bara en våg som startade långt
   * bort. Marginalen är tilltagen för att lägret sprider sig några meter.
   */
  campSpot(ctx, minR, maxR) {
    for (let tries = 0; tries < 40; tries++) {
      const a = rand(TAU);
      const d = rand(minR, maxR);
      const x = Math.cos(a) * d, z = Math.sin(a) * d;
      if (Math.hypot(x - ctx.player.pos.x, z - ctx.player.pos.z) < 45) continue;
      if (ctx.worldId !== 'city' && terrainHeight(x, z) < WATER_LEVEL + 0.6) continue;
      return { x, z };
    }
    const a = rand(TAU);
    return { x: Math.cos(a) * maxR * 0.8, z: Math.sin(a) * maxR * 0.8 };
  }

  /**
   * Ett läger: några monster kring en plats, alla på post.
   * Uppdragen ropar själva på den här när de bestämt var motståndet ska stå.
   */
  spawnCamp(ctx, spot, budget) {
    const list = this.compose(Math.max(2, budget), this.level, ctx.worldId);
    const out = [];
    for (const type of list) {
      const a = rand(TAU), d = rand(0, 7);
      const e = ctx.spawnEnemy(type, spot.x + Math.cos(a) * d, spot.z + Math.sin(a) * d, true);
      // Vaknar när spelaren kommer inom ett kvarters avstånd — nära nog att
      // lägret hinner ses innan det rör sig, långt nog att man inte
      // överraskas bakifrån.
      e.postGuard(rand(22, 28));
      out.push(e);
    }
    return out;
  }

  startLevel(ctx) {
    ctx.clearScene();
    this.level++;
    const boss = this.isBossLevel(this.level);
    const type = boss ? 'boss' : (this.forceType || pickMissionType(this.level, this.lastType));
    this.forceType = null;
    if (!boss) this.lastType = type;
    this.plan = this.makePlan(this.level, type);
    // uppdraget placerar ut både sina egna föremål och lägren
    this.mission = createMission(type, this.level, ctx, this);
    this.missionType = type;

    this.total = ctx.enemies.length;
    this.sinceKill = 0;
    this.levelTime = 0;
    this.hunted = false;
    this.state = 'running';
    ctx.onLevelStart(this.level, boss, this.plan, this.mission);
  }

  onKill() { this.sinceKill = 0; }

  /** Efter en avklarad nivå — anropas när spelaren lämnat mellanskärmen. */
  nextLevel() {
    this.mission = null;
    this.state = 'idle';
    this.timer = 0.5;
  }

  /** Misslyckat uppdrag: samma nivå och samma uppgift görs om från början. */
  retryLevel() {
    this.forceType = this.missionType;
    this.level--;
    this.nextLevel();
  }

  draw(rend, time) {
    if (this.mission) this.mission.draw(rend, time);
  }

  update(dt, ctx) {
    if (this.state === 'idle') {
      this.timer -= dt;
      if (this.timer <= 0) this.startLevel(ctx);
      return;
    }
    if (this.state !== 'running') return;

    this.levelTime += dt;
    this.sinceKill += dt;

    const m = this.mission;
    if (m) {
      m.update(dt, ctx);
      if (m.failed) {
        this.state = 'failed';
        ctx.onLevelFailed(this.level, m);
        return;
      }
      if (m.done) {
        this.state = 'cleared';
        ctx.onLevelClear(this.level);
        return;
      }
    }

    // Skyddsnätet, samma tanke som i vågläget: en nivå får aldrig kunna låsa
    // sig för att det som ska dödas står oåtkomligt någonstans. Efter fyra
    // minuter kommer allt som lever i stället till spelaren.
    if (!this.hunted && this.levelTime > 240) {
      this.hunted = true;
      for (const e of ctx.enemies) {
        if (!e.alive) continue;
        e.wake(ctx);
        e.enrage = true;
      }
      ctx.toast('Everything still alive is coming for you');
    }
  }
}

// ═══ combat.js ═══
// Projektiler, explosioner och drops.



/** Närmaste träffpunkt mellan en sträcka och en sfär — hindrar snabba skott från att missa. */
function segmentHitsSphere(px, py, pz, dx, dy, dz, len, cx, cy, cz, r) {
  const mx = cx - px, my = cy - py, mz = cz - pz;
  let t = mx * dx + my * dy + mz * dz;
  t = clamp(t, 0, len);
  const hx = px + dx * t - cx, hy = py + dy * t - cy, hz = pz + dz * t - cz;
  return hx * hx + hy * hy + hz * hz <= r * r;
}

class Combat {
  constructor() {
    this.shots = [];
    this.bullets = [];
    this.pickups = [];
    this.patches = [];
  }

  reset() {
    this.shots.length = 0; this.bullets.length = 0;
    this.pickups.length = 0; this.patches.length = 0;
  }

  // ------------------------------------------------------------ svärdssving

  swordSwing(ctx) {
    const p = ctx.player, st = p.stats;
    // tre hugg i följd: det tredje är en finisher med överhandshugg
    p.combo = p.comboTimer > 0 ? (p.combo + 1) % 3 : 0;
    p.comboTimer = 1.5;
    const fin = p.combo === 2;

    p.swingSide = -(p.swingSide || 1);
    p.swingFinisher = fin;
    p.swingDur = fin ? 0.34 : 0.26;
    p.swingTime = p.swingDur;
    p.fireTimer = 1 / (st.fireRate * (fin ? 0.42 : 0.55));
    ctx.sound[fin ? 'finisher' : 'swing']();

    const range = (3.8 + st.multishot * 0.35) * (fin ? 1.25 : 1);
    const arc = (1.15 + st.multishot * 0.12) * (fin ? 1.3 : 1);   // halv svepvinkel
    p.aimDir(ctx.enemies);
    let hitAny = false;

    for (const e of ctx.enemies) {
      if (!e.alive) continue;
      const dx = e.pos.x - p.pos.x, dz = e.pos.z - p.pos.z;
      const dist = Math.hypot(dx, dz);
      if (dist > range + e.radius) continue;
      if (Math.abs(angleDelta(p.yaw, Math.atan2(dx, dz))) > arc) continue;
      if (Math.abs((e.pos.y + e.height * 0.5) - (p.pos.y + 1.3)) > e.height * 0.5 + 2.6) continue;

      const crit = Math.random() < Math.min(st.crit, CRIT_CAP) || fin;
      const dmg = st.damage * (fin ? 2.8 : 1.7) * (crit ? st.critMult : 1);
      const killed = e.damage(dmg + st.burn, ctx, crit);
      ctx.sound[crit ? 'swordCrit' : 'swordHit']();
      if (st.lifesteal > 0) p.heal(dmg * st.lifesteal);
      // rejäl knockback — svagare mot tunga fiender
      const kb = (fin ? 27 : 16) / (1 + e.radius);
      if (dist > 0.01) { e.vel.x += (dx / dist) * kb; e.vel.z += (dz / dist) * kb; }
      if (fin) { e.vel.y += 7; ctx.freeze(0.09); }
      e.slow = Math.max(e.slow, fin ? 0.7 : 0.3);
      if (st.explosive > 0) this.explode(ctx, e.pos.x, e.pos.y + e.height * 0.5, e.pos.z, st.explosive, dmg * 0.4);
      if (killed) ctx.onEnemyKilled(e);
      hitAny = true;
    }

    /*
     * Svepet ritas som en sammanhängande båge i två lager: en tät, ljus kärna
     * längs eggens väg och ett glesare, mörkare sken utanför den. Tidigare låg
     * partiklarna på ett enda avstånd och drev utåt — det blev ett moln, inte
     * ett hugg. Nu följer de klingans radie, och varje punkt längs bågen föds
     * en aning senare än den förra så spåret sveper i huggets riktning.
     */
    const n = fin ? 30 : 18;
    const dir = p.swingSide > 0 ? 1 : -1;
    for (let i = 0; i < n; i++) {
      const f = i / (n - 1);
      const a = p.yaw + (f - 0.5) * arc * 2 * dir;
      for (let layer = 0; layer < 2; layer++) {
        const d = range * (layer ? 0.92 : 0.66);
        const sinA = Math.sin(a), cosA = Math.cos(a);
        ctx.particles.spawn({
          x: p.pos.x + sinA * d + rand(-0.12, 0.12),
          y: p.pos.y + 1.3 + (fin ? (f - 0.5) * 1.5 : (Math.random() - 0.5) * 0.35),
          z: p.pos.z + cosA * d + rand(-0.12, 0.12),
          // liten drift utåt, så bågen tunnas ut i stället för att bara slockna
          vx: sinA * (fin ? 5 : 2.2), vy: fin ? rand(0.5, 2.5) : 0.4, vz: cosA * (fin ? 5 : 2.2),
          life: (fin ? 0.34 : 0.2) * (layer ? 0.7 : 1) - f * 0.04,
          size: (fin ? 1.0 : 0.6) * (layer ? 0.7 : 1), size2: 0.04,
          col: fin ? [1.0, 0.78, 0.30]
            : layer ? [0.75, 0.85, 1.0]
              : hitAny ? [1.0, 0.9, 0.65] : [0.95, 0.98, 1.0],
          alpha: (fin ? 0.95 : 0.8) * (layer ? 0.45 : 1), drag: 0.6,
        });
      }
    }
    p.shake = Math.min(0.5, p.shake + (fin ? 0.3 : hitAny ? 0.08 : 0.03));
  }

  // -------------------------------------------------------------- eldhärdar

  /** Brinnande mark efter en eldboll — skadar fiender som står kvar i lågorna. */
  spawnFirePatch(ctx, x, z, radius, dmg) {
    if (this.patches.length > 7) this.patches.shift();
    this.patches.push({
      x, y: terrainHeight(x, z), z,
      r: radius, life: 4.5, max: 4.5, tick: 0, dmg,
    });
  }

  updatePatches(dt, ctx) {
    for (let i = this.patches.length - 1; i >= 0; i--) {
      const q = this.patches[i];
      q.life -= dt;
      if (q.life <= 0) { this.patches.splice(i, 1); continue; }
      const fade = Math.min(1, q.life / 1.2);

      // lågor och glöd
      for (let k = 0; k < 3; k++) {
        const a = rand(TAU), d = Math.sqrt(Math.random()) * q.r;
        const px = q.x + Math.cos(a) * d, pz = q.z + Math.sin(a) * d;
        ctx.particles.spawn({
          x: px, y: terrainHeight(px, pz) + 0.1, z: pz,
          vx: rand(-0.5, 0.5), vy: rand(2.2, 4.5), vz: rand(-0.5, 0.5),
          life: rand(0.35, 0.7), size: rand(0.5, 1.0) * fade, size2: 0.05,
          col: [1.0, rand(0.35, 0.65), 0.12], alpha: 0.75 * fade, drag: 0.5,
        });
      }

      // skada var 0,35 s
      q.tick -= dt;
      if (q.tick <= 0) {
        q.tick = 0.35;
        for (const e of ctx.enemies) {
          if (!e.alive) continue;
          if (Math.hypot(e.pos.x - q.x, e.pos.z - q.z) > q.r + e.radius) continue;
          if (e.pos.y - q.y > 3.5) continue;
          if (e.damage(q.dmg, ctx, false)) ctx.onEnemyKilled(e);
        }
      }
    }
  }

  // ---------------------------------------------------------------- eldboll

  castFireball(ctx) {
    const p = ctx.player, st = p.stats;
    const dir = p.aimDir(ctx.enemies);
    const m = p.muzzle();
    const n = st.multishot;
    for (let i = 0; i < n; i++) {
      const off = n === 1 ? 0 : (i / (n - 1) - 0.5) * 0.22;
      const c = Math.cos(off), s = Math.sin(off);
      this.shots.push({
        x: m.x, y: m.y + 0.3, z: m.z,
        vx: (dir.x * c + dir.z * s) * st.projSpeed * 0.6,
        vy: dir.y * st.projSpeed * 0.6 + 2,
        vz: (-dir.x * s + dir.z * c) * st.projSpeed * 0.6,
        life: 2.6,
        dmg: st.damage * 3.2,
        crit: false,
        pierce: 0,
        radius: 0.95,
        explosive: 4.5 + st.explosive,
        hits: new Set(),
        fireball: true,
        col: [1.0, 0.55, 0.15],
      });
    }
    p.fireballCd = p.fireballCdMax;
    ctx.sound.fireball();
    p.shake = Math.min(0.6, p.shake + 0.25);
    ctx.particles.burst(m.x, m.y + 0.3, m.z, 10, {
      speed: 5, life: 0.3, size: 0.6, col: [1.0, 0.6, 0.2], alpha: 0.9, drag: 0.6,
    });
  }

  // ------------------------------------------------------------- spelarskott

  playerShoot(ctx) {
    const p = ctx.player, st = p.stats;
    const city = ctx.worldId === 'city';
    const dir = p.aimDir(ctx.enemies);
    const m = p.muzzle();
    const n = st.multishot;
    for (let i = 0; i < n; i++) {
      const off = n === 1 ? 0 : (i / (n - 1) - 0.5) * st.spread * (n + 1);
      const yawOff = off + rand(-st.spread * 0.5, st.spread * 0.5);
      const c = Math.cos(yawOff), s = Math.sin(yawOff);
      const dx = dir.x * c + dir.z * s;
      const dz = -dir.x * s + dir.z * c;
      const crit = Math.random() < Math.min(st.crit, CRIT_CAP);
      // Extra skott gör mindre — annars fördubblar ett enda kort din skada.
      const falloff = i === 0 ? 1 : 0.75;
      this.shots.push({
        x: m.x, y: m.y, z: m.z,
        vx: dx * st.projSpeed, vy: dir.y * st.projSpeed, vz: dz * st.projSpeed,
        life: 1.7,
        dmg: st.damage * falloff * (crit ? st.critMult : 1),
        crit,
        pierce: st.pierce,
        radius: st.projSize + 0.25,
        explosive: st.explosive,
        hits: new Set(),
        beam: city,
        col: crit ? [1.0, 0.85, 0.35] : city ? [1.0, 0.30, 0.42] : [0.45, 0.95, 1.0],
      });
    }
    ctx.sound[city ? 'laser' : 'shoot']();
    ctx.particles.burst(m.x, m.y, m.z, 4, {
      speed: 4, life: 0.16, size: 0.32,
      col: city ? [1.0, 0.5, 0.6] : [0.6, 0.95, 1.0], alpha: 0.9, drag: 0.7,
    });
    p.shotSide = -p.shotSide;
    p.fireTimer = 1 / st.fireRate;
    p.shake = Math.min(0.35, p.shake + 0.045);
  }

  droneShoot(ctx, x, y, z, target) {
    let dx = target.pos.x - x, dy = target.pos.y + target.height * 0.5 - y, dz = target.pos.z - z;
    const l = Math.hypot(dx, dy, dz) || 1;
    dx /= l; dy /= l; dz /= l;
    // drönaren skjuter en gnista, fén en trollformel — olika färg och ljud
    const fairy = ctx.worldId !== 'city';
    this.shots.push({
      x, y, z, vx: dx * 52, vy: dy * 52, vz: dz * 52,
      life: 1.5, dmg: ctx.player.stats.damage * 0.5, crit: false,
      pierce: 0, radius: 0.5, explosive: 0, hits: new Set(),
      col: fairy ? [0.7, 1.0, 0.8] : [1.0, 0.75, 0.25],
    });
    if (fairy) ctx.sound.tone({ f: 1250, f2: 1900, dur: 0.09, type: 'sine', vol: 0.045 });
    else ctx.sound.tone({ f: 900, f2: 420, dur: 0.06, type: 'triangle', vol: 0.05 });
  }

  /**
   * Slår tillbaka ett fiendeskott. Det blir spelarens projektil: dubbel skada,
   * riktad mot närmaste fiende. Missar man alla står den kvar och flyger dit
   * man tittade — en parering utan mål ska ändå kännas som en parering.
   */
  reflectBullet(ctx, b, index) {
    const p = ctx.player;
    let target = null, best = 60;
    for (const e of ctx.enemies) {
      if (!e.alive) continue;
      const d = Math.hypot(e.pos.x - b.x, e.pos.z - b.z);
      if (d < best) { best = d; target = e; }
    }
    let dx, dy, dz;
    if (target) {
      dx = target.pos.x - b.x;
      dy = (target.pos.y + target.height * 0.5) - b.y;
      dz = target.pos.z - b.z;
    } else {
      const aim = p.aimDir(ctx.enemies);
      dx = aim.x; dy = aim.y; dz = aim.z;
    }
    const l = Math.hypot(dx, dy, dz) || 1;
    const speed = 70;
    this.shots.push({
      x: b.x, y: b.y, z: b.z,
      vx: (dx / l) * speed, vy: (dy / l) * speed, vz: (dz / l) * speed,
      life: 2.0, dmg: b.dmg * 2, crit: true,
      pierce: 1, radius: 0.7, explosive: 0, hits: new Set(),
      col: [1.0, 0.92, 0.55],
    });
    this.bullets.splice(index, 1);

    p.parryFlash = 1;
    ctx.freeze(0.07);
    ctx.sound.parry();
    ctx.particles.burst(b.x, b.y, b.z, 18, {
      speed: 11, life: 0.4, size: 0.6, size2: 0.05,
      col: [1.0, 0.95, 0.6], alpha: 1, drag: 0.7,
    });
  }

  // ------------------------------------------------------------ fiendeskott

  enemyBullet(e, target, speed, dmg) {
    let dx = target.pos.x - e.pos.x;
    let dy = (target.pos.y + 1.1) - (e.pos.y + e.height * 0.6);
    let dz = target.pos.z - e.pos.z;
    const l = Math.hypot(dx, dy, dz) || 1;
    this.enemyBulletDir(e, dx / l, dy / l, dz / l, speed, dmg);
  }

  enemyBulletDir(e, dx, dy, dz, speed, dmg) {
    this.bullets.push({
      x: e.pos.x + dx * (e.radius + 0.4),
      y: e.pos.y + e.height * 0.6 + dy * 0.4,
      z: e.pos.z + dz * (e.radius + 0.4),
      vx: dx * speed, vy: dy * speed, vz: dz * speed,
      life: 4.5, dmg, radius: 0.45,
      col: e.boss ? [1.0, 0.35, 0.55] : [0.85, 0.45, 1.0],
    });
  }

  /**
   * Kastad projektil i båge — Jordvredets stenbumlingar. Kastvinkeln räknas
   * ut ur skottens gravitation (3.2 i update), så stenen landar där spelaren
   * stod när den kastades. Flytta dig, eller ta smällen.
   */
  enemyLob(e, target, hSpeed, dmg, size = 1.0) {
    const dx = target.pos.x - e.pos.x, dz = target.pos.z - e.pos.z;
    const d = Math.hypot(dx, dz) || 1;
    const t = d / hSpeed;
    const dy = target.pos.y - (e.pos.y + e.height * 0.8);
    this.bullets.push({
      x: e.pos.x + (dx / d) * (e.radius + 0.6),
      y: e.pos.y + e.height * 0.8,
      z: e.pos.z + (dz / d) * (e.radius + 0.6),
      vx: (dx / d) * hSpeed,
      vy: dy / t + 0.5 * 3.2 * t,
      vz: (dz / d) * hSpeed,
      life: t + 2, dmg, radius: size, boom: true,
      col: [0.62, 0.58, 0.48],
    });
  }

  // -------------------------------------------------------------- explosion

  explode(ctx, x, y, z, radius, dmg, source) {
    ctx.sound.explode();
    ctx.freeze(0.07);
    ctx.particles.burst(x, y, z, 26, {
      speed: radius * 2.6, life: 0.5, size: 1.1, size2: 0.1,
      col: [1.0, 0.6, 0.2], alpha: 0.95, drag: 0.9, grav: -4,
    });
    ctx.particles.burst(x, y, z, 12, {
      speed: radius * 1.4, life: 0.7, size: 1.6, size2: 0.2,
      col: [0.4, 0.25, 0.2], alpha: 0.5, drag: 1.2, grav: 2,
    });
    for (const e of ctx.enemies) {
      if (!e.alive) continue;
      const d = Math.hypot(e.pos.x - x, e.pos.y + e.height * 0.5 - y, e.pos.z - z);
      if (d < radius + e.radius) {
        const falloff = 1 - clamp((d - e.radius) / radius, 0, 1);
        if (e.damage(dmg * (0.45 + falloff * 0.55), ctx, false)) ctx.onEnemyKilled(e);
      }
    }
    ctx.player.shake = Math.min(1.4, ctx.player.shake + 0.35);
  }

  /** Bossens markvåg — träffar bara spelaren. */
  shockwave(ctx, x, y, z, radius, dmg) {
    ctx.sound.explode();
    for (let i = 0; i < 46; i++) {
      const a = (i / 46) * TAU;
      ctx.particles.spawn({
        x, y: y + 0.4, z,
        vx: Math.cos(a) * radius * 1.5, vy: rand(1, 4), vz: Math.sin(a) * radius * 1.5,
        life: 0.65, size: 1.2, size2: 0.2, col: [1.0, 0.35, 0.45], alpha: 0.9, drag: 1.1, grav: -6,
      });
    }
    const d = Math.hypot(ctx.player.pos.x - x, ctx.player.pos.z - z);
    if (d < radius && Math.abs(ctx.player.pos.y - y) < 6) {
      if (ctx.player.takeDamage(dmg)) ctx.sound.hurt();
    }
    ctx.player.shake = Math.min(1.6, ctx.player.shake + 0.6);
  }

  // ------------------------------------------------------------------ drops

  dropLoot(ctx, e) {
    const orbs = e.boss ? 8 : e.xp > 10 ? 3 : 1;
    const each = Math.max(1, Math.round((e.xp / orbs) * ctx.player.stats.xpMult));
    for (let i = 0; i < orbs; i++) {
      const a = rand(TAU);
      this.pickups.push({
        kind: 'xp', value: each,
        x: e.pos.x + Math.cos(a) * rand(0, 1.2),
        y: e.pos.y + e.height * 0.5,
        z: e.pos.z + Math.sin(a) * rand(0, 1.2),
        vx: Math.cos(a) * rand(2, 6), vy: rand(4, 8), vz: Math.sin(a) * rand(2, 6),
        life: 26, phase: rand(TAU), col: [0.4, 1.0, 0.75],
      });
    }
    // Guld faller bara i äventyret — det är där det finns något att handla för.
    if (ctx.mode === 'adventure') {
      const a = rand(TAU);
      this.pickups.push({
        kind: 'gold', value: Math.max(1, Math.round(e.xp * 1.6 * (1 + ctx.adventure.level * 0.06))),
        x: e.pos.x, y: e.pos.y + e.height * 0.5, z: e.pos.z,
        vx: Math.cos(a) * rand(2, 5), vy: rand(4, 7), vz: Math.sin(a) * rand(2, 5),
        life: 30, phase: rand(TAU), col: [1.0, 0.82, 0.25],
      });
    }
    // Rustningsdelar: säkra från bossar och eliter, annars ett fynd bland många.
    if (ctx.mode === 'adventure' && (e.boss || e.elite || Math.random() < 0.06)) {
      this.pickups.push({
        kind: 'armor', value: e.boss ? 2 : 1,
        x: e.pos.x, y: e.pos.y + e.height * 0.6, z: e.pos.z,
        vx: rand(-2, 2), vy: rand(5, 8), vz: rand(-2, 2),
        life: 40, phase: rand(TAU), col: [0.72, 0.80, 0.95],
      });
    }
    if (e.boss || Math.random() < 0.07) {
      this.pickups.push({
        kind: 'hp', value: e.boss ? 60 : 25,
        x: e.pos.x, y: e.pos.y + 1, z: e.pos.z,
        vx: rand(-2, 2), vy: 6, vz: rand(-2, 2),
        life: 30, phase: rand(TAU), col: [1.0, 0.35, 0.45],
      });
    }
  }

  // ----------------------------------------------------------------- update

  update(dt, ctx) {
    const p = ctx.player;
    this.updatePatches(dt, ctx);

    // spelarens skott
    for (let i = this.shots.length - 1; i >= 0; i--) {
      const s = this.shots[i];
      s.life -= dt;
      const len = Math.hypot(s.vx, s.vy, s.vz) * dt;
      const dx = s.vx / (len / dt || 1), dy = s.vy / (len / dt || 1), dz = s.vz / (len / dt || 1);
      let removed = false;

      for (const e of ctx.enemies) {
        if (!e.alive || s.hits.has(e)) continue;
        if (segmentHitsSphere(s.x, s.y, s.z, dx, dy, dz, len,
          e.pos.x, e.pos.y + e.height * 0.5, e.pos.z, e.radius + s.radius)) {
          s.hits.add(e);
          const killed = e.damage(s.dmg + (ctx.player.stats.burn || 0), ctx, s.crit);
          // eldbollen talar genom sin explosion, lasern knäpper elektriskt,
          // allt annat får den vanliga träffen
          if (!s.fireball) {
            ctx.sound[s.beam ? (s.crit ? 'laserCrit' : 'laserHit')
                             : (s.crit ? 'crit' : 'hit')]();
          }
          if (p.stats.lifesteal > 0) p.heal(s.dmg * p.stats.lifesteal);
          if (killed) ctx.onEnemyKilled(e);
          if (s.explosive > 0) {
            this.explode(ctx, s.x, s.y, s.z, s.explosive, s.dmg * 0.6);
            if (s.fireball) this.spawnFirePatch(ctx, s.x, s.z, s.explosive * 0.85, s.dmg * 0.09);
            removed = true;
            break;
          }
          if (s.pierce-- <= 0) { removed = true; break; }
        }
      }
      if (removed) { this.shots.splice(i, 1); continue; }

      s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
      if (s.life <= 0 || s.y < terrainHeight(s.x, s.z) - 0.2) {
        if (s.explosive > 0 && s.life > 0) {
          this.explode(ctx, s.x, s.y, s.z, s.explosive, s.dmg * 0.6);
          if (s.fireball) this.spawnFirePatch(ctx, s.x, s.z, s.explosive * 0.85, s.dmg * 0.09);
        } else ctx.particles.burst(s.x, s.y, s.z, 4,
          { speed: 3, life: 0.2, size: 0.3, col: s.col, alpha: 0.8, drag: 0.8 });
        this.shots.splice(i, 1);
        continue;
      }
      ctx.particles.spawn({
        x: s.x, y: s.y, z: s.z, life: 0.14, size: s.radius * 1.1, size2: 0,
        col: s.col, alpha: 0.65, drag: 0.2,
      });
    }

    // fiendens skott
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      b.life -= dt;
      b.vy -= 3.2 * dt;
      b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
      /*
       * Parering: under det öppna fönstret slås inkommande skott tillbaka mot
       * den närmaste fienden i stället för att träffa. Räckvidden är generös
       * (3,4 m) och gäller runtom, inte bara framåt — pareringen ska belöna
       * tajming, inte kräva att man dessutom står vänd åt rätt håll.
       */
      if (p.parryTime > 0 && !b.parried) {
        const pd = Math.hypot(b.x - p.pos.x, b.y - (p.pos.y + 1.1), b.z - p.pos.z);
        if (pd < 3.4) { this.reflectBullet(ctx, b, i); continue; }
      }
      const hitPlayer = Math.hypot(b.x - p.pos.x, b.y - (p.pos.y + 1.1), b.z - p.pos.z) < b.radius + p.radius + 0.35;
      if (hitPlayer) {
        if (p.takeDamage(b.dmg)) {
          ctx.sound.hurt();
          ctx.particles.burst(b.x, b.y, b.z, 10,
            { speed: 5, life: 0.35, size: 0.45, col: b.col, alpha: 0.9, drag: 0.6 });
        }
        this.bullets.splice(i, 1);
        continue;
      }
      if (b.life <= 0 || b.y < terrainHeight(b.x, b.z) - 0.3) {
        // stenbumlingen slår ner med en markstöt — även en miss är farlig nära
        if (b.boom) this.shockwave(ctx, b.x, b.y, b.z, 4.5, b.dmg * 0.7);
        ctx.particles.burst(b.x, b.y, b.z, b.boom ? 14 : 5,
          { speed: b.boom ? 7 : 3, life: 0.25, size: b.boom ? 0.6 : 0.35, col: b.col, alpha: 0.7, drag: 0.8 });
        this.bullets.splice(i, 1);
        continue;
      }
      ctx.particles.spawn({
        x: b.x, y: b.y, z: b.z, life: 0.16, size: 0.4, size2: 0,
        col: b.col, alpha: 0.5, drag: 0.2,
      });
    }

    // upplockningar
    const magnet = p.stats.pickupRadius;
    for (let i = this.pickups.length - 1; i >= 0; i--) {
      const q = this.pickups[i];
      q.life -= dt;
      q.phase += dt * 3;
      const dx = p.pos.x - q.x, dy = (p.pos.y + 1) - q.y, dz = p.pos.z - q.z;
      const d = Math.hypot(dx, dy, dz);
      if (d < magnet) {
        const pull = lerp(26, 64, 1 - d / magnet) * dt;
        q.vx += (dx / d) * pull; q.vy += (dy / d) * pull; q.vz += (dz / d) * pull;
      } else {
        q.vy -= 24 * dt;
      }
      const fr = Math.exp(-1.6 * dt);
      q.vx *= fr; q.vz *= fr;
      q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt;
      const gh = Math.max(terrainHeight(q.x, q.z), WATER_LEVEL) + 0.5;
      if (q.y < gh) { q.y = gh; q.vy = Math.abs(q.vy) * 0.35; }

      if (d < 1.5) {
        if (q.kind === 'xp') { ctx.addXP(q.value); ctx.sound.pickup(); }
        else if (q.kind === 'gold') { ctx.addGold(q.value); ctx.sound.coin(); }
        else if (q.kind === 'armor') { ctx.addArmor(q.value); }
        else { p.heal(q.value); ctx.sound.heal(); ctx.toast(`+${q.value} HP`); }
        ctx.particles.burst(q.x, q.y, q.z, 6,
          { speed: 3, life: 0.3, size: 0.35, col: q.col, alpha: 0.9, drag: 0.7 });
        this.pickups.splice(i, 1);
        continue;
      }
      if (q.life <= 0) this.pickups.splice(i, 1);
    }
  }

  draw(rend, time) {
    const B = rend.dyn;
    for (const s of this.shots) {
      if (s.fireball) {
        // eldboll: pulserande klot med eldsvans
        const pulse = 1 + Math.sin(time * 26) * 0.12;
        B.sphere.push(s.x, s.y, s.z, s.radius * 2.2 * pulse, s.radius * 2.2 * pulse,
          s.radius * 2.2 * pulse, s.col, 0, time * 8, 0, 1.4);
        B.octa.push(s.x, s.y, s.z, s.radius * 1.4, s.radius * 2.0, s.radius * 1.4,
          [1.0, 0.85, 0.4], 0, -time * 10, 0, 1.2);
        rend.particles.spawn({
          x: s.x + rand(-0.3, 0.3), y: s.y + rand(-0.3, 0.3), z: s.z + rand(-0.3, 0.3),
          vx: -s.vx * 0.06, vy: -s.vy * 0.06 + 1.5, vz: -s.vz * 0.06,
          life: rand(0.3, 0.55), size: rand(0.6, 1.0), size2: 0.1,
          col: [1.0, rand(0.35, 0.6), 0.12], alpha: 0.9, drag: 0.4,
        });
        continue;
      }
      if (s.beam) {
        // laserstråle: oktaedern sträcks ut längs färdriktningen
        const sp = Math.hypot(s.vx, s.vy, s.vz) || 1;
        const yawD = Math.atan2(s.vx, s.vz);
        const pitchD = Math.asin(s.vy / sp) + Math.PI / 2;
        B.octa.push(s.x, s.y, s.z, s.radius * 0.55, 1.5, s.radius * 0.55, s.col,
          pitchD, yawD, 0, 1.5);
      } else {
        B.octa.push(s.x, s.y, s.z, s.radius * 1.5, s.radius * 2.4, s.radius * 1.5, s.col,
          0, time * 12, time * 6, 1.3);
      }
    }
    for (const b of this.bullets) {
      // hitboxen styr storleken, så en stenbumling ser ut som en
      const bs = (b.radius || 0.45) * 1.65;
      B.sphere.push(b.x, b.y, b.z, bs, bs, bs, b.col, 0, 0, 0, b.boom ? 0.35 : 1.2);
    }
    for (const q of this.pickups) {
      const s = q.kind === 'xp' ? 0.55 : q.kind === 'gold' ? 0.5 : 0.9;
      const lift = Math.sin(q.phase) * 0.12;
      // rustningsdelen är en plåt, inte ett klot — den ska synas för vad den är
      if (q.kind === 'armor') {
        B.box.push(q.x, q.y + lift, q.z, 0.42, 0.5, 0.14, q.col, 0.2, q.phase * 0.6, 0, 0.9);
      } else {
        B.octa.push(q.x, q.y + lift, q.z, s, s * 1.5, s, q.col, 0, q.phase, 0, 1.1);
      }
      rend.particles.spawn({
        x: q.x, y: q.y + lift, z: q.z, life: 0.2, size: s * 1.6, size2: 0,
        col: q.col, alpha: 0.35, drag: 0.1,
      });
    }
  }
}

// ═══ hud.js ═══
// All DOM-baserad UI: HUD-siffror, banderoller, radar, menyer.



const $ = (id) => document.getElementById(id);

const VERSION = 'BETA 0.9';

const DOT_COL = {
  grunt: '#ff5b5b', spitter: '#c07bff', charger: '#ffab3d',
  tank: '#4ce0a8', boss: '#ff3d7f',
  drone: '#ffd93d', sniper: '#4dffc3', hover: '#8f9bff',
  vildboss: '#ff3d7f', cityboss: '#ff3d7f',
};

class HUD {
  constructor() {
    this.hud = $('hud');
    this.overlay = $('overlay');
    this.hpFill = $('hpFill');
    this.hpText = $('hpText');
    this.armTag = $('armTag');
    this.xpFill = $('xpFill');
    this.dashRow = $('dashRow');
    this.banner = $('banner');
    this.vignette = $('vignette');
    this.bossBar = $('bossBar');
    this.bossFill = $('bossFill');
    this.bossName = $('bossName');
    this.toasts = $('toasts');
    this.fireRow = $('fireRow');
    this.fireFill = $('fireFill');
    this.parryRow = $('parryRow');
    this.parryFill = $('parryFill');
    this.tParry = $('tParry');
    this.comboRow = $('comboRow');
    this.comboPips = [...this.comboRow.children];
    this.cross = $('crosshair');
    this.initFloaters();
    this.stick = $('stick');
    this.knob = $('knob');
    this.tFire = $('tFire');
    this.objective = $('objective');
    this.objLabel = $('objLabel');
    this.objValue = $('objValue');
    this.map = $('minimap');
    this.mapCtx = this.map.getContext('2d');
    this.bannerT = 0;
    this.dashPips = [];
    this.lastFps = 0;
  }

  showHUD(on) { this.hud.classList.toggle('hidden', !on); }

  /** Toppraden heter olika saker i de två spelsätten. */
  setMode(mode) {
    const adv = mode === 'adventure';
    $('waveLbl').textContent = adv ? 'LEVEL' : 'WAVE';
    $('levelLbl').textContent = adv ? 'RANK' : 'LEVEL';
    $('goldStat').classList.toggle('hidden', !adv);   // guld finns bara i äventyret
  }

  // ------------------------------------------------------- skadesiffror

  initFloaters() {
    this.fltRoot = $('floaters');
    this.flts = [];
    for (let i = 0; i < 22; i++) {
      const el = document.createElement('div');
      el.className = 'flt';
      this.fltRoot.appendChild(el);
      this.flts.push({ el, life: 0, max: 1, x: 0, y: 0, z: 0, drift: 0, key: null, total: 0 });
    }
    this.fltNext = 0;
  }

  clearFloaters() {
    if (!this.flts) return;
    for (const f of this.flts) { f.life = 0; f.key = null; f.el.style.opacity = '0'; }
  }

  /**
   * Snabba träffar på samma fiende räknas ihop till en siffra som tickar upp,
   * i stället för en hög med överlappande tal.
   */
  floater(x, y, z, amount, crit, key) {
    let f = key ? this.flts.find((q) => q.key === key && q.life > 0) : null;
    if (f) {
      f.total += amount;
      f.life = Math.max(f.life, f.max * 0.75);
      if (crit) f.crit = true;
    } else {
      f = this.flts[this.fltNext];
      this.fltNext = (this.fltNext + 1) % this.flts.length;
      f.key = key || null;
      f.total = amount;
      f.crit = !!crit;
      f.life = f.max = 0.85;
      f.drift = (Math.random() - 0.5) * 70;
      f.rise = 40 + Math.random() * 26;
    }
    f.x = x; f.y = y; f.z = z;
    f.el.textContent = String(Math.round(f.total));
    f.el.className = `flt ${f.crit ? 'crit' : 'norm'}`;
  }

  /** Projicerar siffrorna från världen till skärmen. */
  updateFloaters(dt, g) {
    const vp = g.renderer.vp;
    const W = innerWidth, H = innerHeight;
    for (const f of this.flts) {
      if (f.life <= 0) continue;
      f.life -= dt;
      if (f.life <= 0) { f.el.style.opacity = '0'; f.key = null; continue; }
      const t = 1 - f.life / f.max;
      const cw = vp[3] * f.x + vp[7] * f.y + vp[11] * f.z + vp[15];
      if (cw <= 0.01) { f.el.style.opacity = '0'; continue; }
      const sx = ((vp[0] * f.x + vp[4] * f.y + vp[8] * f.z + vp[12]) / cw * 0.5 + 0.5) * W;
      const sy = (1 - ((vp[1] * f.x + vp[5] * f.y + vp[9] * f.z + vp[13]) / cw * 0.5 + 0.5)) * H;
      const rise = t * (f.rise || 46);
      const pop = t < 0.18 ? 1 + (0.18 - t) * 2.2 : 1;
      f.el.style.transform =
        `translate(${(sx + f.drift * t - 14).toFixed(1)}px, ${(sy - rise).toFixed(1)}px) scale(${pop.toFixed(2)})`;
      f.el.style.opacity = String(Math.min(1, (1 - t) * 2.2));
    }
  }

  hideOverlay() { this.overlay.classList.add('hidden'); }
  showOverlay(html) {
    this.overlay.innerHTML = html;
    this.overlay.classList.remove('hidden');
  }

  setDashPips(n) {
    if (this.dashPips.length === n) return;
    this.dashRow.innerHTML = '';
    this.dashPips = [];
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'pip';
      this.dashRow.appendChild(d);
      this.dashPips.push(d);
    }
  }

  toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    this.toasts.appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity .4s';
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 420);
    }, 2600);
  }

  showBanner(text, sub = '', time = 2.2) {
    this.banner.innerHTML = text + (sub ? `<span class="sub">${sub}</span>` : '');
    this.bannerT = time;
  }

  setBoss(e, name) {
    this.boss = e;
    if (name) this.bossName.textContent = name;
    this.bossBar.classList.toggle('hidden', !e);
  }

  /** Uppdragsraden: vad nivån kräver och hur långt det gått. */
  setObjective(mission) {
    const on = !!mission;
    this.objective.classList.toggle('hidden', !on);
    this.hud.classList.toggle('obj', on);
    if (!on) return;
    if (this.objLabel.textContent !== mission.label) this.objLabel.textContent = mission.label;
    const v = mission.status;
    if (this.objValue.textContent !== v) this.objValue.textContent = v;
    this.objective.classList.toggle('done', mission.done);
  }

  /** Uppdaterar allt som ändras varje bildruta. */
  update(g, dt) {
    const p = g.player;

    // Korshåret sitter där muspekaren är (utan muslås), annars i mitten.
    const inp = g.input;
    const free = inp && !inp.locked && !inp.touch;

    if (inp && inp.touch) {
      // spaken ritas där tummen landade
      this.stick.classList.toggle('on', inp.stickActive);
      if (inp.stickActive) {
        this.stick.style.left = `${inp.stickBase.x}px`;
        this.stick.style.top = `${inp.stickBase.y}px`;
        this.knob.style.transform = `translate(${inp.stickVec.x * 38}px, ${inp.stickVec.y * 38}px)`;
      }
      const wild = g.worldId === 'wild';
      this.tFire.classList.toggle('hidden', !wild);
      if (wild) this.tFire.classList.toggle('cool', p.fireballCd > 0);
      this.tParry.classList.toggle('hidden', !wild);
      if (wild) this.tParry.classList.toggle('cool', p.parryCd > 0);
    }
    const cx = free ? (inp.cursorNX * 0.5 + 0.5) * 100 : 50;
    const cy = free ? (inp.cursorNY * 0.5 + 0.5) * 100 : 50;
    this.cross.style.left = `${cx}%`;
    this.cross.style.top = `${cy}%`;
    // bara ett sikte på skärmen: göm systempekaren under spelets gång
    const want = g.state === 'playing' && free ? 'none' : 'crosshair';
    if (this._cursor !== want) { this._cursor = want; g.canvas.style.cursor = want; }
    const arm = p.armor | 0;
    this.armTag.classList.toggle('hidden', arm <= 0);
    if (arm > 0) {
      const cut = Math.round((1 - 1 / (1 + arm * 0.06)) * 100);
      this.armTag.textContent = `🪖 ${arm} · −${cut}%`;
    }

    const hpFrac = clamp(p.hp / p.stats.maxHp, 0, 1);
    this.hpFill.style.transform = `scaleX(${hpFrac})`;
    this.hpText.textContent = `${Math.ceil(p.hp)} / ${Math.round(p.stats.maxHp)}`;
    this.xpFill.style.transform = `scaleX(${clamp(g.xp / g.xpNeeded, 0, 1)})`;

    this.setDashPips(p.stats.dashMax);
    for (let i = 0; i < this.dashPips.length; i++) {
      const on = i < p.dashCharges;
      this.dashPips[i].classList.toggle('on', on);
      if (!on && i === p.dashCharges) {
        const f = p.dashTimer / p.stats.dashRecharge;
        this.dashPips[i].style.background =
          `linear-gradient(90deg, rgba(77,243,255,.75) ${f * 100}%, rgba(255,255,255,.13) ${f * 100}%)`;
      } else {
        this.dashPips[i].style.background = '';
      }
    }

    // eldboll + svärdskombo (bara Vildheim)
    if (g.worldId === 'wild') {
      this.fireRow.classList.remove('hidden');
      const frac = 1 - clamp(p.fireballCd / p.fireballCdMax, 0, 1);
      this.fireFill.style.transform = `scaleX(${frac})`;
      this.fireRow.classList.toggle('ready', frac >= 1);

      // pareringens återladdning, med samma språk som eldbollen
      this.parryRow.classList.remove('hidden');
      const pf = 1 - clamp(p.parryCd / 0.85, 0, 1);
      this.parryFill.style.transform = `scaleX(${pf})`;
      this.parryRow.classList.toggle('ready', pf >= 1);

      this.comboRow.classList.remove('hidden');
      const hits = p.comboTimer > 0 ? p.combo + 1 : 0;
      for (let i = 0; i < 3; i++) {
        const lit = i < hits;
        this.comboPips[i].classList.toggle('lit', lit && !(hits === 2 && i === 2));
        // tredje pricken pulsar guld när nästa hugg blir en finisher
        this.comboPips[i].classList.toggle('next', i === 2 && hits === 2);
      }
    } else {
      this.fireRow.classList.add('hidden');
      this.parryRow.classList.add('hidden');
      this.comboRow.classList.add('hidden');
    }

    this.setObjective(g.mode === 'adventure' ? g.adventure.mission : null);

    $('waveNum').textContent = g.mode === 'adventure'
      ? (g.adventure.level || '—')
      : (g.waves.wave || '—');
    $('levelNum').textContent = g.level;
    if (g.mode === 'adventure') $('goldNum').textContent = g.gold;
    $('killNum').textContent = g.kills;
    const t = Math.floor(g.elapsed);
    $('timeNum').textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
    if (g.frameCount % 15 === 0) $('fpsNum').textContent = Math.round(g.fps);

    this.vignette.style.opacity = String(clamp(p.hitFlash * 0.8 + (1 - hpFrac) * 0.35, 0, 1));

    if (this.bannerT > 0) {
      this.bannerT -= dt;
      const a = clamp(this.bannerT > 1.6 ? (2.2 - this.bannerT) / 0.6 : this.bannerT / 1.0, 0, 1);
      this.banner.style.opacity = String(a);
      this.banner.style.transform = `translate(-50%,-50%) scale(${1 + (1 - a) * 0.06})`;
    } else if (this.banner.style.opacity !== '0') {
      this.banner.style.opacity = '0';
    }

    if (this.boss && this.boss.alive) {
      this.bossFill.style.transform = `scaleX(${clamp(this.boss.hp / this.boss.maxHp, 0, 1)})`;
    } else if (this.boss) {
      this.setBoss(null);
    }

    this.updateFloaters(dt, g);
    this.drawMinimap(g);
  }

  drawMinimap(g) {
    const c = this.mapCtx, S = this.map.width, R = S / 2;
    const range = 82;
    const p = g.player;
    const yaw = p.camYaw;
    const cos = Math.cos(yaw), sin = Math.sin(yaw);

    c.clearRect(0, 0, S, S);
    c.save();
    c.beginPath(); c.arc(R, R, R - 2, 0, Math.PI * 2); c.clip();
    c.fillStyle = 'rgba(4,10,20,.55)';
    c.fillRect(0, 0, S, S);

    // arenagräns
    const scale = R / range;
    const pr = Math.hypot(p.pos.x, p.pos.z);
    c.strokeStyle = 'rgba(77,243,255,.25)';
    c.lineWidth = 3;
    c.beginPath();
    const relx = -p.pos.x, relz = -p.pos.z;
    const mx = (-cos * relx + sin * relz) * scale + R;
    const my = -(sin * relx + cos * relz) * scale + R;
    c.arc(mx, my, ARENA_RADIUS * scale, 0, Math.PI * 2);
    c.stroke();

    const plot = (wx, wz) => {
      const rx = wx - p.pos.x, rz = wz - p.pos.z;
      return [(-cos * rx + sin * rz) * scale + R, -(sin * rx + cos * rz) * scale + R];
    };

    c.globalAlpha = 0.85;
    for (const q of g.combat.pickups) {
      const [x, y] = plot(q.x, q.z);
      c.fillStyle = q.kind === 'xp' ? '#4dffa6' : '#ff5b7f';
      c.fillRect(x - 2, y - 2, 4, 4);
    }
    const adv = g.mode === 'adventure';
    for (const e of g.enemies) {
      if (!e.alive) continue;
      let [x, y] = plot(e.pos.x, e.pos.z);
      let r = e.boss ? 9 : e.type === 'tank' ? 6 : 4.5;
      const off = Math.hypot(x - R, y - R);
      if (off > R - 6) {
        // I äventyret måste man kunna hitta monstren: det som ligger utanför
        // radarns räckvidd fästs som en liten prick vid kanten i rätt riktning.
        if (!adv) continue;
        const s = (R - 7) / off;
        x = R + (x - R) * s; y = R + (y - R) * s;
        r = e.boss ? 5 : 2.6;
      }
      c.fillStyle = DOT_COL[e.type] || '#fff';
      // vakter som ännu inte upptäckt dig ligger blekare på radarn
      c.globalAlpha = e.guard ? 0.4 : 0.85;
      c.beginPath();
      c.arc(x, y, r, 0, Math.PI * 2);
      c.fill();
    }
    c.globalAlpha = 1;

    // Uppdragsmålen: romber som alltid syns, även utanför radarns räckvidd.
    // Utan dem blir "hitta tre kraftkärnor" bara irrande.
    const marks = adv && g.adventure.mission ? g.adventure.mission.markers() : [];
    for (const m of marks) {
      let [x, y] = plot(m.x, m.z);
      const off = Math.hypot(x - R, y - R);
      let s = 5;
      if (off > R - 8) {
        const k = (R - 9) / off;
        x = R + (x - R) * k; y = R + (y - R) * k;
        s = 3.5;
      }
      c.save();
      c.translate(x, y);
      c.rotate(Math.PI / 4);
      c.fillStyle = m.col;
      c.shadowColor = m.col;
      c.shadowBlur = 6;
      c.fillRect(-s, -s, s * 2, s * 2);
      c.restore();
    }

    // spelaren + blickriktning
    c.fillStyle = '#eaf6ff';
    c.beginPath();
    c.moveTo(R, R - 9); c.lineTo(R - 6, R + 7); c.lineTo(R + 6, R + 7);
    c.closePath(); c.fill();
    c.restore();

    c.strokeStyle = 'rgba(77,243,255,.35)';
    c.lineWidth = 2;
    c.beginPath(); c.arc(R, R, R - 2, 0, Math.PI * 2); c.stroke();
  }
