/** Närmaste träffpunkt mellan en sträcka och en sfär — hindrar snabba skott från att missa. */
function segmentHitsSphere(px, py, pz, dx, dy, dz, len, cx, cy, cz, r) {
  const mx = cx - px, my = cy - py, mz = cz - pz;
  let t = mx * dx + my * dy + mz * dz;
  t = clamp(t, 0, len);
  const hx = px + dx * t - cx, hy = py + dy * t - cy, hz = pz + dz * t - cz;
  return hx * hx + hy * hy + hz * hz <= r * r;
}

class Combat {
  constructor() {
    this.shots = [];
    this.bullets = [];
    this.pickups = [];
    this.patches = [];
  }

  reset() {
    this.shots.length = 0; this.bullets.length = 0;
    this.pickups.length = 0; this.patches.length = 0;
  }

  // ------------------------------------------------------------ svärdssving

  swordSwing(ctx) {
    const p = ctx.player, st = p.stats;
    // tre hugg i följd: det tredje är en finisher med överhandshugg
    p.combo = p.comboTimer > 0 ? (p.combo + 1) % 3 : 0;
    p.comboTimer = 1.5;
    const fin = p.combo === 2;

    p.swingSide = -(p.swingSide || 1);
    p.swingFinisher = fin;
    p.swingDur = fin ? 0.34 : 0.26;
    p.swingTime = p.swingDur;
    p.fireTimer = 1 / (st.fireRate * (fin ? 0.42 : 0.55));
    ctx.sound[fin ? 'finisher' : 'swing']();

    const range = (3.8 + st.multishot * 0.35) * (fin ? 1.25 : 1);
    const arc = (1.15 + st.multishot * 0.12) * (fin ? 1.3 : 1);   // halv svepvinkel
    p.aimDir(ctx.enemies);
    let hitAny = false;

    for (const e of ctx.enemies) {
      if (!e.alive) continue;
      const dx = e.pos.x - p.pos.x, dz = e.pos.z - p.pos.z;
      const dist = Math.hypot(dx, dz);
      if (dist > range + e.radius) continue;
      if (Math.abs(angleDelta(p.yaw, Math.atan2(dx, dz))) > arc) continue;
      if (Math.abs((e.pos.y + e.height * 0.5) - (p.pos.y + 1.3)) > e.height * 0.5 + 2.6) continue;

      const crit = Math.random() < st.crit || fin;
      const dmg = st.damage * (fin ? 2.8 : 1.7) * (crit ? st.critMult : 1);
      const killed = e.damage(dmg, ctx, crit);
      ctx.sound[crit ? 'crit' : 'hit']();
      if (st.lifesteal > 0) p.heal(dmg * st.lifesteal);
      // rejäl knockback — svagare mot tunga fiender
      const kb = (fin ? 27 : 16) / (1 + e.radius);
      if (dist > 0.01) { e.vel.x += (dx / dist) * kb; e.vel.z += (dz / dist) * kb; }
      if (fin) e.vel.y += 7;
      e.slow = Math.max(e.slow, fin ? 0.7 : 0.3);
      if (st.explosive > 0) this.explode(ctx, e.pos.x, e.pos.y + e.height * 0.5, e.pos.z, st.explosive, dmg * 0.4);
      if (killed) ctx.onEnemyKilled(e);
      hitAny = true;
    }

    // svepande partikelbåge framför krigaren
    const n = fin ? 22 : 13;
    for (let i = 0; i < n; i++) {
      const a = p.yaw + (i / (n - 1) - 0.5) * arc * 2;
      const d = range * 0.75;
      ctx.particles.spawn({
        x: p.pos.x + Math.sin(a) * d, y: p.pos.y + 1.3 + (Math.random() - 0.5) * (fin ? 1.6 : 0.4),
        z: p.pos.z + Math.cos(a) * d,
        vx: Math.sin(a) * (fin ? 7 : 3), vy: fin ? rand(1, 4) : 0.5, vz: Math.cos(a) * (fin ? 7 : 3),
        life: fin ? 0.34 : 0.18, size: fin ? 0.95 : 0.55, size2: 0.05,
        col: fin ? [1.0, 0.72, 0.25] : hitAny ? [1.0, 0.8, 0.5] : [0.8, 0.85, 0.95],
        alpha: fin ? 0.9 : 0.7, drag: 0.5,
      });
    }
    p.shake = Math.min(0.5, p.shake + (fin ? 0.3 : hitAny ? 0.08 : 0.03));
  }

  // -------------------------------------------------------------- eldhärdar

  /** Brinnande mark efter en eldboll — skadar fiender som står kvar i lågorna. */
  spawnFirePatch(ctx, x, z, radius, dmg) {
    if (this.patches.length > 7) this.patches.shift();
    this.patches.push({
      x, y: terrainHeight(x, z), z,
      r: radius, life: 4.5, max: 4.5, tick: 0, dmg,
    });
  }

  updatePatches(dt, ctx) {
    for (let i = this.patches.length - 1; i >= 0; i--) {
      const q = this.patches[i];
      q.life -= dt;
      if (q.life <= 0) { this.patches.splice(i, 1); continue; }
      const fade = Math.min(1, q.life / 1.2);

      // lågor och glöd
      for (let k = 0; k < 3; k++) {
        const a = rand(TAU), d = Math.sqrt(Math.random()) * q.r;
        const px = q.x + Math.cos(a) * d, pz = q.z + Math.sin(a) * d;
        ctx.particles.spawn({
          x: px, y: terrainHeight(px, pz) + 0.1, z: pz,
          vx: rand(-0.5, 0.5), vy: rand(2.2, 4.5), vz: rand(-0.5, 0.5),
          life: rand(0.35, 0.7), size: rand(0.5, 1.0) * fade, size2: 0.05,
          col: [1.0, rand(0.35, 0.65), 0.12], alpha: 0.75 * fade, drag: 0.5,
        });
      }

      // skada var 0,35 s
      q.tick -= dt;
      if (q.tick <= 0) {
        q.tick = 0.35;
        for (const e of ctx.enemies) {
          if (!e.alive) continue;
          if (Math.hypot(e.pos.x - q.x, e.pos.z - q.z) > q.r + e.radius) continue;
          if (e.pos.y - q.y > 3.5) continue;
          if (e.damage(q.dmg, ctx, false)) ctx.onEnemyKilled(e);
        }
      }
    }
  }

  // ---------------------------------------------------------------- eldboll

  castFireball(ctx) {
    const p = ctx.player, st = p.stats;
    const dir = p.aimDir(ctx.enemies);
    const m = p.muzzle();
    const n = st.multishot;
    for (let i = 0; i < n; i++) {
      const off = n === 1 ? 0 : (i / (n - 1) - 0.5) * 0.22;
      const c = Math.cos(off), s = Math.sin(off);
      this.shots.push({
        x: m.x, y: m.y + 0.3, z: m.z,
        vx: (dir.x * c + dir.z * s) * st.projSpeed * 0.6,
        vy: dir.y * st.projSpeed * 0.6 + 2,
        vz: (-dir.x * s + dir.z * c) * st.projSpeed * 0.6,
        life: 2.6,
        dmg: st.damage * 3.2,
        crit: false,
        pierce: 0,
        radius: 0.95,
        explosive: 4.5 + st.explosive,
        hits: new Set(),
        fireball: true,
        col: [1.0, 0.55, 0.15],
      });
    }
    p.fireballCd = p.fireballCdMax;
    ctx.sound.fireball();
    p.shake = Math.min(0.6, p.shake + 0.25);
    ctx.particles.burst(m.x, m.y + 0.3, m.z, 10, {
      speed: 5, life: 0.3, size: 0.6, col: [1.0, 0.6, 0.2], alpha: 0.9, drag: 0.6,
    });
  }

  // ------------------------------------------------------------- spelarskott

  playerShoot(ctx) {
    const p = ctx.player, st = p.stats;
    const city = ctx.worldId === 'city';
    const dir = p.aimDir(ctx.enemies);
    const m = p.muzzle();
    const n = st.multishot;
    for (let i = 0; i < n; i++) {
      const off = n === 1 ? 0 : (i / (n - 1) - 0.5) * st.spread * (n + 1);
      const yawOff = off + rand(-st.spread * 0.5, st.spread * 0.5);
      const c = Math.cos(yawOff), s = Math.sin(yawOff);
      const dx = dir.x * c + dir.z * s;
      const dz = -dir.x * s + dir.z * c;
      const crit = Math.random() < st.crit;
      this.shots.push({
        x: m.x, y: m.y, z: m.z,
        vx: dx * st.projSpeed, vy: dir.y * st.projSpeed, vz: dz * st.projSpeed,
        life: 1.7,
        dmg: st.damage * (crit ? st.critMult : 1),
        crit,
        pierce: st.pierce,
        radius: st.projSize + 0.25,
        explosive: st.explosive,
        hits: new Set(),
        beam: city,
        col: crit ? [1.0, 0.85, 0.35] : city ? [1.0, 0.30, 0.42] : [0.45, 0.95, 1.0],
      });
    }
    ctx.sound[city ? 'laser' : 'shoot']();
    ctx.particles.burst(m.x, m.y, m.z, 4, {
      speed: 4, life: 0.16, size: 0.32,
      col: city ? [1.0, 0.5, 0.6] : [0.6, 0.95, 1.0], alpha: 0.9, drag: 0.7,
    });
    p.shotSide = -p.shotSide;
    p.fireTimer = 1 / st.fireRate;
    p.shake = Math.min(0.35, p.shake + 0.045);
  }

  droneShoot(ctx, x, y, z, target) {
    let dx = target.pos.x - x, dy = target.pos.y + target.height * 0.5 - y, dz = target.pos.z - z;
    const l = Math.hypot(dx, dy, dz) || 1;
    dx /= l; dy /= l; dz /= l;
    this.shots.push({
      x, y, z, vx: dx * 52, vy: dy * 52, vz: dz * 52,
      life: 1.5, dmg: ctx.player.stats.damage * 0.55, crit: false,
      pierce: 0, radius: 0.5, explosive: 0, hits: new Set(),
      col: [1.0, 0.75, 0.25],
    });
    ctx.sound.tone({ f: 900, f2: 420, dur: 0.06, type: 'triangle', vol: 0.05 });
  }

  // ------------------------------------------------------------ fiendeskott

  enemyBullet(e, target, speed, dmg) {
    let dx = target.pos.x - e.pos.x;
    let dy = (target.pos.y + 1.1) - (e.pos.y + e.height * 0.6);
    let dz = target.pos.z - e.pos.z;
    const l = Math.hypot(dx, dy, dz) || 1;
    this.enemyBulletDir(e, dx / l, dy / l, dz / l, speed, dmg);
  }

  enemyBulletDir(e, dx, dy, dz, speed, dmg) {
    this.bullets.push({
      x: e.pos.x + dx * (e.radius + 0.4),
      y: e.pos.y + e.height * 0.6 + dy * 0.4,
      z: e.pos.z + dz * (e.radius + 0.4),
      vx: dx * speed, vy: dy * speed, vz: dz * speed,
      life: 4.5, dmg, radius: 0.45,
      col: e.boss ? [1.0, 0.35, 0.55] : [0.85, 0.45, 1.0],
    });
  }

  // -------------------------------------------------------------- explosion

  explode(ctx, x, y, z, radius, dmg, source) {
    ctx.sound.explode();
    ctx.particles.burst(x, y, z, 26, {
      speed: radius * 2.6, life: 0.5, size: 1.1, size2: 0.1,
      col: [1.0, 0.6, 0.2], alpha: 0.95, drag: 0.9, grav: -4,
    });
    ctx.particles.burst(x, y, z, 12, {
      speed: radius * 1.4, life: 0.7, size: 1.6, size2: 0.2,
      col: [0.4, 0.25, 0.2], alpha: 0.5, drag: 1.2, grav: 2,
    });
    for (const e of ctx.enemies) {
      if (!e.alive) continue;
      const d = Math.hypot(e.pos.x - x, e.pos.y + e.height * 0.5 - y, e.pos.z - z);
      if (d < radius + e.radius) {
        const falloff = 1 - clamp((d - e.radius) / radius, 0, 1);
        if (e.damage(dmg * (0.45 + falloff * 0.55), ctx, false)) ctx.onEnemyKilled(e);
      }
    }
    ctx.player.shake = Math.min(1.4, ctx.player.shake + 0.35);
  }

  /** Bossens markvåg — träffar bara spelaren. */
  shockwave(ctx, x, y, z, radius, dmg) {
    ctx.sound.explode();
    for (let i = 0; i < 46; i++) {
      const a = (i / 46) * TAU;
      ctx.particles.spawn({
        x, y: y + 0.4, z,
        vx: Math.cos(a) * radius * 1.5, vy: rand(1, 4), vz: Math.sin(a) * radius * 1.5,
        life: 0.65, size: 1.2, size2: 0.2, col: [1.0, 0.35, 0.45], alpha: 0.9, drag: 1.1, grav: -6,
      });
    }
    const d = Math.hypot(ctx.player.pos.x - x, ctx.player.pos.z - z);
    if (d < radius && Math.abs(ctx.player.pos.y - y) < 6) {
      if (ctx.player.takeDamage(dmg)) ctx.sound.hurt();
    }
    ctx.player.shake = Math.min(1.6, ctx.player.shake + 0.6);
  }

  // ------------------------------------------------------------------ drops

  dropLoot(ctx, e) {
    const orbs = e.boss ? 8 : e.xp > 10 ? 3 : 1;
    const each = Math.max(1, Math.round((e.xp / orbs) * ctx.player.stats.xpMult));
    for (let i = 0; i < orbs; i++) {
      const a = rand(TAU);
      this.pickups.push({
        kind: 'xp', value: each,
        x: e.pos.x + Math.cos(a) * rand(0, 1.2),
        y: e.pos.y + e.height * 0.5,
        z: e.pos.z + Math.sin(a) * rand(0, 1.2),
        vx: Math.cos(a) * rand(2, 6), vy: rand(4, 8), vz: Math.sin(a) * rand(2, 6),
        life: 26, phase: rand(TAU), col: [0.4, 1.0, 0.75],
      });
    }
    if (e.boss || Math.random() < 0.07) {
      this.pickups.push({
        kind: 'hp', value: e.boss ? 60 : 25,
        x: e.pos.x, y: e.pos.y + 1, z: e.pos.z,
        vx: rand(-2, 2), vy: 6, vz: rand(-2, 2),
        life: 30, phase: rand(TAU), col: [1.0, 0.35, 0.45],
      });
    }
  }

  // ----------------------------------------------------------------- update

  update(dt, ctx) {
    const p = ctx.player;
    this.updatePatches(dt, ctx);

    // spelarens skott
    for (let i = this.shots.length - 1; i >= 0; i--) {
      const s = this.shots[i];
      s.life -= dt;
      const len = Math.hypot(s.vx, s.vy, s.vz) * dt;
      const dx = s.vx / (len / dt || 1), dy = s.vy / (len / dt || 1), dz = s.vz / (len / dt || 1);
      let removed = false;

      for (const e of ctx.enemies) {
        if (!e.alive || s.hits.has(e)) continue;
        if (segmentHitsSphere(s.x, s.y, s.z, dx, dy, dz, len,
          e.pos.x, e.pos.y + e.height * 0.5, e.pos.z, e.radius + s.radius)) {
          s.hits.add(e);
          const killed = e.damage(s.dmg, ctx, s.crit);
          ctx.sound[s.crit ? 'crit' : 'hit']();
          if (p.stats.lifesteal > 0) p.heal(s.dmg * p.stats.lifesteal);
          if (killed) ctx.onEnemyKilled(e);
          if (s.explosive > 0) {
            this.explode(ctx, s.x, s.y, s.z, s.explosive, s.dmg * 0.6);
            if (s.fireball) this.spawnFirePatch(ctx, s.x, s.z, s.explosive * 0.85, s.dmg * 0.09);
            removed = true;
            break;
          }
          if (s.pierce-- <= 0) { removed = true; break; }
        }
      }
      if (removed) { this.shots.splice(i, 1); continue; }

      s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
      if (s.life <= 0 || s.y < terrainHeight(s.x, s.z) - 0.2) {
        if (s.explosive > 0 && s.life > 0) {
          this.explode(ctx, s.x, s.y, s.z, s.explosive, s.dmg * 0.6);
          if (s.fireball) this.spawnFirePatch(ctx, s.x, s.z, s.explosive * 0.85, s.dmg * 0.09);
        } else ctx.particles.burst(s.x, s.y, s.z, 4,
          { speed: 3, life: 0.2, size: 0.3, col: s.col, alpha: 0.8, drag: 0.8 });
        this.shots.splice(i, 1);
        continue;
      }
      ctx.particles.spawn({
        x: s.x, y: s.y, z: s.z, life: 0.14, size: s.radius * 1.1, size2: 0,
        col: s.col, alpha: 0.65, drag: 0.2,
      });
    }

    // fiendens skott
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      b.life -= dt;
      b.vy -= 3.2 * dt;
      b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
      const hitPlayer = Math.hypot(b.x - p.pos.x, b.y - (p.pos.y + 1.1), b.z - p.pos.z) < b.radius + p.radius + 0.35;
      if (hitPlayer) {
        if (p.takeDamage(b.dmg)) {
          ctx.sound.hurt();
          ctx.particles.burst(b.x, b.y, b.z, 10,
            { speed: 5, life: 0.35, size: 0.45, col: b.col, alpha: 0.9, drag: 0.6 });
        }
        this.bullets.splice(i, 1);
        continue;
      }
      if (b.life <= 0 || b.y < terrainHeight(b.x, b.z) - 0.3) {
        ctx.particles.burst(b.x, b.y, b.z, 5,
          { speed: 3, life: 0.25, size: 0.35, col: b.col, alpha: 0.7, drag: 0.8 });
        this.bullets.splice(i, 1);
        continue;
      }
      ctx.particles.spawn({
        x: b.x, y: b.y, z: b.z, life: 0.16, size: 0.4, size2: 0,
        col: b.col, alpha: 0.5, drag: 0.2,
      });
    }

    // upplockningar
    const magnet = p.stats.pickupRadius;
    for (let i = this.pickups.length - 1; i >= 0; i--) {
      const q = this.pickups[i];
      q.life -= dt;
      q.phase += dt * 3;
      const dx = p.pos.x - q.x, dy = (p.pos.y + 1) - q.y, dz = p.pos.z - q.z;
      const d = Math.hypot(dx, dy, dz);
      if (d < magnet) {
        const pull = lerp(26, 64, 1 - d / magnet) * dt;
        q.vx += (dx / d) * pull; q.vy += (dy / d) * pull; q.vz += (dz / d) * pull;
      } else {
        q.vy -= 24 * dt;
      }
      const fr = Math.exp(-1.6 * dt);
      q.vx *= fr; q.vz *= fr;
      q.x += q.vx * dt; q.y += q.vy * dt; q.z += q.vz * dt;
      const gh = Math.max(terrainHeight(q.x, q.z), WATER_LEVEL) + 0.5;
      if (q.y < gh) { q.y = gh; q.vy = Math.abs(q.vy) * 0.35; }

      if (d < 1.5) {
        if (q.kind === 'xp') { ctx.addXP(q.value); ctx.sound.pickup(); }
        else { p.heal(q.value); ctx.sound.heal(); ctx.toast(`+${q.value} HP`); }
        ctx.particles.burst(q.x, q.y, q.z, 6,
          { speed: 3, life: 0.3, size: 0.35, col: q.col, alpha: 0.9, drag: 0.7 });
        this.pickups.splice(i, 1);
        continue;
      }
      if (q.life <= 0) this.pickups.splice(i, 1);
    }
  }

  draw(rend, time) {
    const B = rend.dyn;
    for (const s of this.shots) {
      if (s.fireball) {
        // eldboll: pulserande klot med eldsvans
        const pulse = 1 + Math.sin(time * 26) * 0.12;
        B.sphere.push(s.x, s.y, s.z, s.radius * 2.2 * pulse, s.radius * 2.2 * pulse,
          s.radius * 2.2 * pulse, s.col, 0, time * 8, 0, 1.4);
        B.octa.push(s.x, s.y, s.z, s.radius * 1.4, s.radius * 2.0, s.radius * 1.4,
          [1.0, 0.85, 0.4], 0, -time * 10, 0, 1.2);
        rend.particles.spawn({
          x: s.x + rand(-0.3, 0.3), y: s.y + rand(-0.3, 0.3), z: s.z + rand(-0.3, 0.3),
          vx: -s.vx * 0.06, vy: -s.vy * 0.06 + 1.5, vz: -s.vz * 0.06,
          life: rand(0.3, 0.55), size: rand(0.6, 1.0), size2: 0.1,
          col: [1.0, rand(0.35, 0.6), 0.12], alpha: 0.9, drag: 0.4,
        });
        continue;
      }
      if (s.beam) {
        // laserstråle: oktaedern sträcks ut längs färdriktningen
        const sp = Math.hypot(s.vx, s.vy, s.vz) || 1;
        const yawD = Math.atan2(s.vx, s.vz);
        const pitchD = Math.asin(s.vy / sp) + Math.PI / 2;
        B.octa.push(s.x, s.y, s.z, s.radius * 0.55, 1.5, s.radius * 0.55, s.col,
          pitchD, yawD, 0, 1.5);
      } else {
        B.octa.push(s.x, s.y, s.z, s.radius * 1.5, s.radius * 2.4, s.radius * 1.5, s.col,
          0, time * 12, time * 6, 1.3);
      }
    }
    for (const b of this.bullets) {
      B.sphere.push(b.x, b.y, b.z, 0.75, 0.75, 0.75, b.col, 0, 0, 0, 1.2);
    }
    for (const q of this.pickups) {
      const s = q.kind === 'xp' ? 0.55 : 0.9;
      const lift = Math.sin(q.phase) * 0.12;
      B.octa.push(q.x, q.y + lift, q.z, s, s * 1.5, s, q.col, 0, q.phase, 0, 1.1);
      rend.particles.spawn({
        x: q.x, y: q.y + lift, z: q.z, life: 0.2, size: s * 1.6, size2: 0,
        col: q.col, alpha: 0.35, drag: 0.1,
      });
    }
  }
}

// ═══ hud.js ═══
// All DOM-baserad UI: HUD-siffror, banderoller, radar, menyer.


const $ = (id) => document.getElementById(id);

const VERSION = 'BETA 0.9';

const DOT_COL = {
  grunt: '#ff5b5b', spitter: '#c07bff', charger: '#ffab3d',
  tank: '#4ce0a8', boss: '#ff3d7f',
  drone: '#ffd93d', sniper: '#4dffc3', hover: '#8f9bff',
};

class HUD {
  constructor() {
    this.hud = $('hud');
    this.overlay = $('overlay');
    this.hpFill = $('hpFill');
    this.hpText = $('hpText');
    this.xpFill = $('xpFill');
    this.dashRow = $('dashRow');
    this.banner = $('banner');
    this.vignette = $('vignette');
    this.bossBar = $('bossBar');
    this.bossFill = $('bossFill');
    this.bossName = $('bossName');
    this.toasts = $('toasts');
    this.fireRow = $('fireRow');
    this.fireFill = $('fireFill');
    this.comboRow = $('comboRow');
    this.comboPips = [...this.comboRow.children];
    this.cross = $('crosshair');
    this.stick = $('stick');
    this.knob = $('knob');
    this.tFire = $('tFire');
    this.map = $('minimap');
    this.mapCtx = this.map.getContext('2d');
    this.bannerT = 0;
    this.dashPips = [];
    this.lastFps = 0;
  }

  showHUD(on) { this.hud.classList.toggle('hidden', !on); }

  hideOverlay() { this.overlay.classList.add('hidden'); }
  showOverlay(html) {
    this.overlay.innerHTML = html;
    this.overlay.classList.remove('hidden');
  }

  setDashPips(n) {
    if (this.dashPips.length === n) return;
    this.dashRow.innerHTML = '';
    this.dashPips = [];
    for (let i = 0; i < n; i++) {
      const d = document.createElement('div');
      d.className = 'pip';
      this.dashRow.appendChild(d);
      this.dashPips.push(d);
    }
  }

  toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    this.toasts.appendChild(el);
    setTimeout(() => {
      el.style.transition = 'opacity .4s';
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 420);
    }, 2600);
  }

  showBanner(text, sub = '', time = 2.2) {
    this.banner.innerHTML = text + (sub ? `<span class="sub">${sub}</span>` : '');
    this.bannerT = time;
  }

  setBoss(e, name) {
    this.boss = e;
    if (name) this.bossName.textContent = name;
    this.bossBar.classList.toggle('hidden', !e);
  }

  /** Uppdaterar allt som ändras varje bildruta. */
  update(g, dt) {
    const p = g.player;

    // Korshåret sitter där muspekaren är (utan muslås), annars i mitten.
    const inp = g.input;
    const free = inp && !inp.locked && !inp.touch;

    if (inp && inp.touch) {
      // spaken ritas där tummen landade
      this.stick.classList.toggle('on', inp.stickActive);
      if (inp.stickActive) {
        this.stick.style.left = `${inp.stickBase.x}px`;
        this.stick.style.top = `${inp.stickBase.y}px`;
        this.knob.style.transform = `translate(${inp.stickVec.x * 38}px, ${inp.stickVec.y * 38}px)`;
      }
      const wild = g.worldId === 'wild';
      this.tFire.classList.toggle('hidden', !wild);
      if (wild) this.tFire.classList.toggle('cool', p.fireballCd > 0);
    }
    const cx = free ? (inp.cursorNX * 0.5 + 0.5) * 100 : 50;
    const cy = free ? (inp.cursorNY * 0.5 + 0.5) * 100 : 50;
    this.cross.style.left = `${cx}%`;
    this.cross.style.top = `${cy}%`;
    // bara ett sikte på skärmen: göm systempekaren under spelets gång
    const want = g.state === 'playing' && free ? 'none' : 'crosshair';
    if (this._cursor !== want) { this._cursor = want; g.canvas.style.cursor = want; }
    const hpFrac = clamp(p.hp / p.stats.maxHp, 0, 1);
    this.hpFill.style.transform = `scaleX(${hpFrac})`;
    this.hpText.textContent = `${Math.ceil(p.hp)} / ${Math.round(p.stats.maxHp)}`;
    this.xpFill.style.transform = `scaleX(${clamp(g.xp / g.xpNeeded, 0, 1)})`;

    this.setDashPips(p.stats.dashMax);
    for (let i = 0; i < this.dashPips.length; i++) {
      const on = i < p.dashCharges;
      this.dashPips[i].classList.toggle('on', on);
      if (!on && i === p.dashCharges) {
        const f = p.dashTimer / p.stats.dashRecharge;
        this.dashPips[i].style.background =
          `linear-gradient(90deg, rgba(77,243,255,.75) ${f * 100}%, rgba(255,255,255,.13) ${f * 100}%)`;
      } else {
        this.dashPips[i].style.background = '';
      }
    }

    // eldboll + svärdskombo (bara Vildheim)
    if (g.worldId === 'wild') {
      this.fireRow.classList.remove('hidden');
      const frac = 1 - clamp(p.fireballCd / p.fireballCdMax, 0, 1);
      this.fireFill.style.transform = `scaleX(${frac})`;
      this.fireRow.classList.toggle('ready', frac >= 1);

      this.comboRow.classList.remove('hidden');
      const hits = p.comboTimer > 0 ? p.combo + 1 : 0;
      for (let i = 0; i < 3; i++) {
        const lit = i < hits;
        this.comboPips[i].classList.toggle('lit', lit && !(hits === 2 && i === 2));
        // tredje pricken pulsar guld när nästa hugg blir en finisher
        this.comboPips[i].classList.toggle('next', i === 2 && hits === 2);
      }
    } else {
      this.fireRow.classList.add('hidden');
      this.comboRow.classList.add('hidden');
    }

    $('waveNum').textContent = g.waves.wave || '—';
    $('levelNum').textContent = g.level;
    $('killNum').textContent = g.kills;
    const t = Math.floor(g.elapsed);
    $('timeNum').textContent = `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`;
    if (g.frameCount % 15 === 0) $('fpsNum').textContent = Math.round(g.fps);

    this.vignette.style.opacity = String(clamp(p.hitFlash * 0.8 + (1 - hpFrac) * 0.35, 0, 1));

    if (this.bannerT > 0) {
      this.bannerT -= dt;
      const a = clamp(this.bannerT > 1.6 ? (2.2 - this.bannerT) / 0.6 : this.bannerT / 1.0, 0, 1);
      this.banner.style.opacity = String(a);
      this.banner.style.transform = `translate(-50%,-50%) scale(${1 + (1 - a) * 0.06})`;
    } else if (this.banner.style.opacity !== '0') {
      this.banner.style.opacity = '0';
    }

    if (this.boss && this.boss.alive) {
      this.bossFill.style.transform = `scaleX(${clamp(this.boss.hp / this.boss.maxHp, 0, 1)})`;
    } else if (this.boss) {
      this.setBoss(null);
    }

    this.drawMinimap(g);
  }

  drawMinimap(g) {
    const c = this.mapCtx, S = this.map.width, R = S / 2;
    const range = 82;
    const p = g.player;
    const yaw = p.camYaw;
    const cos = Math.cos(yaw), sin = Math.sin(yaw);

    c.clearRect(0, 0, S, S);
    c.save();
    c.beginPath(); c.arc(R, R, R - 2, 0, Math.PI * 2); c.clip();
    c.fillStyle = 'rgba(4,10,20,.55)';
    c.fillRect(0, 0, S, S);

    // arenagräns
    const scale = R / range;
    const pr = Math.hypot(p.pos.x, p.pos.z);
    c.strokeStyle = 'rgba(77,243,255,.25)';
    c.lineWidth = 3;
    c.beginPath();
    const relx = -p.pos.x, relz = -p.pos.z;
    const mx = (-cos * relx + sin * relz) * scale + R;
    const my = -(sin * relx + cos * relz) * scale + R;
    c.arc(mx, my, ARENA_RADIUS * scale, 0, Math.PI * 2);
    c.stroke();

    const plot = (wx, wz) => {
      const rx = wx - p.pos.x, rz = wz - p.pos.z;
      return [(-cos * rx + sin * rz) * scale + R, -(sin * rx + cos * rz) * scale + R];
    };

    c.globalAlpha = 0.85;
    for (const q of g.combat.pickups) {
      const [x, y] = plot(q.x, q.z);
      c.fillStyle = q.kind === 'xp' ? '#4dffa6' : '#ff5b7f';
      c.fillRect(x - 2, y - 2, 4, 4);
    }
    for (const e of g.enemies) {
      if (!e.alive) continue;
      const [x, y] = plot(e.pos.x, e.pos.z);
      c.fillStyle = DOT_COL[e.type] || '#fff';
      c.beginPath();
      c.arc(x, y, e.boss ? 9 : e.type === 'tank' ? 6 : 4.5, 0, Math.PI * 2);
      c.fill();
    }
    c.globalAlpha = 1;

    // spelaren + blickriktning
    c.fillStyle = '#eaf6ff';
    c.beginPath();
    c.moveTo(R, R - 9); c.lineTo(R - 6, R + 7); c.lineTo(R + 6, R + 7);
    c.closePath(); c.fill();
    c.restore();

    c.strokeStyle = 'rgba(77,243,255,.35)';
    c.lineWidth = 2;
    c.beginPath(); c.arc(R, R, R - 2, 0, Math.PI * 2); c.stroke();
  }

  // ------------------------------------------------------------- menyskärmar

  showStart(onPick, touch) {
    this._cursor = null;
    const keys = touch ? `
          <div class="key"><b>VÄNSTER HALVA</b> Spak — rör dig</div>
          <div class="key"><b>HÖGER HALVA</b> Dra — sikta</div>
          <div class="key"><b>ATK</b> Attack</div>
          <div class="key"><b>DASH</b> Dash · osårbar</div>
          <div class="key"><b>▲</b> Hoppa · håll för att flyga</div>
          <div class="key"><b>🔥</b> Eldboll (Vildheim)</div>` : `
          <div class="key"><b>WASD</b> Rör dig</div>
          <div class="key"><b>MUS</b> Sikta · mot kanten = svep vyn</div>
          <div class="key"><b>VÄNSTERKLICK</b> Attack</div>
          <div class="key"><b>C</b> Eldboll (Vildheim)</div>
          <div class="key"><b>SHIFT</b> Dash</div>
          <div class="key"><b>MELLANSLAG</b> Hoppa / flyg</div>
          <div class="key"><b>ESC</b> Paus</div>`;
    this.showOverlay(`
      <div class="screen">
        <div class="title">DASHH</div>
        <div class="subtitle">VOIDFALL<span class="betaTag">${VERSION}</span></div>
        <div class="betaNote">tidig version — buggar och konstigheter förekommer, säg gärna till</div>
        <div class="worlds">
          <div class="world wild" data-w="wild">
            <div class="wIcon">🌲</div>
            <div class="wName">VILDHEIM</div>
            <div class="wDesc">Grönskande vildmark med skogar, sjöar och berg.
              En krigare i läder med svärd — och eldbollar på <b>C</b>.</div>
            <div class="wTag">SVÄRD · C = ELDBOLL</div>
          </div>
          <div class="world city" data-w="city">
            <div class="wIcon">🌆</div>
            <div class="wName">NEOTROPOLIS</div>
            <div class="wDesc">Neonstad i evig natt. Flyg som cyborg mellan skyskraporna
              och bränn monstren med laser ur händerna.</div>
            <div class="wTag">HÅLL MELLANSLAG = FLYG</div>
          </div>
        </div>
        <div class="keys">${keys}</div>
        <div class="hint">välj din värld — överlev vågorna</div>
      </div>`);
    this.overlay.querySelectorAll('.world').forEach((el) => {
      el.addEventListener('click', () => onPick(el.dataset.w));
    });
  }

  showLevelUp(level, choices, onPick) {
    const cards = choices.map((u, i) => `
      <div class="card" data-i="${i}">
        <div class="num">${i + 1}</div>
        <div class="icon">${u.icon}</div>
        <div class="name">${u.name}</div>
        <div class="desc">${u.desc}</div>
      </div>`).join('');
    this.showOverlay(`
      <div class="screen">
        <div class="lvlTitle">NIVÅ ${level}</div>
        <div class="lvlSub">VÄLJ EN UPPGRADERING</div>
        <div class="cards">${cards}</div>
        <div class="hint">klicka eller tryck 1 · 2 · 3</div>
      </div>`);
    this.overlay.querySelectorAll('.card').forEach((el) => {
      el.addEventListener('click', () => onPick(+el.dataset.i));
    });
  }

  showPause(onResume) {
    this.showOverlay(`
      <div class="screen">
        <div class="title" style="font-size:clamp(40px,8vw,84px)">PAUSAD</div>
        <button class="cta" id="btnResume">FORTSÄTT</button>
        <div class="hint">esc eller klicka för att återgå</div>
      </div>`);
    $('btnResume').addEventListener('click', onResume);
  }

  showGameOver(g, onRestart, onMenu) {
    const t = Math.floor(g.elapsed);
    this.showOverlay(`
      <div class="screen">
        <div class="goTitle">DU FÖLL</div>
        <div class="hint" style="margin:4px 0 0">${g.worldId === 'city' ? 'NEOTROPOLIS' : 'VILDHEIM'}</div>
        <div class="results">
          <div class="result"><div class="rl">VÅG</div><div class="rv">${g.waves.wave}</div></div>
          <div class="result"><div class="rl">NIVÅ</div><div class="rv">${g.level}</div></div>
          <div class="result"><div class="rl">KILLS</div><div class="rv">${g.kills}</div></div>
          <div class="result"><div class="rl">TID</div><div class="rv">${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}</div></div>
          <div class="result"><div class="rl">SKADA</div><div class="rv">${Math.round(g.damageDealt)}</div></div>
        </div>
        <button class="cta" id="btnRestart">SPELA IGEN</button>
        <button class="cta alt" id="btnMenu">BYT VÄRLD</button>
        <div class="hint">bäst hittills: våg ${g.best.wave} · ${g.best.kills} kills</div>
      </div>`);
    $('btnRestart').addEventListener('click', onRestart);
    $('btnMenu').addEventListener('click', onMenu);
  }
}

// ═══ game.js ═══
// Spelets nav: tillstånd, huvudloop och limmet mellan alla system.










const DAY_LENGTH = 320;   // sekunder per dygn

class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.renderer = new Renderer(canvas);
    this.particles = this.renderer.particles;
    this.colliders = this.renderer.props.grid;
    this.input = new Input(canvas);
    this.sound = new Sound();
    this.hud = new HUD();
    this.combat = new Combat();
    this.waves = new WaveManager();
    this.player = new Player(this);
    this.enemies = [];
    this.state = 'menu';
    this.worldId = 'wild';
    this.usedLock = false;
    this.best = this.loadBest();
    this.fps = 60;
    this.frameCount = 0;
    this.resetRun();

    this.input.onLockChange = (locked) => {
      if (locked) this.usedLock = true;
      else if (this.state === 'playing' && this.usedLock) this.pause();
    };
    canvas.addEventListener('mousedown', () => {
      if (this.state === 'playing' && !this.input.locked && !this.input.touch) this.input.requestLock();
    });
    for (const el of document.querySelectorAll('.tBtn')) this.input.bindButton(el);
  }

  // ---------------------------------------------------------------- tillstånd

  loadBest() {
    try {
      return JSON.parse(localStorage.getItem('dashh.best')) || { wave: 0, kills: 0 };
    } catch (e) { return { wave: 0, kills: 0 }; }
  }

  saveBest() {
    this.best.wave = Math.max(this.best.wave, this.waves.wave);
    this.best.kills = Math.max(this.best.kills, this.kills);
    try { localStorage.setItem('dashh.best', JSON.stringify(this.best)); } catch (e) { /* ignoreras */ }
  }

  resetRun() {
    this.player.reset();
    this.enemies.length = 0;
    this.combat.reset();
    this.waves.reset();
    this.particles.list.length = 0;
    this.upgradeLevels = new Map();
    this.level = 1;
    this.xp = 0;
    this.xpNeeded = 12;
    this.kills = 0;
    this.elapsed = 0;
    this.damageDealt = 0;
    this.dayTime = 0.34;   // förmiddag — se computeEnv
    this.time = 0;
    this.pendingLevelUps = 0;
    this.ambientTimer = 0;
    this.hud.setBoss(null);
  }

  start(worldId) {
    if (worldId) this.worldId = worldId;
    this.renderer.buildWorld(this.worldId);
    this.colliders = this.renderer.props.grid;
    this.buildings = this.renderer.props.buildings || null;   // taksnipern behöver dem
    this.sound.init();
    this.sound.resume();
    this.resetRun();
    this.state = 'playing';
    this.hud.hideOverlay();
    this.hud.showHUD(true);
    if (this.worldId === 'city') this.hud.showBanner('NEOTROPOLIS', 'håll mellanslag — flyg', 3);
    else this.hud.showBanner('VILDHEIM', 'vågorna kommer');
    this.input.enabled = true;
    if (!this.input.touch) this.input.requestLock();
  }

  showMenu() {
    this.state = 'menu';
    this.input.enabled = false;
    this.input.releaseLock();
    this.hud.showHUD(false);
    this.hud.showStart((w) => this.start(w), this.input.touch);
  }

  pause() {
    if (this.state !== 'playing') return;
    this.state = 'paused';
    this.input.enabled = false;
    this.input.releaseLock();
    this.hud.showPause(() => this.resume());
  }

  resume() {
    if (this.state !== 'paused') return;
    this.state = 'playing';
    this.input.enabled = true;
    this.hud.hideOverlay();
    if (!this.input.touch) this.input.requestLock();
    this.sound.resume();
  }

  die() {
    this.state = 'dead';
    this.player.alive = false;
    this.input.enabled = false;
    this.input.releaseLock();
    this.sound.gameOver();
    this.particles.burst(this.player.pos.x, this.player.pos.y + 1.2, this.player.pos.z, 40, {
      speed: 12, life: 1.1, size: 1.0, size2: 0.1, col: [0.4, 0.9, 1.0], alpha: 0.9, drag: 0.7, grav: -8,
    });
    this.saveBest();
    setTimeout(() => {
      if (this.state === 'dead') {
        this.hud.showGameOver(this, () => this.start(), () => this.showMenu());
      }
    }, 900);
  }

  // ------------------------------------------------------- gränssnitt utåt

  toast(msg) { this.hud.toast(msg); }

  spawnEnemy(type, x, z) {
    const e = new Enemy(type, x, z, this.waves.wave, this.worldId);
    this.enemies.push(e);
    this.particles.burst(x, terrainHeight(x, z) + 1, z, e.boss ? 40 : 12, {
      speed: e.boss ? 14 : 6, life: 0.6, size: e.boss ? 1.4 : 0.6,
      col: e.col, alpha: 0.9, drag: 0.7, grav: -4,
    });
    if (e.boss) {
      const city = this.worldId === 'city';
      this.hud.setBoss(e, city ? 'OVERSEER' : 'VOIDLORD');
      this.hud.showBanner('BOSS', city ? 'overseer aktiveras' : 'voidlord stiger upp', 3);
      this.sound.bossSpawn();
      this.player.shake = 1.2;
    }
    return e;
  }

  spawnEnemyBullet(e, target, speed, dmg) { this.combat.enemyBullet(e, target, speed, dmg); }
  spawnEnemyBulletDir(e, dx, dy, dz, speed, dmg) { this.combat.enemyBulletDir(e, dx, dy, dz, speed, dmg); }
  shockwave(x, y, z, r, dmg) { this.combat.shockwave(this, x, y, z, r, dmg); }

  onEnemyKilled(e) {
    this.kills++;
    this.sound.kill();
    this.particles.burst(e.pos.x, e.pos.y + e.height * 0.5, e.pos.z, e.boss ? 60 : 16, {
      speed: e.boss ? 16 : 8, life: e.boss ? 1.2 : 0.55, size: e.boss ? 1.5 : 0.6, size2: 0.1,
      col: e.col, alpha: 0.95, drag: 0.7, grav: -6,
    });
    this.combat.dropLoot(this, e);
    if (e.boss) {
      this.hud.setBoss(null);
      this.hud.showBanner('BOSSEN FÖLL', '', 2.6);
      this.player.shake = 1.0;
    }
  }

  addXP(n) {
    this.xp += n;
    while (this.xp >= this.xpNeeded) {
      this.xp -= this.xpNeeded;
      this.level++;
      this.xpNeeded = Math.round(12 + this.level * 7 + Math.pow(this.level, 1.7));
      this.pendingLevelUps++;
    }
    if (this.pendingLevelUps > 0 && this.state === 'playing') this.openLevelUp();
  }

  openLevelUp() {
    this.state = 'levelup';
    this.input.enabled = false;
    this.input.releaseLock();
    this.sound.levelUp();
    this.choices = rollChoices(this.upgradeLevels, 3);
    this.hud.showLevelUp(this.level, this.choices, (i) => this.pickUpgrade(i));
  }

  pickUpgrade(i) {
    const u = this.choices[i];
    if (!u) return;
    u.apply(this.player.stats, this.player);
    this.upgradeLevels.set(u.id, (this.upgradeLevels.get(u.id) || 0) + 1);
    this.toast(`${u.icon} ${u.name}`);
    this.pendingLevelUps--;
    this.sound.pickup();
    if (this.pendingLevelUps > 0) { this.openLevelUp(); return; }
    this.state = 'playing';
    this.input.enabled = true;
    this.hud.hideOverlay();
    if (!this.input.touch) this.input.requestLock();
  }

  onWaveStart(wave, isBoss) {
    this.hud.showBanner(`VÅG ${wave}`, isBoss ? 'något stort närmar sig' : '');
    this.sound.waveStart();
  }

  onWaveClear(wave) {
    this.hud.showBanner('VÅGEN RENSAD', 'nästa startar snart', 2.0);
    this.toast(`Våg ${wave} klarad`);
    this.player.heal(this.player.stats.maxHp * 0.08);
  }

  // ------------------------------------------------------------------ update

  update(dt) {
    this.time += dt;
    this.elapsed += dt;
    this.dayTime = (this.dayTime + dt / DAY_LENGTH) % 1;

    const p = this.player;
    p.update(dt, this.input, this);

    // attack: svärd i Vildheim, laser i Neotropolis
    if (this.input.fireDown && p.fireTimer <= 0) {
      if (this.worldId === 'wild') this.combat.swordSwing(this);
      else this.combat.playerShoot(this);
    } else p.aimDir(this.enemies);

    // eldboll på C (bara Vildheim, 10 s nedkylning)
    if (this.worldId === 'wild' && this.input.pressed('KeyC') && p.alive) {
      if (p.fireballCd <= 0) this.combat.castFireball(this);
      else this.toast(`🔥 Eldboll om ${Math.ceil(p.fireballCd)} s`);
    }

    // drönare
    if (p.stats.drones > 0 && p.droneTimer <= 0) {
      let target = null, bestD = 46;
      for (const e of this.enemies) {
        if (!e.alive) continue;
        const d = Math.hypot(e.pos.x - p.pos.x, e.pos.z - p.pos.z);
        if (d < bestD) { bestD = d; target = e; }
      }
      if (target) {
        for (let i = 0; i < p.stats.drones; i++) {
          const a = p.droneAngle + (i / p.stats.drones) * TAU;
          this.combat.droneShoot(this, p.pos.x + Math.cos(a) * 2.1, p.pos.y + 2.4, p.pos.z + Math.sin(a) * 2.1, target);
        }
        p.droneTimer = 1.15;
      } else p.droneTimer = 0.3;
    }

    this.waves.update(dt, this);

    for (const e of this.enemies) if (e.alive) e.update(dt, this);
    if (this.enemies.some((e) => !e.alive)) this.enemies = this.enemies.filter((e) => e.alive);

    this.combat.update(dt, this);
    this.particles.update(dt);

    // stämningspartiklar: gnistor på dagen, glödmott på natten
    this.ambientTimer -= dt;
    if (this.ambientTimer <= 0) {
      this.ambientTimer = 0.06;
      const env = this.env || computeEnv(this.dayTime, this.worldId);
      const night = env.night;
      const a = rand(TAU), d = rand(6, 34);
      const x = p.pos.x + Math.cos(a) * d, z = p.pos.z + Math.sin(a) * d;
      const gh = terrainHeight(x, z);
      this.particles.spawn({
        x, y: Math.max(gh, WATER_LEVEL) + rand(0.4, 5), z,
        vx: rand(-0.4, 0.4), vy: rand(0.1, 0.7), vz: rand(-0.4, 0.4),
        life: rand(1.6, 3.4), size: rand(0.10, 0.24), size2: 0,
        col: night > 0.4 ? [0.45, 0.95, 0.8] : [1.0, 0.95, 0.75],
        alpha: night > 0.4 ? 0.75 : 0.3, drag: 0.05,
      });
    }

    if (!p.alive && this.state === 'playing') this.die();
  }

  // ------------------------------------------------------------------ render

  render() {
    const r = this.renderer;
    const p = this.player;
    this.env = computeEnv(this.dayTime, this.worldId);
    r.clearBatches();
    if (p.alive) p.draw(r, this.time);
    for (const e of this.enemies) e.draw(r, this.time);
    this.combat.draw(r, this.time);
    r.render(p.camera(this.time), this.env, this.time, p.pos);
  }

  // -------------------------------------------------------------------- loop

  frame(now) {
    const dt = Math.min(0.05, (now - (this.lastTime || now)) / 1000);
    this.lastTime = now;
    this.frameCount++;
    this.fps = lerp(this.fps, 1 / Math.max(dt, 0.0001), 0.1);

    if (this.state === 'playing') {
      if (this.input.pressed('Escape') || this.input.pressed('KeyP')) this.pause();
      else this.update(dt);
    } else if (this.state === 'paused') {
      if (this.input.pressed('Escape') || this.input.pressed('KeyP')) this.resume();
    } else if (this.state === 'levelup') {
      for (let i = 0; i < 3; i++) {
        if (this.input.pressed(`Digit${i + 1}`) || this.input.pressed(`Numpad${i + 1}`)) {
          this.pickUpgrade(i);
          break;
        }
      }
      this.particles.update(dt * 0.25);
    } else {
      // meny eller game over: låt världen leva vidare i bakgrunden
      this.time += dt;
      this.dayTime = (this.dayTime + dt / DAY_LENGTH) % 1;
      this.particles.update(dt);
      if (this.state !== 'dead') {
        this.player.camYaw += dt * 0.06;
        this.player.updateCamera(dt, 0);
      }
    }

    if (this.state !== 'menu') this.hud.update(this, dt);
    this.render();
    this.input.endFrame();
    requestAnimationFrame((t) => this.frame(t));
  }

  run() {
    this.player.updateCamera(0.016, 0);
    requestAnimationFrame((t) => this.frame(t));
  }
}

// ═══ main.js ═══
// Start: bygger spelet och kopplar startknappen.

const canvas = document.getElementById('gl');
let game = null;

try {
  game = new Game(canvas);
  window.DASHH = game;               // praktiskt för felsökning i konsolen
} catch (err) {
  console.error(err);
  document.getElementById('overlay').innerHTML =
    `<div class="screen"><div class="goTitle">GRAFIKFEL</div>
     <p id="loadErr">${err.message}<br><br>
     Spelet kräver WebGL2. Prova en uppdaterad Chrome, Edge, Firefox eller Safari 15+,
     och kontrollera att hårdvaruacceleration är påslaget.</p></div>`;
}

if (game) {
  game.showMenu();

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) game.pause();
  });

  game.run();
}
</script>
