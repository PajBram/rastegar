// Renderaren: program, statiska världsobjekt, instansbatchar och partiklar.






// ------------------------------------------------------------- partikelsystem

class Particles {
  constructor(max = 2600) {
    this.max = max;
    this.list = [];
  }

  spawn(o) {
    if (this.list.length >= this.max) this.list.shift();
    this.list.push({
      x: o.x, y: o.y, z: o.z,
      vx: o.vx || 0, vy: o.vy || 0, vz: o.vz || 0,
      life: o.life, max: o.life,
      size: o.size, size2: o.size2 !== undefined ? o.size2 : 0,
      r: o.col[0], g: o.col[1], b: o.col[2], a: o.alpha !== undefined ? o.alpha : 1,
      grav: o.grav !== undefined ? o.grav : 0,
      drag: o.drag !== undefined ? o.drag : 0.12,
    });
  }

  /** Sfäriskt utkast av partiklar. */
  burst(x, y, z, n, o) {
    for (let i = 0; i < n; i++) {
      const th = rand(TAU), ph = Math.acos(rand(-1, 1));
      const sp = rand(o.speed * 0.35, o.speed);
      this.spawn({
        x, y, z,
        vx: Math.sin(ph) * Math.cos(th) * sp,
        vy: Math.cos(ph) * sp * (o.up || 1) + (o.lift || 0),
        vz: Math.sin(ph) * Math.sin(th) * sp,
        life: rand(o.life * 0.6, o.life),
        size: rand(o.size * 0.6, o.size),
        size2: o.size2 || 0,
        col: o.col, alpha: o.alpha, grav: o.grav, drag: o.drag,
      });
    }
  }

  update(dt) {
    const L = this.list;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i];
      p.life -= dt;
      if (p.life <= 0) { L[i] = L[L.length - 1]; L.pop(); continue; }
      p.vy += p.grav * dt;
      const d = Math.exp(-p.drag * dt * 60 * 0.05);
      p.vx *= d; p.vy *= d; p.vz *= d;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    }
  }

  fill(batch) {
    batch.clear();
    for (const p of this.list) {
      const t = p.life / p.max;
      batch.push(p.x, p.y, p.z, lerp(p.size2, p.size, t), p.r, p.g, p.b, p.a * Math.min(1, t * 1.6));
    }
  }
}

// ------------------------------------------------------------------- miljö

const NIGHT = { top: [0.015, 0.025, 0.075], hor: [0.05, 0.07, 0.15], fog: [0.05, 0.07, 0.15], amb: [0.11, 0.14, 0.24], sun: [0.42, 0.52, 0.80] };
const DUSK  = { top: [0.10, 0.14, 0.38], hor: [0.86, 0.40, 0.26], fog: [0.45, 0.30, 0.36], amb: [0.24, 0.22, 0.32], sun: [1.00, 0.52, 0.26] };
const DAY   = { top: [0.20, 0.42, 0.82], hor: [0.66, 0.79, 0.95], fog: [0.64, 0.76, 0.92], amb: [0.34, 0.40, 0.50], sun: [1.00, 0.96, 0.88] };

const mixArr = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];

/** dayTime 0..1 — 0.25 = soluppgång, 0.5 = middag, 0.75 = solnedgång.
 *  Neotropolis har evig neonnatt och ignorerar dygnet. */
function computeEnv(dayTime, worldId = 'wild') {
  if (worldId === 'city') {
    return {
      sunDir: { x: 0.297, y: 0.772, z: 0.545 },   // hög kall måne
      sunCol: [0.40, 0.34, 0.62],
      amb: [0.21, 0.16, 0.30],
      fogCol: [0.055, 0.03, 0.10],
      skyTop: [0.012, 0.006, 0.045],
      skyHor: [0.17, 0.05, 0.24],
      night: 1,
      fogNear: 42,
      fogFar: 200,
      // Staden: kall magenta från skyltarna ovanifrån, gatans neon underifrån.
      skyTint: [0.92, 0.80, 1.15],
      groundTint: [1.10, 0.86, 1.05],
      // Diset ligger på gatunivå och tunnas ut mot tornens toppar.
      fogHeight: 0.013,
      clouds: 0,
      // stadens vind kanaliseras mellan husen och är svag på gatunivå
      wind: [0.35, 0.15],
    };
  }
  const a = (dayTime - 0.25) * TAU;
  let sx = Math.cos(a), sy = Math.sin(a), sz = 0.32;
  let l = Math.hypot(sx, sy, sz);
  sx /= l; sy /= l; sz /= l;

  const above = sy;
  const night = 1 - smoothstep(-0.16, 0.06, above);
  const duskT = smoothstep(-0.30, 0.02, above);
  const dayT = smoothstep(0.02, 0.34, above);

  let pal = { top: mixArr(NIGHT.top, DUSK.top, duskT), hor: mixArr(NIGHT.hor, DUSK.hor, duskT),
              fog: mixArr(NIGHT.fog, DUSK.fog, duskT), amb: mixArr(NIGHT.amb, DUSK.amb, duskT),
              sun: mixArr(NIGHT.sun, DUSK.sun, duskT) };
  pal = { top: mixArr(pal.top, DAY.top, dayT), hor: mixArr(pal.hor, DAY.hor, dayT),
          fog: mixArr(pal.fog, DAY.fog, dayT), amb: mixArr(pal.amb, DAY.amb, dayT),
          sun: mixArr(pal.sun, DAY.sun, dayT) };

  // Under horisonten lyser månen i stället — motsatt riktning, svagare.
  const moon = above < 0;
  const dir = moon ? { x: -sx, y: -sy, z: -sz } : { x: sx, y: sy, z: sz };
  const strength = moon ? 0.32 : lerp(0.45, 1.0, dayT);

  // Halvsfärstinter: himlens kulör uppifrån, en varm markreflex underifrån.
  // Normaliserade kring 1,0 så ljusstyrkan är oförändrad — bara kulören rör sig.
  const norm = (c, amount) => {
    const avg = (c[0] + c[1] + c[2]) / 3 || 1;
    return [lerp(1, c[0] / avg, amount), lerp(1, c[1] / avg, amount), lerp(1, c[2] / avg, amount)];
  };

  return {
    sunDir: dir,
    sunCol: [pal.sun[0] * strength, pal.sun[1] * strength, pal.sun[2] * strength],
    amb: pal.amb,
    fogCol: pal.fog,
    skyTop: pal.top,
    skyHor: pal.hor,
    skyTint: norm(pal.top, 0.55),
    groundTint: norm([0.42, 0.38, 0.26], 0.35),   // mossa och jord kastar tillbaka varmt
    night,
    fogNear: 44,
    fogFar: 178,
    // Dalarna behåller sitt dis medan bergstopparna sticker upp ur det.
    fogHeight: 0.009,
    // Molnen tunnas ut på natten, då man ändå bara ser stjärnor genom dem.
    clouds: lerp(0.35, 1.0, dayT),
    // Vinden vrider sig långsamt över dygnet och friskar i på eftermiddagen.
    wind: [Math.cos(dayTime * TAU * 0.6) * (0.75 + dayT * 0.5),
           Math.sin(dayTime * TAU * 0.6) * (0.75 + dayT * 0.5)],
  };
}

// ----------------------------------------------------------------- renderare

class Renderer {
  constructor(canvas) {
    this.canvas = canvas;
    const gl = this.gl = initGL(canvas);

    this.pTerrain = makeProgram(gl, TERRAIN_VS, TERRAIN_FS, 'terrain');
    this.pInst = makeProgram(gl, INST_VS, INST_FS, 'inst');
    this.pShadow = makeProgram(gl, SHADOW_VS, SHADOW_FS, 'shadow');
    this.pPart = makeProgram(gl, PART_VS, PART_FS, 'part');
    this.pSky = makeProgram(gl, SKY_VS, SKY_FS, 'sky');
    this.pWater = makeProgram(gl, WATER_VS, WATER_FS, 'water');

    this.waterMesh = uploadMesh(gl, grid(90));

    const m = {
      sphere: sphere(16, 11),
      box: box(),
      cone: cone(12),
      cyl: cylinder(12),
      cylTaper: cylinder(10, 0.55),
      disc: disc(20),
      octa: octahedron(),
    };
    this.mesh = m;

    // Dynamiska batchar (fylls om varje bildruta).
    this.dyn = {
      sphere: new InstancedBatch(gl, m.sphere, 512),
      box: new InstancedBatch(gl, m.box, 512),
      cone: new InstancedBatch(gl, m.cone, 256),
      cyl: new InstancedBatch(gl, m.cyl, 256),
      octa: new InstancedBatch(gl, m.octa, 512),
    };
    this.shadows = new InstancedBatch(gl, m.disc, 512);
    this.partBatch = new BillboardBatch(gl, 3200);
    this.particles = new Particles();

    this.worldCache = {};
    this.buildWorld('wild');

    this.view = mat4(); this.proj = mat4(); this.vp = mat4(); this.invVP = mat4();
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.width = 1; this.height = 1;
    this.resize();
  }

  /**
   * Väljer aktiv värld och årstid; geometrin byggs första gången och cachas.
   * Cachenyckeln innehåller årstiden — samma karta i höstfärger är en annan
   * mesh, och utan det i nyckeln får man förra körningens sommar tillbaka.
   */
  buildWorld(id, season) {
    setWorld(id);
    if (season) setSeason(season);
    const key = id === 'city' ? 'city' : `wild:${SEASON_ID}`;
    if (!this.worldCache[key]) {
      this.worldCache[key] = id === 'city' ? this.buildCityWorld() : this.buildWildWorld();
    }
    const w = this.worldCache[key];
    this.terrain = w.terrain;
    this.static = w.static;
    this.props = w.props;
    this.taxis = w.taxis || null;
    this.worldId = id;
  }

  /**
   * Flygande taxibilar längs stadens gatunät. De ritas i dyn-batcharna varje
   * bildruta och lever bara som en formel: läge = start + fart * tid, lindat
   * runt kartan. Ingen AI, inga kollisioner — de är stadens puls, inte trafik
   * man krockar med, och de flyger på höjder där man ändå inte slåss.
   */
  drawTaxis(time) {
    if (!this.taxis) return;
    const B = this.dyn;
    const S = WORLD_SIZE;
    for (const t of this.taxis) {
      // position längs färdriktningen, lindad till [-S/2, S/2)
      let u = (t.phase + t.speed * time) % S;
      if (u < 0) u += S;
      u -= S / 2;
      const x = t.axis === 'x' ? u : t.line;
      const z = t.axis === 'x' ? t.line : u;
      const y = t.h + Math.sin(time * 0.7 + t.phase) * 0.35;
      const yaw = t.axis === 'x'
        ? (t.speed > 0 ? Math.PI / 2 : -Math.PI / 2)
        : (t.speed > 0 ? 0 : Math.PI);
      const body = t.cab ? [1.0, 0.78, 0.12] : [0.14, 0.15, 0.22];
      const fwd = t.speed > 0 ? 1 : -1;
      const fx = t.axis === 'x' ? fwd : 0, fz = t.axis === 'x' ? 0 : fwd;

      // Måtten är i meter, och en vanlig bil försvinner sedd från gatan
      // trettio meter under. De här är luftbussar, inte personbilar.
      B.box.push(x, y, z, 2.6, 1.0, 5.4, body, 0, yaw, 0, t.cab ? 0.35 : 0.1);
      B.box.push(x, y + 0.8, z, 2.0, 0.7, 2.7, [0.06, 0.10, 0.16], 0, yaw, 0, 0.3);
      // strålkastare framåt, röda lyktor bakåt
      B.sphere.push(x + fx * 2.7, y, z + fz * 2.7, 0.45, 0.34, 0.45, [0.9, 0.95, 1.0], 0, 0, 0, 1.5);
      B.sphere.push(x - fx * 2.7, y, z - fz * 2.7, 0.38, 0.28, 0.38, [1.0, 0.2, 0.15], 0, 0, 0, 1.2);
      // svävfältet under — det som säger "den flyger" snarare än "den åker"
      B.cyl.push(x, y - 0.75, z, 1.7, 0.1, 1.7,
        t.cab ? [1.0, 0.6, 0.2] : [0.35, 0.7, 1.0], 0, 0, 0, 0.9);
    }
  }

  buildCityWorld() {
    const gl = this.gl, m = this.mesh;
    const props = cityProps();
    const bodies = new InstancedBatch(gl, m.box, 1024);
    const bands = new InstancedBatch(gl, m.box, 24576);
    const poles = new InstancedBatch(gl, m.cyl, 1024);
    const orbs = new InstancedBatch(gl, m.sphere, 512);
    const NEON = [[0.25, 0.9, 1.0], [1.0, 0.3, 0.7], [1.0, 0.7, 0.2], [0.5, 1.0, 0.5]];
    // deterministiskt "slumptal" per hus och våning — samma stad varje laddning
    const h01 = (a, c) => { const s = Math.sin(a * 127.1 + c * 311.7) * 43758.5453; return s - Math.floor(s); };

    for (const b of props.buildings) {
      const tone = 0.8 + b.neon * 0.5;
      const bodyCol = [0.055 * tone, 0.06 * tone, 0.088 * tone];
      const neon = NEON[Math.floor(b.neon * NEON.length) % NEON.length];

      // --- kropp i avsatser (samma tiers som kollision och markhöjd)
      let base = 0;
      for (const t of b.tiers) {
        const hx = b.hx * t.f, hz = b.hz * t.f;
        bodies.push(b.x, (base + t.top) / 2, b.z, hx * 2, t.top - base, hz * 2, bodyCol, 0, 0, 0, 0);
        // varje avsats får en svagt lysande kant
        bands.push(b.x, t.top - 0.08, b.z, hx * 2 + 0.14, 0.14, hz * 2 + 0.14, neon,
          0, 0, 0, t.top === b.h ? 0.9 : 0.3);

        // --- fönster, ett i taget i ett rutnät. Band runt hela fasaden blir
        // lysande lameller; enskilda rutor med mörka mellanrum läser som hus.
        // Bara de nedersta 70 metrarna får rutor — resten är fjärran mur.
        const wTop = Math.min(t.top - 1.6, 70);
        for (let y = base + 2.6; y < wTop; y += 3.2) {
          for (const ax of [0, 1]) {
            const halfW = (ax === 0 ? hx : hz);
            const cols = Math.max(2, Math.round(halfW * 2 / 3.1));
            const step = (halfW * 2) / cols;
            for (let c = 0; c < cols; c++) {
              const off = -halfW + step * (c + 0.5);
              const r = h01(b.x + y * 7.3 + c * 2.1, b.z + ax * 13.7);
              let col, glow;
              // de flesta rutor är släckta — det är mörkret som gör de tända
              // till ljus i stället för till en tänd fasad
              if (r < 0.74) { col = [0.075, 0.085, 0.125]; glow = 0.02; }
              else if (r < 0.96) { col = [0.46, 0.40, 0.27]; glow = 0.11; }   // varmt kontorsljus
              else { col = neon; glow = 0.3; }                                // enstaka neonrum
              const w = step * 0.5, hgt = 0.85;
              if (ax === 0) bands.push(b.x + off, y, b.z, w, hgt, hz * 2 + 0.05, col, 0, 0, 0, glow);
              else bands.push(b.x, y, b.z + off, hx * 2 + 0.05, hgt, w, col, 0, 0, 0, glow);
            }
          }
        }
        base = t.top;
      }

      // --- takbråte: fläktlådor och en vattentank gör taklinjen ojämn
      const top = b.tiers[b.tiers.length - 1];
      if (b.h < 70) {
        const n = 1 + Math.floor(h01(b.x, b.z * 3.1) * 3);
        for (let k = 0; k < n; k++) {
          const rx = (h01(b.x + k * 17, b.z) - 0.5) * b.hx * top.f * 1.1;
          const rz = (h01(b.x, b.z + k * 23) - 0.5) * b.hz * top.f * 1.1;
          const s = 0.7 + h01(b.x * 2 + k, b.z) * 1.1;
          bodies.push(b.x + rx, b.h + s * 0.4, b.z + rz, s, s * 0.8, s * 0.9,
            [0.10, 0.11, 0.15], 0, h01(k, b.x) * 1.5, 0, 0);
        }
        if (h01(b.z, b.x) > 0.55) {
          poles.push(b.x - b.hx * top.f * 0.4, b.h + 1.0, b.z + b.hz * top.f * 0.35,
            0.8, 2.0, 0.8, [0.13, 0.14, 0.18], 0, 0, 0, 0);
        }
      }

      // --- gatuplan: skyltfönster och en mörk portöppning
      const dc = Math.hypot(b.x, b.z);
      if (dc < 96) {
        bands.push(b.x, 1.4, b.z, b.hx * 2 * 0.78, 1.1, b.hz * 2 + 0.09,
          [0.75, 0.66, 0.45], 0, 0, 0, 0.22);
        bands.push(b.x, 1.4, b.z, b.hx * 2 + 0.09, 1.1, b.hz * 2 * 0.78,
          [0.75, 0.66, 0.45], 0, 0, 0, 0.22);
        const side = h01(b.x * 3, b.z * 5) > 0.5 ? 1 : -1;
        bands.push(b.x + side * b.hx * 0.5, 1.25, b.z, 1.4, 2.5, b.hz * 2 + 0.14,
          [0.03, 0.03, 0.05], 0, 0, 0, 0);
      }

      // --- takskylt: en lysande neonpanel på högkant, som en logga
      if (b.neon > 0.68 && b.h < 58) {
        const w = Math.min(5.5, b.hx * top.f * 1.2);
        const along = h01(b.x * 7, b.z * 11) > 0.5;
        bodies.push(b.x, b.h + 1.9, b.z, along ? w : 0.3, 3.0, along ? 0.3 : w,
          [0.08, 0.08, 0.12], 0, 0, 0, 0);
        bands.push(b.x, b.h + 1.9, b.z, along ? w * 0.86 : 0.44, 2.3, along ? 0.44 : w * 0.86,
          neon, 0, 0, 0, 1.25);
      }
    }
    for (const a of props.antennas) {
      poles.push(a.x, a.y + a.h / 2, a.z, 0.14, a.h, 0.14, [0.2, 0.2, 0.26], 0, 0, 0, 0.1);
      orbs.push(a.x, a.y + a.h + 0.2, a.z, 0.34, 0.34, 0.34, [1.0, 0.25, 0.3], 0, 0, 0, 1.3);
    }
    for (const l of props.lights) {
      poles.push(l.x, 2.6, l.z, 0.14, 5.2, 0.14, [0.16, 0.17, 0.22], 0, 0, 0, 0);
      orbs.push(l.x, 5.35, l.z, 0.45, 0.3, 0.45,
        l.warm ? [1.0, 0.8, 0.5] : [0.5, 0.9, 1.0], 0, 0, 0, 1.1);
    }

    // --- flygande taxi-rutter: raka filer längs gatunätet på olika höjd.
    // Position är en ren funktion av tiden, så trafiken behöver inget
    // eget tillstånd och rullar även bakom menyn.
    const taxis = [];
    const N = Math.floor(WORLD_SIZE / CITY_CELL);
    for (let i = 1; i < N; i++) {
      const line = -WORLD_SIZE / 2 + i * CITY_CELL;
      if (Math.abs(line) > 105) continue;
      if (h01(i * 3.3, 8.8) < 0.15) continue;          // alla gator har inte trafik
      const nCars = 7 + Math.floor(h01(i, 4.2) * 6);
      for (let k = 0; k < nCars; k++) {
        const dir = h01(i * 7, k * 13) > 0.5 ? 1 : -1;
        taxis.push({
          axis: i % 2 === 0 ? 'x' : 'z',
          line: line + dir * 2.6,                       // högertrafik även i luften
          h: 9 + h01(i * 11, k * 5) * 26,
          speed: dir * (7 + h01(k * 9, i) * 6),
          phase: h01(i * 29, k * 31) * WORLD_SIZE,
          cab: h01(i + k, 17.5) > 0.25,                 // några är inte taxi utan mörka bilar
        });
      }
    }

    return {
      terrain: uploadMesh(gl, buildCityGroundMesh(60)),
      static: [bodies, bands, poles, orbs], props, taxis,
    };
  }

  buildWildWorld() {
    const gl = this.gl, m = this.mesh;
    const props = scatterProps();
    const trunks = new InstancedBatch(gl, m.cylTaper, 2048);
    const leaves = new InstancedBatch(gl, m.cone, 2048);
    const rocks = new InstancedBatch(gl, m.box, 2048);
    const crystals = new InstancedBatch(gl, m.octa, 256);
    const tufts = new InstancedBatch(gl, m.cone, 6144);
    const canopy = new InstancedBatch(gl, m.sphere, 2048);   // lövkronor och buskar
    const petals = new InstancedBatch(gl, m.sphere, 4096);   // blomhuvuden, bär, svamphattar
    const logsB = new InstancedBatch(gl, m.cyl, 1024);       // nedfallna stammar, svampfötter

    for (const t of props.trees) {
      const s = t.scale;
      const lean = t.lean || 0;
      if (t.kind === 'broadleaf') {
        // lövträd: kort grov stam och ett klot av löv i tre klumpar
        const h = 2.6 * s;
        trunks.push(t.x, t.y + h * 0.5, t.z, 0.62 * s, h, 0.62 * s, t.trunk, lean, t.rot, 0, 0);
        const cy = t.y + h + 1.5 * s;
        canopy.push(t.x, cy, t.z, 3.2 * s, 2.6 * s, 3.2 * s, t.leaf, 0, t.rot, 0, 0, 0.42 * s);
        for (let i = 0; i < 2; i++) {
          const a = t.rot + i * 2.4;
          canopy.push(t.x + Math.cos(a) * 1.5 * s, cy - 0.5 * s, t.z + Math.sin(a) * 1.5 * s,
            2.1 * s, 1.8 * s, 2.1 * s,
            [t.leaf[0] * 0.88, t.leaf[1] * 0.92, t.leaf[2]], 0, a, 0, 0, 0.38 * s);
        }
      } else if (t.kind === 'birch') {
        // björk: smal ljus stam, gles krona, mörka streck på nävern
        const h = 4.6 * s;
        trunks.push(t.x, t.y + h * 0.5, t.z, 0.30 * s, h, 0.30 * s, t.trunk, lean, t.rot, 0, 0);
        for (let i = 0; i < 3; i++) {
          rocks.push(t.x, t.y + h * (0.3 + i * 0.22), t.z, 0.34 * s, 0.09 * s, 0.34 * s,
            [0.20, 0.19, 0.18], 0, t.rot + i, 0, 0);
        }
        canopy.push(t.x, t.y + h + 0.9 * s, t.z, 2.3 * s, 2.0 * s, 2.3 * s, t.leaf, 0, t.rot, 0, 0, 0.5 * s);
        canopy.push(t.x, t.y + h + 1.9 * s, t.z, 1.5 * s, 1.4 * s, 1.5 * s,
          [t.leaf[0] * 1.05, t.leaf[1] * 1.02, t.leaf[2]], 0, -t.rot, 0, 0, 0.55 * s);
      } else if (t.kind === 'dead') {
        // dött träd: bar stam med ett par knotiga grenar
        const h = 3.8 * s;
        trunks.push(t.x, t.y + h * 0.5, t.z, 0.42 * s, h, 0.42 * s, t.trunk, lean, t.rot, 0, 0);
        for (let i = 0; i < 3; i++) {
          const a = t.rot + i * 2.1;
          const by = t.y + h * (0.55 + i * 0.16);
          trunks.push(t.x + Math.cos(a) * 0.8 * s, by, t.z + Math.sin(a) * 0.8 * s,
            0.16 * s, 1.5 * s, 0.16 * s, t.trunk, 0.9, a, 0, 0);
        }
      } else {
        const h = 3.2 * s;
        trunks.push(t.x, t.y + h * 0.5, t.z, 0.5 * s, h, 0.5 * s, t.trunk, lean, t.rot, 0, 0);
        for (let i = 0; i < t.tiers; i++) {
          const f = i / t.tiers;
          const r = (3.4 - f * 1.5) * s;
          leaves.push(t.x, t.y + h * (0.75 + f * 0.72), t.z, r, 3.0 * s, r,
            [t.leaf[0] * (1 - f * 0.12), t.leaf[1] * (1 - f * 0.1), t.leaf[2]], 0, t.rot + f, 0, 0,
            0.28 * s * (0.5 + f));
        }
      }
    }
    for (const b of props.bushes) {
      const s = b.scale;
      canopy.push(b.x, b.y + 0.5 * s, b.z, 1.5 * s, 1.1 * s, 1.5 * s, b.col, 0, b.rot, 0, 0, 0.2 * s);
      canopy.push(b.x + 0.5 * s, b.y + 0.35 * s, b.z - 0.4 * s, 1.0 * s, 0.8 * s, 1.0 * s,
        [b.col[0] * 0.85, b.col[1] * 0.9, b.col[2]], 0, -b.rot, 0, 0, 0.2 * s);
      if (b.berries) {
        for (let i = 0; i < 3; i++) {
          const a = b.rot + i * 2.1;
          petals.push(b.x + Math.cos(a) * 0.8 * s, b.y + 0.9 * s, b.z + Math.sin(a) * 0.8 * s,
            0.15, 0.15, 0.15, [0.85, 0.15, 0.25], 0, 0, 0, 0.15);
        }
      }
    }
    for (const l of props.logs) {
      // liggande stam: cylindern reses på sidan med en kvarts varv
      logsB.push(l.x, l.y + l.r, l.z, l.r * 2, l.len, l.r * 2, l.col, Math.PI / 2, l.rot, 0, 0);
    }
    for (const m of props.mushrooms) {
      const s = m.scale;
      logsB.push(m.x, m.y + 0.16 * s, m.z, 0.10 * s, 0.32 * s, 0.10 * s, [0.88, 0.85, 0.76], 0, 0, 0, 0);
      petals.push(m.x, m.y + 0.34 * s, m.z, 0.34 * s, 0.22 * s, 0.34 * s, m.col, 0, 0, 0, 0.05);
    }
    for (const f of props.flowers) {
      const s = f.scale;
      tufts.push(f.x, f.y + 0.22 * s, f.z, 0.10 * s, 0.5 * s, 0.10 * s, [0.22, 0.40, 0.16], 0, f.rot, 0, 0, 0.2 * s);
      petals.push(f.x, f.y + 0.50 * s, f.z, 0.32 * s, 0.24 * s, 0.32 * s, f.col, 0, f.rot, 0, 0.28, 0.24 * s);
    }
    for (const r of props.reeds) {
      const s = r.scale;
      for (let i = 0; i < 3; i++) {
        const a = r.rot + i * 2.1;
        tufts.push(r.x + Math.cos(a) * 0.18, r.y + 0.7 * s, r.z + Math.sin(a) * 0.18,
          0.07, 1.5 * s, 0.07, [0.35, 0.42, 0.20], 0.08, a, 0, 0, 0.5 * s);
      }
    }
    for (const r of props.rocks) {
      rocks.push(r.x, r.y + r.sy * 0.28, r.z, r.sx, r.sy, r.sz, r.col, r.rx, r.ry, r.rz, 0);
    }
    for (const c of props.crystals) {
      crystals.push(c.x, c.y + c.scale * 0.8, c.z, c.scale * 0.5, c.scale * 2.2, c.scale * 0.5,
        c.col, 0.12, c.rot, 0.1, 0.55);
    }
    for (const g of props.grassTufts) {
      tufts.push(g.x, g.y + 0.22 * g.scale, g.z, 0.5 * g.scale, 0.9 * g.scale, 0.5 * g.scale,
        [0.20, 0.36, 0.16], 0, g.rot, 0, 0, 0.22 * g.scale);
    }
    return {
      terrain: uploadMesh(gl, buildTerrainMesh(200)),
      static: [trunks, leaves, rocks, crystals, tufts, canopy, petals, logsB],
      props,
    };
  }

  resize() {
    const c = this.canvas;
    const w = Math.max(1, Math.floor(c.clientWidth * this.dpr));
    const h = Math.max(1, Math.floor(c.clientHeight * this.dpr));
    if (c.width !== w || c.height !== h) {
      c.width = w; c.height = h;
    }
    this.width = w; this.height = h;
  }

  clearBatches() {
    for (const k in this.dyn) this.dyn[k].clear();
    this.shadows.clear();
  }

  /**
   * Skuggfläck på marken, kastad bort från ljuset.
   *
   * Solen står stilla i sin bana under dygnet, och skuggan följer med: mitt
   * på dagen ligger den som en liten fläck under fötterna, mot kvällen dras
   * den ut och lägger sig långt åt sidan. Höjden över marken sträcker den
   * ytterligare, så ett hopp syns på marken innan man landar.
   */
  shadow(x, y, z, radius, alpha) {
    const s = this.sun || { x: 0, y: 1, z: 0 };
    // hur lågt ljuset står: 0 = rakt uppifrån, 1 = vid horisonten
    const low = clamp(1 - Math.max(s.y, 0.05), 0, 1);
    const lateral = Math.hypot(s.x, s.z) || 1e-4;
    // skuggan skjuts undan i ljusets riktning
    const reach = radius * 0.9 * low / Math.max(s.y, 0.18);
    const ox = -(s.x / lateral) * Math.min(reach, radius * 6);
    const oz = -(s.z / lateral) * Math.min(reach, radius * 6);
    // och tänjs ut längs samma riktning i stället för att förbli en cirkel
    const stretch = 1 + low * 1.6;
    const yaw = Math.atan2(-s.x, -s.z);
    this.shadows.push(x + ox, y + 0.06, z + oz,
      radius * 2, 1, radius * 2 * stretch, [0, 0, 0], 0, yaw, 0,
      // låg sol ger längre men blekare skugga, som i verkligheten
      alpha * (1 - low * 0.45));
  }

  applyEnv(p, env, eye) {
    p.v3('uSunDir', env.sunDir.x, env.sunDir.y, env.sunDir.z);
    p.v3('uSunCol', env.sunCol);
    p.v3('uAmb', env.amb);
    p.v3('uSkyTint', env.skyTint);
    p.v3('uGroundTint', env.groundTint);
    p.v3('uFogCol', env.fogCol);
    p.v2('uFog', env.fogNear, env.fogFar);
    p.f('uFogHeight', env.fogHeight);
    p.v3('uEye', eye.x, eye.y, eye.z);
    p.m4('uVP', this.vp);
  }

  render(cam, env, time, player) {
    const gl = this.gl;
    this.sun = env.sunDir;   // skuggorna kastas bort från den
    this.resize();
    gl.viewport(0, 0, this.width, this.height);

    // På en hög, smal skärm (telefon på höjden) räcker inte det lodräta
    // synfältet i sidled — vidga det så vyn inte blir ett titthål.
    const aspect = this.width / this.height;
    let fov = cam.fov;
    if (aspect < 1.35) {
      const widen = Math.min(1.5, 1.35 / Math.max(aspect, 0.4));
      fov = 2 * Math.atan(Math.tan(fov / 2) * widen);
    }
    perspective(this.proj, fov, aspect, 0.1, 620);
    lookAt(this.view, cam.pos, cam.target, { x: 0, y: 1, z: 0 });
    multiply(this.vp, this.proj, this.view);
    invert(this.invVP, this.vp);

    gl.clearColor(env.fogCol[0], env.fogCol[1], env.fogCol[2], 1);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    // --- himmel
    gl.disable(gl.DEPTH_TEST); gl.depthMask(false);
    this.pSky.use()
      .m4('uInvVP', this.invVP)
      .v3('uEye', cam.pos.x, cam.pos.y, cam.pos.z)
      .v3('uSunDir', env.sunDir.x, env.sunDir.y, env.sunDir.z)
      .v3('uSunCol', env.sunCol)
      .v3('uSkyTop', env.skyTop)
      .v3('uSkyHorizon', env.skyHor)
      .f('uNight', env.night)
      .f('uTime', time)
      .f('uClouds', env.clouds);
    gl.bindVertexArray(null);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    gl.enable(gl.DEPTH_TEST); gl.depthMask(true);

    // --- terräng
    this.pTerrain.use();
    this.applyEnv(this.pTerrain, env, cam.pos);
    this.pTerrain.v3('uPlayer', player.x, player.y, player.z)
      .f('uNight', env.night)
      .f('uCity', this.worldId === 'city' ? 1 : 0);
    this.terrain.draw();

    // --- alla instansierade objekt (trafiken fylls på strax innan de ritas)
    this.drawTaxis(time);
    this.pInst.use();
    this.applyEnv(this.pInst, env, cam.pos);
    this.pInst.f('uTime', time).v2('uWind', env.wind[0], env.wind[1]);
    for (const b of this.static) b.draw();
    for (const k in this.dyn) this.dyn[k].draw();

    // --- markskuggor
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.depthMask(false);
    this.pShadow.use().m4('uVP', this.vp);
    this.shadows.draw();
    gl.depthMask(true);

    // --- vatten (Neotropolis har inget)
    if (this.worldId !== 'city') {
      gl.disable(gl.CULL_FACE);
      this.pWater.use();
      this.pWater.m4('uVP', this.vp)
        .v3('uEye', cam.pos.x, cam.pos.y, cam.pos.z)
        .v3('uSunDir', env.sunDir.x, env.sunDir.y, env.sunDir.z)
        .v3('uSunCol', env.sunCol)
        .v3('uAmb', env.amb)
        .v3('uFogCol', env.fogCol)
        .v2('uFog', env.fogNear, env.fogFar)
        .f('uTime', time)
        .v3('uSkyTop', env.skyTop)
        .v3('uSkyHor', env.skyHor)
        .f('uSize', WORLD_SIZE)
        .f('uLevel', WATER_LEVEL);
      this.waterMesh.draw();
      gl.enable(gl.CULL_FACE);
    }

    // --- partiklar (additivt)
    this.particles.fill(this.partBatch);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE);
    gl.depthMask(false);
    const rx = this.view[0], ry = this.view[4], rz = this.view[8];
    const ux = this.view[1], uy = this.view[5], uz = this.view[9];
    this.pPart.use().m4('uVP', this.vp).v3('uRight', rx, ry, rz).v3('uUp', ux, uy, uz);
    this.partBatch.draw();
    gl.depthMask(true);
    gl.disable(gl.BLEND);
    gl.bindVertexArray(null);
  }
}

// ═══ audio.js ═══
// Allt ljud syntetiseras i WebAudio — inga ljudfiler behövs.

class Sound {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.muted = false;
  }

  init() {
    if (this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.32;
    this.master.connect(this.ctx.destination);
  }

  resume() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }

  get ready() { return this.ctx && !this.muted; }

  tone({ f = 440, f2 = null, dur = 0.15, type = 'square', vol = 0.3, attack = 0.005, delay = 0 }) {
    if (!this.ready) return;
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f, t);
    if (f2 !== null) o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.master);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  noise({ dur = 0.2, vol = 0.3, freq = 900, q = 1.2, type = 'bandpass', delay = 0, sweep = null }) {
    if (!this.ready) return;
    const c = this.ctx, t = c.currentTime + delay;
    const n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource();
    src.buffer = buf;
    const filt = c.createBiquadFilter();
    filt.type = type;
    filt.frequency.setValueAtTime(freq, t);
    if (sweep) filt.frequency.exponentialRampToValueAtTime(Math.max(40, sweep), t + dur);
    filt.Q.value = q;
    const g = c.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(filt).connect(g).connect(this.master);
    src.start(t);
  }

  /** Liten slumpvariation i tonhöjd, annars låter hundra slag som ett enda. */
  v(amount = 0.08) { return 1 + (Math.random() * 2 - 1) * amount; }

  shoot() {
    this.tone({ f: 720, f2: 240, dur: 0.09, type: 'square', vol: 0.10 });
    this.noise({ dur: 0.06, vol: 0.06, freq: 2400, sweep: 700 });
  }

  // ------------------------------------------------------------- svärdet
  // Tungt och metalliskt: en luftig vissling, en köttig duns och en klang
  // som ringer ut. Varje slag varieras något i tonhöjd.

  swing() {
    const p = this.v(0.14);
    this.noise({ dur: 0.14 * p, vol: 0.11, freq: 400 * p, sweep: 2500 * p, q: 0.8 });
    this.tone({ f: 190 * p, f2: 350 * p, dur: 0.09, type: 'sine', vol: 0.04 });
  }
  swordHit() {
    const p = this.v(0.10);
    this.tone({ f: 195 * p, f2: 62 * p, dur: 0.13, type: 'triangle', vol: 0.13 });
    this.tone({ f: 1180 * p, f2: 700 * p, dur: 0.11, type: 'square', vol: 0.045 });
    this.tone({ f: 1790 * p, f2: 980 * p, dur: 0.08, type: 'square', vol: 0.025, delay: 0.006 });
    this.noise({ dur: 0.09, vol: 0.085, freq: 1500 * p, sweep: 480, q: 1.1 });
  }
  swordCrit() {
    const p = this.v(0.07);
    this.tone({ f: 150 * p, f2: 46 * p, dur: 0.24, type: 'sawtooth', vol: 0.14 });
    this.tone({ f: 1520 * p, f2: 620 * p, dur: 0.3, type: 'square', vol: 0.06 });
    this.tone({ f: 2270 * p, f2: 1380 * p, dur: 0.34, type: 'triangle', vol: 0.045, delay: 0.02 });
    this.noise({ dur: 0.19, vol: 0.12, freq: 2200 * p, sweep: 420, q: 0.9 });
  }

  // -------------------------------------------------------------- lasern
  // Torrt och elektriskt: tunnare, kortare och ljusare än stålet, utan bas.

  laserHit() {
    const p = this.v(0.11);
    this.tone({ f: 920 * p, f2: 215 * p, dur: 0.07, type: 'square', vol: 0.07 });
    this.noise({ dur: 0.07, vol: 0.07, freq: 3200 * p, sweep: 900, q: 1.6, type: 'highpass' });
  }
  laserCrit() {
    const p = this.v(0.08);
    this.tone({ f: 1400 * p, f2: 250 * p, dur: 0.12, type: 'sawtooth', vol: 0.09 });
    this.tone({ f: 2500 * p, f2: 3500 * p, dur: 0.17, type: 'sine', vol: 0.05, delay: 0.02 });
    this.noise({ dur: 0.13, vol: 0.09, freq: 4000 * p, sweep: 1100, q: 1.2, type: 'highpass' });
  }
  droneDive() {
    this.tone({ f: 320, f2: 1500, dur: 0.35, type: 'sawtooth', vol: 0.05 });
  }
  snipe() {
    this.tone({ f: 2200, f2: 420, dur: 0.09, type: 'square', vol: 0.09 });
    this.noise({ dur: 0.16, vol: 0.09, freq: 3000, sweep: 500, q: 1.4 });
  }
  salvo() {
    for (let i = 0; i < 3; i++) {
      this.tone({ f: 420, f2: 150, dur: 0.09, type: 'square', vol: 0.07, delay: i * 0.07 });
    }
  }
  finisher() {
    this.noise({ dur: 0.22, vol: 0.15, freq: 300, sweep: 2800, q: 0.7 });
    this.tone({ f: 130, f2: 48, dur: 0.3, type: 'sawtooth', vol: 0.13 });
    this.tone({ f: 640, f2: 250, dur: 0.16, type: 'triangle', vol: 0.08, delay: 0.06 });
  }
  fireball() {
    this.tone({ f: 190, f2: 55, dur: 0.45, type: 'sawtooth', vol: 0.15 });
    this.noise({ dur: 0.5, vol: 0.16, freq: 600, sweep: 90, q: 0.6, type: 'lowpass' });
    this.tone({ f: 520, f2: 900, dur: 0.18, type: 'sine', vol: 0.06 });
  }
  laser() {
    const p = this.v(0.07);
    this.tone({ f: 1650 * p, f2: 330 * p, dur: 0.11, type: 'sawtooth', vol: 0.085 });
    this.tone({ f: 2500 * p, f2: 900 * p, dur: 0.05, type: 'sine', vol: 0.045 });
    this.noise({ dur: 0.05, vol: 0.04, freq: 4200 * p, sweep: 1400 });
  }
  hit() { this.tone({ f: 300, f2: 120, dur: 0.06, type: 'triangle', vol: 0.12 }); }
  crit() {
    this.tone({ f: 900, f2: 300, dur: 0.10, type: 'sawtooth', vol: 0.13 });
    this.noise({ dur: 0.08, vol: 0.08, freq: 3200, sweep: 900 });
  }
  kill() {
    this.noise({ dur: 0.22, vol: 0.16, freq: 1400, sweep: 160, q: 0.7 });
    this.tone({ f: 180, f2: 60, dur: 0.18, type: 'sawtooth', vol: 0.08 });
  }
  explode() {
    this.noise({ dur: 0.45, vol: 0.24, freq: 700, sweep: 70, q: 0.5, type: 'lowpass' });
    this.tone({ f: 110, f2: 34, dur: 0.35, type: 'sine', vol: 0.16 });
  }
  dash() {
    this.noise({ dur: 0.20, vol: 0.14, freq: 500, sweep: 3200, q: 0.9 });
    this.tone({ f: 260, f2: 880, dur: 0.14, type: 'sine', vol: 0.07 });
  }
  jump() { this.tone({ f: 340, f2: 620, dur: 0.10, type: 'sine', vol: 0.07 }); }
  land() { this.noise({ dur: 0.09, vol: 0.07, freq: 320, sweep: 120, q: 0.8 }); }
  hurt() {
    this.tone({ f: 200, f2: 70, dur: 0.22, type: 'sawtooth', vol: 0.16 });
    this.noise({ dur: 0.18, vol: 0.12, freq: 500, sweep: 120 });
  }
  pickup() { this.tone({ f: 880, f2: 1320, dur: 0.07, type: 'sine', vol: 0.06 }); }
  /** Mynt: två klara toner ovanpå varandra — ska inte gå att blanda ihop med XP. */
  coin() {
    const v = this.v(0.03);
    this.tone({ f: 1180 * v, dur: 0.05, type: 'square', vol: 0.045 });
    this.tone({ f: 1770 * v, dur: 0.10, type: 'square', vol: 0.030, delay: 0.035 });
  }
  /** Klirret när något köps i shoppen. */
  buy() {
    [660, 990, 1320].forEach((f, i) =>
      this.tone({ f, dur: 0.16, type: 'triangle', vol: 0.09, delay: i * 0.05 }));
  }
  /** Nekat köp: kort, torr och otvetydig. */
  denied() { this.tone({ f: 180, f2: 120, dur: 0.14, type: 'square', vol: 0.08 }); }
  heal() {
    this.tone({ f: 520, f2: 780, dur: 0.16, type: 'sine', vol: 0.10 });
    this.tone({ f: 780, f2: 1170, dur: 0.18, type: 'sine', vol: 0.07, delay: 0.06 });
  }
  levelUp() {
    [523, 659, 784, 1047].forEach((f, i) =>
      this.tone({ f, dur: 0.30, type: 'triangle', vol: 0.12, delay: i * 0.07 }));
  }
  waveStart() {
    [196, 262, 330].forEach((f, i) =>
      this.tone({ f, dur: 0.45, type: 'sawtooth', vol: 0.09, delay: i * 0.10 }));
  }
  bossSpawn() {
    this.tone({ f: 70, f2: 40, dur: 1.6, type: 'sawtooth', vol: 0.20 });
    this.tone({ f: 105, f2: 60, dur: 1.6, type: 'square', vol: 0.10, delay: 0.1 });
    this.noise({ dur: 1.4, vol: 0.12, freq: 260, sweep: 60, q: 0.4 });
  }
  /** Parering: skarp metallklang med efterklang — ska höras genom allt annat. */
  parry() {
    const v = this.v(0.05);
    this.tone({ f: 2400 * v, f2: 1500 * v, dur: 0.10, type: 'square', vol: 0.10 });
    this.tone({ f: 3300 * v, f2: 2100 * v, dur: 0.22, type: 'triangle', vol: 0.06, delay: 0.01 });
    this.tone({ f: 300 * v, f2: 150 * v, dur: 0.12, type: 'sine', vol: 0.08 });
    this.noise({ dur: 0.14, vol: 0.08, freq: 5200, q: 1.4, type: 'highpass' });
  }

  /** Parering som slog i tomma luften — kort, matt, ingen klang. */
  parryMiss() {
    this.noise({ dur: 0.12, vol: 0.06, freq: 900, sweep: 300, q: 0.9 });
  }

  /** Åska. far 0 = strax intill och skarpt, 1 = långt bort och dovt. */
  thunder(far = 0.5) {
    const delay = far * 2.6;            // ljudet hinner ifatt ljuset
    const vol = 0.26 * (1 - far * 0.6);
    this.noise({ dur: 0.9 + far * 1.4, vol, freq: 190 - far * 110, q: 0.35,
      sweep: 55, delay });
    this.noise({ dur: 1.6 + far * 1.8, vol: vol * 0.7, freq: 95 - far * 45, q: 0.3,
      delay: delay + 0.18 });
    this.tone({ f: 44, f2: 26, dur: 1.5 + far, type: 'sine', vol: vol * 0.5, delay: delay + 0.05 });
    if (far < 0.5) this.noise({ dur: 0.12, vol: vol * 0.9, freq: 2600, q: 0.9, delay });
  }

  gameOver() {
    [392, 330, 262, 196].forEach((f, i) =>

// ═══ input.js ═══
// Tangentbord och mus. Kameran styrs alltid av musrörelser; pointer lock
// används när webbläsaren tillåter det (låser pekaren så den inte kan lämna
// fönstret), annars fungerar vanliga musrörelser över canvasen direkt.

const clampDelta = (v) => (v > 150 ? 150 : v < -150 ? -150 : v);

class Input {
  constructor(canvas) {
    this.canvas = canvas;
    this.keys = new Set();
    this.justPressed = new Set();
    this.mouseDX = 0;
    this.mouseDY = 0;
    this.cursorNX = 0;
    this.cursorNY = 0;
    this.wheel = 0;
    this.fireDown = false;
    this.parryDown = false;      // höger musknapp: parering i Vildheim
    this.parryPressed = false;   // bara bildrutan då den trycktes ner
    this.locked = false;
    this.sensitivity = 0.0022;
    this.enabled = true;

    addEventListener('keydown', (e) => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab'].includes(e.code)) e.preventDefault();
      if (!this.keys.has(e.code)) this.justPressed.add(e.code);
      this.keys.add(e.code);
    });
    addEventListener('keyup', (e) => this.keys.delete(e.code));
    addEventListener('blur', () => {
      this.keys.clear(); this.fireDown = false; this.parryDown = false;
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!this.enabled) return;
      // Kameran följer alltid musen — även utan pointer lock och utan knapp.
      // Klampen skyddar mot hopp när muspekaren återvänder efter alt-tab e.d.
      this.mouseDX += clampDelta(e.movementX || 0);
      this.mouseDY += clampDelta(e.movementY || 0);
      // Pekarens position i -1..1 — driver kantstyrningen när lås saknas.
      const nx = (e.clientX / Math.max(1, innerWidth)) * 2 - 1;
      const ny = (e.clientY / Math.max(1, innerHeight)) * 2 - 1;
      this.cursorNX = nx < -1 ? -1 : nx > 1 ? 1 : nx;
      this.cursorNY = ny < -1 ? -1 : ny > 1 ? 1 : ny;
    });
    canvas.addEventListener('mousedown', (e) => {
      if (e.button === 0) this.fireDown = true;
      // Högerknappen pareras med. `parryPressed` nollställs i endFrame, så
      // ett tryck ger exakt en parering hur länge man än håller inne.
      if (e.button === 2) {
        if (!this.parryDown) this.parryPressed = true;
        this.parryDown = true;
      }
    });
    addEventListener('mouseup', (e) => {
      if (e.button === 0) this.fireDown = false;
      if (e.button === 2) this.parryDown = false;
    });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('wheel', (e) => { e.preventDefault(); this.wheel += e.deltaY; }, { passive: false });

    document.addEventListener('pointerlockchange', () => {
      this.locked = document.pointerLockElement === canvas;
      if (this.onLockChange) this.onLockChange(this.locked);
    });

    this.initTouch(canvas);
  }

  // ------------------------------------------------------------------ touch

  /**
   * Vänstra halvan av skärmen är en spak som dyker upp där tummen landar,
   * högra halvan sveper kameran. Knapparna trycker samma virtuella tangenter
   * som tangentbordet, så resten av spelet behöver inte veta något om touch.
   */
  initTouch(canvas) {
    // Enheter vars primära pekdon är ett finger räknas som touch direkt, så
    // menyerna hinner visa rätt hjälptext innan någon rört skärmen.
    this.touch = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
    if (this.touch) document.body.classList.add('touch');
    this.stickActive = false;
    this.stickBase = { x: 0, y: 0 };
    this.stickVec = { x: 0, y: 0 };
    this.moveId = null;
    this.lookId = null;
    this.lookPrev = { x: 0, y: 0 };
    this.touchSensitivity = 0.0052;
    const RADIUS = 62;

    const first = () => {
      if (this.touch) return;
      this.touch = true;
      document.body.classList.add('touch');
      if (this.onTouchStart) this.onTouchStart();
    };

    canvas.addEventListener('touchstart', (e) => {
      first();
      if (!this.enabled) return;
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.clientX < innerWidth * 0.5) {
          if (this.moveId !== null) continue;
          this.moveId = t.identifier;
          this.stickActive = true;
          this.stickBase.x = t.clientX; this.stickBase.y = t.clientY;
          this.stickVec.x = 0; this.stickVec.y = 0;
        } else {
          if (this.lookId !== null) continue;
          this.lookId = t.identifier;
          this.lookPrev.x = t.clientX; this.lookPrev.y = t.clientY;
        }
      }
    }, { passive: false });

    canvas.addEventListener('touchmove', (e) => {
      if (!this.enabled) return;
      e.preventDefault();
      for (const t of e.changedTouches) {
        if (t.identifier === this.moveId) {
          let dx = t.clientX - this.stickBase.x;
          let dy = t.clientY - this.stickBase.y;
          const d = Math.hypot(dx, dy);
          if (d > RADIUS) { dx = (dx / d) * RADIUS; dy = (dy / d) * RADIUS; }
          this.stickVec.x = dx / RADIUS;
          this.stickVec.y = dy / RADIUS;
        } else if (t.identifier === this.lookId) {
          this.mouseDX += clampDelta(t.clientX - this.lookPrev.x);
          this.mouseDY += clampDelta(t.clientY - this.lookPrev.y);
          this.lookPrev.x = t.clientX; this.lookPrev.y = t.clientY;
        }
      }
    }, { passive: false });

    const end = (e) => {
      for (const t of e.changedTouches) {
        if (t.identifier === this.moveId) {
          this.moveId = null; this.stickActive = false;
          this.stickVec.x = 0; this.stickVec.y = 0;
        } else if (t.identifier === this.lookId) {
          this.lookId = null;
        }
      }
    };
    canvas.addEventListener('touchend', end);
    canvas.addEventListener('touchcancel', end);
  }

  /** Kopplar en skärmknapp till en tangent (eller attack via data-attack). */
  bindButton(el) {
    const key = el.dataset.key;
    const attack = el.hasAttribute('data-attack');
    const press = (e) => {
      e.preventDefault();
      el.classList.add('held');
      if (attack) this.fireDown = true;
      else if (key) {
        if (!this.keys.has(key)) this.justPressed.add(key);
        this.keys.add(key);
      }
    };
    const release = (e) => {
      if (e) e.preventDefault();
      el.classList.remove('held');
      if (attack) this.fireDown = false;
      else if (key) this.keys.delete(key);
    };
    el.addEventListener('touchstart', press, { passive: false });
    el.addEventListener('touchend', release, { passive: false });
    el.addEventListener('touchcancel', release, { passive: false });
  }

  requestLock() {
    if (this.canvas.requestPointerLock) {
      const r = this.canvas.requestPointerLock();
      if (r && typeof r.catch === 'function') r.catch(() => {});
    }
  }
  releaseLock() {
    if (document.pointerLockElement) document.exitPointerLock();
  }

  down(code) { return this.keys.has(code); }
  pressed(code) { return this.justPressed.has(code); }

  /** Rörelseriktning i lokala koordinater: x = höger, y = framåt. */
  moveAxis() {
    if (this.stickActive) {
      // skärmens y pekar nedåt, spelets framåt är uppåt
      return { x: this.stickVec.x, y: -this.stickVec.y };
    }
    let x = 0, y = 0;
    if (this.down('KeyW') || this.down('ArrowUp')) y += 1;
    if (this.down('KeyS') || this.down('ArrowDown')) y -= 1;
    if (this.down('KeyD') || this.down('ArrowRight')) x += 1;
    if (this.down('KeyA') || this.down('ArrowLeft')) x -= 1;
    const l = Math.hypot(x, y);
    if (l > 1) { x /= l; y /= l; }
    return { x, y };
  }

  /** Nollställ engångsvärden i slutet av varje bildruta. */
  endFrame() {
    this.justPressed.clear();
    this.parryPressed = false;
    this.mouseDX = 0;
    this.mouseDY = 0;
    this.wheel = 0;
  }
}

// ═══ upgrades.js ═══
// Uppgraderingskorten som erbjuds vid varje nivå-upp.
//
// TVÅ SAKER ATT VETA INNAN DU ÄNDRAR HÄR:
//
// 1. Korten är ADDITIVA, inte multiplikativa. Ett skadekort lägger till
//    `damageBonus`, och den effektiva skadan räknas som bas × (1 + bonus).
//    Tidigare gjorde varje kort `damage *= 1.25`, och åtta staplade kort blev
//    då ×6 — gånger eldhastighet gånger splitterskott blev spelaren 200 gånger
//    starkare medan fienderna växte 13. Additivt blir samma åtta kort ×2,6,
//    och kurvorna kan följas åt. Skriv aldrig `st.damage *= n` igen.
//
// 2. Korten är delade i en gemensam grund och en gren per värld. Grunden
//    (hälsa, fart, skada) passar båda; grenen speglar hur man slåss —
//    fé och eldmagi i Vildheim, drönare och laser i Neotropolis. Ett kort
//    med `world` erbjuds bara i den världen.

/** Räknar om effektiva värden ur bas + bonus. Anropa efter varje ändring. */
function recalc(st) {
  st.damage = st.damageBase * (1 + st.damageBonus);
  st.fireRate = st.fireRateBase * (1 + st.fireRateBonus);
  st.speed = st.speedBase * (1 + st.speedBonus);
}

const UPGRADES = [...CORE, ...WILD, ...CITY];

/** Slumpar n unika kort som passar världen och som spelaren inte maxat. */
function rollChoices(levels, n = 3, worldId = 'wild') {
  const pool = UPGRADES.filter((u) =>
    (!u.world || u.world === worldId) && (levels.get(u.id) || 0) < u.max);
  const out = [];
  while (out.length < n && pool.length) {
    const i = (Math.random() * pool.length) | 0;
    out.push(pool[i]);
    pool.splice(i, 1);
  }
  return out;
}

function priceOf(ware, owned) {
  return Math.round(ware.base * Math.pow(ware.grow, owned));
}

function rotY(x, z, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [c * x + s * z, -s * x + c * z];
}

function defaultStats() {

  };
}

const CRIT_CAP = 0.6;

/* Pareringens tajming. Fönstret är kort nog att kräva att man ser skottet
   komma, och återladdningen lång nog att man inte kan spamma knappen. */
const PARRY_WINDOW = 0.28;
const PARRY_COOLDOWN = 0.85;

/* Så länge efter en träff ligger regenen nere. Den ska läka mellan strider,
   inte under dem — annars blir uthållighet gratis. Livstöld är vägen till
   läkning mitt i striden, och den kräver att man faktiskt träffar något. */
const REGEN_DELAY = 4.0;

class Player {
  constructor(world) {
    this.world = world;
    this.reset();
  }

  reset() {
    this.stats = defaultStats();
    this.pos = { x: 0, y: terrainHeight(0, 0) + 2, z: 0 };
    this.vel = { x: 0, y: 0, z: 0 };
    this.hp = this.stats.maxHp;
    this.armor = 0;          // rustningsnivå, byggs upp av fynd i äventyret
    this.yaw = 0;
    this.camYaw = 0;

    this.camDist = 9.3;
    this.camDistNow = 9.3;
    this.camPos = { x: 0, y: 6, z: 10 };

    this.fovNow = 1.22;
    this.grounded = false;
    this.jumpsLeft = 1;
    this.dashCharges = this.stats.dashMax;
    this.dashTimer = 0;      // återladdning
    this.dashTime = 0;       // aktiv dash
    this.dashDir = { x: 0, z: 1 };
    this.invuln = 0;
    this.fireTimer = 0;
    this.walkPhase = 0;
    this.hitFlash = 0;
    this.radius = 0.55;
    this.inWater = false;
    this.aim = { x: 0, y: 0, z: 1 };
    this.aimYaw = 0;
    this.droneAngle = 0;
    this.droneTimer = 0;
    this.alive = true;
    this.shake = 0;
    this.shotSide = 1;       // Neotropolis: lasern alternerar mellan händerna
    this.thrusting = false;
    this.swingTime = 0;      // Vildheim: pågående svärdssving
    this.swingDur = 0.26;
    this.swingSide = 1;
    this.swingFinisher = false;
    this.combo = -1;         // 0,1,2 — det tredje hugget är en finisher
    this.comboTimer = 0;
    this.fireballCdMax = this.stats.fireballCool;
    this.fireballCd = 0;
    // Parering (bara Vildheim): ett kort fönster där skott slås tillbaka.
    this.parryTime = 0;      // > 0 medan fönstret är öppet
    this.parryCd = 0;        // återladdning
    this.parryFlash = 0;     // lyser till när något faktiskt pareras
    this.regenBlock = 0;     // regenen sover en stund efter varje träff
  }

  get camForward() {
    const cp = Math.cos(this.camPitch);
    return { x: Math.sin(this.camYaw) * cp, y: Math.sin(this.camPitch), z: Math.cos(this.camYaw) * cp };
  }

  look(dx, dy, sens) {
    this.camYaw -= dx * sens;
    // Uppåtgränsen är generös: i Neotropolis kommer fienderna ovanifrån.
    this.camPitch = clamp(this.camPitch - dy * sens, -1.15, 1.0);
    if (this.camYaw > Math.PI) this.camYaw -= TAU;
    if (this.camYaw < -Math.PI) this.camYaw += TAU;
  }

  zoom(delta) {
    this.camDist = clamp(this.camDist + delta * 0.01, 7, 24);
  }

  /**
   * Styrning utan pointer lock. Mitten av skärmen är en stor fri zon där du
   * siktar med korshåret utan att kameran rör sig; först när pekaren närmar
   * sig kanterna börjar vyn svepa — mjukt och likadant i båda led.
   */
  steer(input, dt) {
    // Stor fri zon: vyn står helt stilla över nästan hela skärmen och sveper
    // först när du medvetet för pekaren ut i kanten. En kamera som kryper av
    // sig själv är det som känns obehagligt.
    const dead = 0.82;
    const ramp = (v) => {
      const m = Math.abs(v);
      if (m <= dead) return 0;
      const t = clamp((m - dead) / (1 - dead), 0, 1);
      return (v < 0 ? -1 : 1) * t * t * (3 - 2 * t);
    };
    this.camYaw -= ramp(input.cursorNX) * 3.4 * dt;
    if (this.camYaw > Math.PI) this.camYaw -= TAU;
    if (this.camYaw < -Math.PI) this.camYaw += TAU;
    this.camPitch = clamp(this.camPitch - ramp(input.cursorNY) * 1.7 * dt, -1.15, 1.0);
  }

  /**
   * Riktningen från kameran genom muspekaren — korshåret sitter där pekaren är.
   * Utgår från kamerans faktiska blickriktning (inte den ideala vinkeln), så
   * axelförskjutningen och markklampen inte gör siktet skevt.
   */
  cursorRay() {
    const inp = this.world.input;
    const eye = this.camPos, tgt = this.camTarget || this.pos;
    let fx = tgt.x - eye.x, fy = tgt.y - eye.y, fz = tgt.z - eye.z;
    const fl = Math.hypot(fx, fy, fz) || 1;
    fx /= fl; fy /= fl; fz /= fl;
    // muslås och touch siktar båda rakt fram genom skärmens mitt
    if (!inp || inp.locked || inp.touch) return { x: fx, y: fy, z: fz };

    // kamerans egna höger- och uppvektor
    let rx = -fz, rz = fx;
    const rl = Math.hypot(rx, rz) || 1;
    rx /= rl; rz /= rl;
    const ux = -rz * fy, uy = rz * fx - rx * fz, uz = rx * fy;

    const rend = this.world.renderer;
    const aspect = rend && rend.height ? rend.width / rend.height : 1.6;
    const tan = Math.tan(this.fovNow / 2);
    const ax = inp.cursorNX * tan * aspect;
    const ay = -inp.cursorNY * tan;
    const dx = fx + rx * ax + ux * ay;
    const dy = fy + uy * ay;
    const dz = fz + rz * ax + uz * ay;
    const l = Math.hypot(dx, dy, dz) || 1;
    return { x: dx / l, y: dy / l, z: dz / l };
  }

  takeDamage(n, source, ctx) {
    if (this.invuln > 0 || !this.alive) return false;
    // Taggar/statiskt fält: den som slår dig får smaka på det själv
    if (this.stats.thorns > 0 && source && source.alive && ctx) {
      source.damage(this.stats.thorns, ctx, false);
    }
    // Rustningen dämpar med avtagande effekt: varje nivå hjälper, men
    // kurvan når aldrig noll skada hur många delar man än hittar.
    if (this.armor > 0) n /= 1 + this.armor * 0.06;
    this.hp -= n;
    // Regenen tystnar en stund efter en träff. Utan den pausen tickar den
    // mitt i striden och gör spelaren odödlig sent i en körning — man tålde
    // 42 träffar och läkte igen var och en på tre sekunder.
    this.regenBlock = REGEN_DELAY;
    this.invuln = 0.55;
    this.hitFlash = 1;
    this.shake = Math.min(1.2, this.shake + 0.35 + n * 0.012);
    if (this.hp <= 0) { this.hp = 0; this.alive = false; }
    return true;
  }

  heal(n) {
    this.hp = Math.min(this.stats.maxHp, this.hp + n);
  }

  /**
   * Öppnar pareringsfönstret. Kort och med återladdning: pareringen ska vara
   * ett beslut med tajming, inte något man håller inne. Träffar den inget
   * kostar den ändå sin cooldown, så det finns en risk i att gissa.
   */
  tryParry() {
    if (this.parryCd > 0 || this.parryTime > 0 || !this.alive) return false;
    this.parryTime = PARRY_WINDOW;
    this.parryCd = PARRY_COOLDOWN;
    return true;
  }

  tryDash(input) {
    if (this.dashCharges <= 0 || this.dashTime > 0) return false;
    const ax = input.moveAxis();
    let dx, dz;
    if (ax.x || ax.y) {
      const f = { x: Math.sin(this.camYaw), z: Math.cos(this.camYaw) };
      const r = { x: -Math.cos(this.camYaw), z: Math.sin(this.camYaw) };
      dx = f.x * ax.y + r.x * ax.x;
      dz = f.z * ax.y + r.z * ax.x;
    } else {
      dx = Math.sin(this.yaw); dz = Math.cos(this.yaw);
    }
    const l = Math.hypot(dx, dz) || 1;
    this.dashDir.x = dx / l; this.dashDir.z = dz / l;
    this.dashCharges--;
    this.dashTime = 0.18;
    this.invuln = Math.max(this.invuln, 0.30);
    this.vel.x = this.dashDir.x * 40;
    this.vel.z = this.dashDir.z * 40;
    if (!this.grounded) this.vel.y = Math.max(this.vel.y, 1.5);
    return true;
  }

  update(dt, input, snap) {
    const st = this.stats;
    const w = this.world;

    // ---- kamera-look
    if (input.enabled) {
      if (input.touch) this.look(input.mouseDX, input.mouseDY, input.touchSensitivity);
      else if (input.locked) this.look(input.mouseDX, input.mouseDY, input.sensitivity);
      else this.steer(input, dt);
    }
    if (input.wheel) this.zoom(input.wheel);

    // ---- rörelse
    const ax = input.moveAxis();
    const f = { x: Math.sin(this.camYaw), z: Math.cos(this.camYaw) };
    const r = { x: -Math.cos(this.camYaw), z: Math.sin(this.camYaw) };
    let wishX = f.x * ax.y + r.x * ax.x;
    let wishZ = f.z * ax.y + r.z * ax.x;
    const wishLen = Math.hypot(wishX, wishZ);
    if (wishLen > 0.001) { wishX /= wishLen; wishZ /= wishLen; }

    const speed = st.speed * (this.inWater ? 0.62 : 1);
    const accel = (this.grounded ? 74 : 26) * dt;
    if (this.dashTime <= 0) {
      const tx = wishX * speed * wishLen, tz = wishZ * speed * wishLen;
      this.vel.x += clamp(tx - this.vel.x, -accel, accel);
      this.vel.z += clamp(tz - this.vel.z, -accel, accel);
      if (this.grounded && wishLen < 0.01) {
        const fr = Math.exp(-9 * dt);
        this.vel.x *= fr; this.vel.z *= fr;
      }
    } else {
      this.dashTime -= dt;
      const fade = Math.exp(-4 * dt);
      this.vel.x *= fade; this.vel.z *= fade;
      w.particles.spawn({
        x: this.pos.x, y: this.pos.y + 0.9 + rand(-0.4, 0.4), z: this.pos.z,
        vx: rand(-1.5, 1.5), vy: rand(0, 2), vz: rand(-1.5, 1.5),
        life: rand(0.25, 0.5), size: rand(0.35, 0.75), size2: 0,
        col: [0.35, 0.95, 1.0], alpha: 0.9, drag: 0.5,
      });
      /*
       * Spåret: en rad efterbilder längs sträckan man just tillryggalagt,
       * inte bara ett moln kring kroppen. De läggs ut bakåt från nuvarande
       * läge så bandet blir obrutet även när dashen går fort — vid 40 m/s
       * hinner man annars flera meter mellan bildrutorna och spåret blir
       * en rad prickar.
       */
      const back = Math.hypot(this.vel.x, this.vel.z) * dt;
      const steps = Math.min(5, 1 + Math.floor(back / 0.6));
      for (let i = 0; i < steps; i++) {
        const f = i / steps;
        for (let k = 0; k < 2; k++) {
          w.particles.spawn({
            x: this.pos.x - this.dashDir.x * back * f + rand(-0.25, 0.25),
            y: this.pos.y + 0.35 + k * 0.85 + rand(-0.15, 0.15),
            z: this.pos.z - this.dashDir.z * back * f + rand(-0.25, 0.25),
            vx: 0, vy: rand(0.1, 0.5), vz: 0,
            life: rand(0.28, 0.46), size: rand(0.55, 0.95), size2: 0.05,
            col: w.worldId === 'city' ? [1.0, 0.35, 0.62] : [0.55, 0.95, 1.0],
            alpha: 0.55, drag: 1.4,
          });
        }
      }
    }

    // ---- hopp / flygning / dash
    const canFly = w.worldId === 'city';
    this.thrusting = false;
    if (canFly && input.down('Space')) {
      // cyborg-thrusters: håll mellanslag för att lyfta och flyga
      this.vel.y = Math.min(this.vel.y + 58 * dt, 11);
      if (this.pos.y > 58) this.vel.y = Math.min(this.vel.y, 0);   // mjukt höjdtak
      this.grounded = false;
      this.thrusting = true;
      if (Math.random() < 0.65) {
        w.particles.spawn({
          x: this.pos.x + rand(-0.25, 0.25), y: this.pos.y + 0.3, z: this.pos.z + rand(-0.25, 0.25),
          vx: rand(-1, 1), vy: rand(-7, -4), vz: rand(-1, 1),
          life: rand(0.25, 0.45), size: rand(0.3, 0.55), size2: 0,
          col: [1.0, 0.45, 0.6], alpha: 0.85, drag: 0.3,
        });
      }
    } else if (input.pressed('Space')) {
      if (this.grounded || this.jumpsLeft > 0) {
        if (!this.grounded) this.jumpsLeft--;
        this.vel.y = 13.2;
        this.grounded = false;
        w.sound.jump();
        w.particles.burst(this.pos.x, this.pos.y + 0.1, this.pos.z, 6,
          { speed: 3, life: 0.35, size: 0.5, col: [0.6, 0.8, 0.9], alpha: 0.5, grav: -6, drag: 0.4 });
      }
    }
    if ((input.pressed('ShiftLeft') || input.pressed('ShiftRight') || input.pressed('KeyE')) && this.tryDash(input)) {
      w.sound.dash();
      w.particles.burst(this.pos.x, this.pos.y + 0.9, this.pos.z, 18,
        { speed: 9, life: 0.4, size: 0.7, col: [0.3, 0.9, 1.0], alpha: 0.8, drag: 0.6 });
    }

    // ---- gravitation och mark (i staden glidflyger cyborgen)
    const gravF = this.dashTime > 0 ? 0.25 : this.thrusting ? 0 : canFly && !this.grounded ? 0.4 : 1;
    this.vel.y += GRAVITY * dt * gravF;
    if (canFly && this.vel.y < -13) this.vel.y = -13;
    this.pos.x += this.vel.x * dt;
    this.pos.y += this.vel.y * dt;
    this.pos.z += this.vel.z * dt;

    clampToArena(this.pos);
    if (w.colliders.resolve(this.pos, this.radius)) {
      // glid längs hindret istället för att fastna
      this.vel.x *= 0.85; this.vel.z *= 0.85;
    }

    const gh = terrainHeight(this.pos.x, this.pos.z);
    const wasAir = !this.grounded;
    if (this.pos.y <= gh) {
      if (wasAir && this.vel.y < -12) {
        w.sound.land();
        w.particles.burst(this.pos.x, gh + 0.1, this.pos.z, 8,
          { speed: 4, life: 0.3, size: 0.5, col: [0.75, 0.72, 0.6], alpha: 0.55, grav: -10, drag: 0.5 });
      }
      this.pos.y = gh;
      this.vel.y = 0;
      this.grounded = true;
      this.jumpsLeft = st.jumps;
    } else {
      this.grounded = false;
    }

    const wasWater = this.inWater;
    this.inWater = this.pos.y < WATER_LEVEL + 0.15;
    if (this.inWater && !wasWater) {
      w.particles.burst(this.pos.x, WATER_LEVEL + 0.2, this.pos.z, 14,
        { speed: 5, life: 0.5, size: 0.55, col: [0.45, 0.8, 0.95], alpha: 0.75, grav: -14, drag: 0.4 });
    }

    // ---- riktning och timers: gubben vänder sig dit korshåret pekar
    const turnRate = (wishLen > 0.02 || input.fireDown) ? 22 : 15;
    const face = this.aimYaw === undefined ? this.camYaw : this.aimYaw;
    this.yaw += angleDelta(this.yaw, face) * Math.min(1, dt * turnRate);
    const planar = Math.hypot(this.vel.x, this.vel.z);
    this.walkPhase += dt * (this.grounded ? planar * 1.15 : 3);

    this.invuln = Math.max(0, this.invuln - dt);
    this.hitFlash = Math.max(0, this.hitFlash - dt * 3);
    this.fireTimer = Math.max(0, this.fireTimer - dt);
    this.swingTime = Math.max(0, this.swingTime - dt);
    this.comboTimer = Math.max(0, this.comboTimer - dt);
    this.fireballCd = Math.max(0, this.fireballCd - dt);
    this.parryTime = Math.max(0, this.parryTime - dt);
    this.parryCd = Math.max(0, this.parryCd - dt);
    this.parryFlash = Math.max(0, this.parryFlash - dt * 2.6);
    this.shake = Math.max(0, this.shake - dt * 2.4);
    if (this.dashCharges < st.dashMax) {
      this.dashTimer += dt;
      if (this.dashTimer >= st.dashRecharge) { this.dashTimer = 0; this.dashCharges++; }
    } else this.dashTimer = 0;
    this.regenBlock = Math.max(0, this.regenBlock - dt);
    if (st.regen > 0 && this.regenBlock <= 0 && this.hp < st.maxHp) this.heal(st.regen * dt);
    this.droneAngle += dt * 1.6;
    this.droneTimer -= dt;

    // ---- kamera
    this.updateCamera(dt, planar);
  }

  updateCamera(dt, planar) {
    // Kameran sitter högt och en bit bakom, och blicken riktas en bit ovanför
    // figuren. Då hamnar gubben liten och lågt i bild och världen framför
    // syns — det är därför man ser vad man flyger in i.
    const rx = -Math.cos(this.camYaw), rz = Math.sin(this.camYaw);
    const focus = {
      x: this.pos.x + rx * 1.65,
      y: this.pos.y + EYE + 1.65,
      z: this.pos.z + rz * 1.65,
    };
    const dir = this.camForward;
    const want = this.camDist;
    // dra in kameran om terrängen är i vägen
    let allowed = want;
    for (let i = 1; i <= 8; i++) {
      const t = (i / 8) * want;
      const px = focus.x - dir.x * t, py = focus.y - dir.y * t, pz = focus.z - dir.z * t;
      if (py < terrainHeight(px, pz) + 0.7) { allowed = Math.max(1.8, t - 0.5); break; }
    }
    // snabb men inte hackig indragning när något skymmer, mjuk utfällning
    this.camDistNow = damp(this.camDistNow, allowed, allowed < this.camDistNow ? 0.0001 : 0.02, dt);

    const tx = focus.x - dir.x * this.camDistNow;
    const ty = focus.y - dir.y * this.camDistNow + 0.35;
    const tz = focus.z - dir.z * this.camDistNow;
    // en aning eftersläp ger fart åt rörelsen utan att kännas gummiaktigt
    this.camPos.x = damp(this.camPos.x, tx, 0.0035, dt);
    this.camPos.y = damp(this.camPos.y, ty, 0.0035, dt);
    this.camPos.z = damp(this.camPos.z, tz, 0.0035, dt);
    const minY = terrainHeight(this.camPos.x, this.camPos.z) + 0.6;
    if (this.camPos.y < minY) this.camPos.y = minY;

    const wantFov = 1.22 + smoothstep(6, 22, planar) * 0.13 + (this.dashTime > 0 ? 0.14 : 0);
    this.fovNow = damp(this.fovNow, wantFov, 0.002, dt);
    this.camTarget = focus;
  }

  /** Kameran som renderaren vill ha den, inklusive skärmskak. */
  camera(time) {
    const s = this.shake * this.shake;
    const jx = Math.sin(time * 47) * s * 0.35, jy = Math.cos(time * 41) * s * 0.35;
    return {
      pos: { x: this.camPos.x + jx, y: this.camPos.y + jy, z: this.camPos.z },
      target: { x: this.camTarget.x + jx * 0.5, y: this.camTarget.y + jy * 0.5, z: this.camTarget.z },
      fov: this.fovNow,
    };
  }

  /** Siktriktning från kameran, med lätt målhjälp. */
  aimDir(enemies) {
    const cf = this.cursorRay();
    const origin = { x: this.camPos.x, y: this.camPos.y, z: this.camPos.z };
    const far = { x: origin.x + cf.x * 70, y: origin.y + cf.y * 70, z: origin.z + cf.z * 70 };
    const muzzle = this.muzzle();
    let dx = far.x - muzzle.x, dy = far.y - muzzle.y, dz = far.z - muzzle.z;
    let l = Math.hypot(dx, dy, dz) || 1;
    dx /= l; dy /= l; dz /= l;

    // mild sikthjälp mot närmaste fiende inom en smal kon. I Neotropolis flyger
    // fienderna — striden är 3D — så konen är bredare där, och med tummen som
    // sikte behövs mer hjälp än med mus.
    const inp2 = this.world.input;
    let bestDot = this.world.worldId === 'city' ? 0.955 : 0.978;
    if (inp2 && inp2.touch) bestDot -= 0.03;
    let best = null;
    for (const e of enemies) {
      if (!e.alive) continue;
      let ex = e.pos.x - muzzle.x, ey = e.pos.y + e.height * 0.5 - muzzle.y, ez = e.pos.z - muzzle.z;
      const d = Math.hypot(ex, ey, ez);
      if (d > 55 || d < 0.001) continue;
      ex /= d; ey /= d; ez /= d;
      const dot = ex * dx + ey * dy + ez * dz;
      if (dot > bestDot) { bestDot = dot; best = { x: ex, y: ey, z: ez }; }
    }
    if (best) {
      dx = lerp(dx, best.x, 0.65); dy = lerp(dy, best.y, 0.65); dz = lerp(dz, best.z, 0.65);
      l = Math.hypot(dx, dy, dz) || 1;
      dx /= l; dy /= l; dz /= l;
    }
    this.aim.x = dx; this.aim.y = dy; this.aim.z = dz;
    this.aimYaw = Math.atan2(dx, dz);   // gubben vänder sig hit
    return this.aim;
  }

  muzzle() {
    if (this.world.worldId === 'city') {
      // lasern skjuts ur handflatorna, växelvis vänster/höger
      const [ox, oz] = rotY(0.48 * this.shotSide, 0.7, this.yaw);
      return { x: this.pos.x + ox, y: this.pos.y + 1.6, z: this.pos.z + oz };
    }
    const [ox, oz] = rotY(0.42, 0.75, this.yaw);
    return { x: this.pos.x + ox, y: this.pos.y + 1.25, z: this.pos.z + oz };
  }

  /** Ritar figuren i renderarens batchar. */
  draw(rend, time) {
    const B = rend.dyn;
    const f = this.hitFlash;
    const city = this.world.worldId === 'city';
    // Vildheim: vildmarkskrigare i läder med brons och bärnstensmagi.
    // Neotropolis: gunmetal-cyborg med magenta energi och iskalla detaljer.
    const base = city ? {
      plate: [0.16, 0.16, 0.21], suit: [0.06, 0.07, 0.10], accent: [0.85, 0.20, 0.45],
      trim: [1.0, 0.30, 0.55], gold: [0.55, 0.95, 1.0], cape: [0.20, 0.03, 0.12],
    } : {
      plate: [0.40, 0.26, 0.14], suit: [0.19, 0.12, 0.07], accent: [0.30, 0.34, 0.18],
      trim: [1.0, 0.62, 0.22], gold: [0.72, 0.52, 0.24], cape: [0.11, 0.22, 0.12],
    };
    const F = (c0) => [lerp(c0[0], 1.0, f), lerp(c0[1], 0.35, f), lerp(c0[2], 0.4, f)];
    const plate = F(base.plate), suit = F(base.suit), accent = F(base.accent), cape = F(base.cape);
    const trim = base.trim, gold = base.gold;

    const y = this.pos.y, x = this.pos.x, z = this.pos.z, yaw = this.yaw;
    const csY = Math.cos(yaw), snY = Math.sin(yaw);
    const P = (lx, ly, lz) => [x + csY * lx + snY * lz, y + ly, z - snY * lx + csY * lz];
    const put = (batch, p, sx, sy, sz, col, rx = 0, ryOff = 0, rz = 0, g = 0) =>
      batch.push(p[0], p[1], p[2], sx, sy, sz, col, rx, yaw + ryOff, rz, g);

    const inv = this.invuln > 0 ? 0.3 + Math.sin(time * 30) * 0.15 : 0;
    const dash = this.dashTime > 0 ? 1 : 0;
    const planar = Math.hypot(this.vel.x, this.vel.z);
    const moving = this.grounded && planar > 0.6;
    const air = this.grounded ? 0 : 1;
    const amp = this.grounded ? clamp(planar * 0.10, 0, 0.9) : 0.3;
    const swing = Math.sin(this.walkPhase) * amp;
    const bob = moving ? Math.abs(Math.sin(this.walkPhase)) * 0.07 : 0;
    const breathe = 1 + Math.sin(time * 2.1) * 0.012;
    const lean = clamp(planar * 0.011, 0, 0.18) + dash * 0.3;

    // ---- ben i två segment: lårplåt, benskena, knäskydd och känga
    for (const s of [-1, 1]) {
      const ph = this.walkPhase + (s > 0 ? 0 : Math.PI);
      const sw = (moving || air ? Math.sin(ph) * amp : 0) + air * 0.3;
      const lift = (moving ? Math.max(0, -Math.cos(ph)) * 0.5 : 0) + air * 0.45;
      const hipY = 1.08 + bob, hx = 0.27 * s;
      const kneeY = hipY - 0.5 * Math.cos(sw), kneeZ = -0.5 * Math.sin(sw);
      const shinSw = sw + lift;
      const footY = kneeY - 0.48 * Math.cos(shinSw), footZ = kneeZ - 0.48 * Math.sin(shinSw);
      put(B.box, P(hx, hipY - 0.25 * Math.cos(sw), -0.25 * Math.sin(sw)),
        0.30, 0.52, 0.34, plate, sw, 0, 0, inv);
      put(B.sphere, P(hx, kneeY, kneeZ), 0.24, 0.2, 0.24, accent, sw, 0, 0, city ? 0.25 : 0);
      put(B.box, P(hx, kneeY - 0.24 * Math.cos(shinSw), kneeZ - 0.24 * Math.sin(shinSw)),
        0.24, 0.5, 0.27, suit, shinSw, 0, 0, inv);
      put(B.box, P(hx, footY + 0.07, footZ + 0.09), 0.28, 0.16, 0.44, plate, shinSw * 0.3, 0, 0, inv);
    }

    // ---- höftparti med sidoplåtar
    put(B.box, P(0, 1.16 + bob, 0), 0.74, 0.3, 0.48, plate, 0, 0, 0, inv);
    for (const s of [-1, 1]) put(B.box, P(0.42 * s, 1.04 + bob, 0), 0.14, 0.4, 0.4, plate, 0, 0, 0.12 * s, inv);
    put(B.box, P(0, 1.14 + bob, 0.26), 0.2, 0.14, 0.06, gold, 0, 0, 0, 0.3);

    // ---- bål: underdräkt och väst som andas
    put(B.box, P(0, 1.56 + bob, lean * 0.1), 0.6, 0.76, 0.42, suit, lean, 0, 0, inv);
    put(B.box, P(0, 1.76 + bob, 0.08 + lean * 0.18), 0.8 * breathe, 0.56, 0.5, plate, lean, 0, 0, inv);
    if (city) {
      // glödande energikärna + magdetalj
      put(B.octa, P(0, 1.78 + bob, 0.3 + lean * 0.2), 0.24, 0.34, 0.2, trim, 0, time * 1.5, 0, 1.0);
      put(B.box, P(0, 1.38 + bob, 0.24), 0.3, 0.24, 0.06, accent, 0, 0, 0, 0.25);
    } else {
      // axelrem tvärs över västen + bärnstensamulett som glöder när eldbollen är redo
      put(B.box, P(0, 1.72 + bob, 0.3), 0.16, 0.62, 0.05, suit, 0, 0, 0.6, inv);
      const ready = this.fireballCd <= 0;
      put(B.octa, P(0, 1.62 + bob, 0.32), 0.13, 0.2, 0.11, trim, 0, time * 1.5, 0,
        ready ? 0.9 + Math.sin(time * 5) * 0.25 : 0.12);
      put(B.box, P(0, 1.38 + bob, 0.24), 0.34, 0.14, 0.06, gold, 0, 0, 0, 0.1);
    }

    // ---- mantel som flödar bakåt när man springer och flaxar i dashen
    const cp = Math.min(0.24 + planar * 0.045 + dash * 0.5 + Math.sin(time * 2.3) * 0.04, 1.75);
    put(B.box, P(0, 1.92 - 0.48 * Math.cos(cp) + bob, -0.28 - 0.48 * Math.sin(cp)),
      0.56, 0.95, 0.05, cape, cp, 0, Math.sin(time * 1.7) * 0.05, 0.05);

    if (city) {
      // ---- thrusters på ryggen — glöder hårt i dashen och flygningen
      for (const s of [-1, 1]) {
        put(B.box, P(0.24 * s, 1.86 + bob, -0.3), 0.16, 0.3, 0.18, suit, 0.1, 0, 0, inv);
        put(B.octa, P(0.24 * s, 1.7 + bob, -0.34), 0.11, 0.16, 0.11, trim, 0, time * 4, 0,
          0.35 + (dash || this.thrusting ? 1.6 : 0));
      }
    } else {
      // ---- läderränsel på ryggen
      put(B.box, P(0, 1.78 + bob, -0.32), 0.42, 0.42, 0.2, suit, 0.05, 0, 0, inv);
      put(B.box, P(0, 1.9 + bob, -0.33), 0.44, 0.1, 0.22, gold, 0.05, 0, 0, 0);
    }

    // ---- axelskydd med guldrand
    for (const s of [-1, 1]) {
      put(B.sphere, P(0.55 * s, 2.02 + bob, 0), 0.44, 0.30, 0.44, plate, 0, 0, -0.15 * s, inv);
      put(B.box, P(0.55 * s, 2.13 + bob, 0), 0.3, 0.05, 0.3, gold, 0, 0, -0.15 * s, 0.3);
    }

    // ---- rustningssetet: syns direkt, och byter skepnad vart femte steg
    const arm = this.armor | 0;
    if (arm > 0) {
      const tier = Math.min(4, Math.floor(arm / 5));
      const raw = city ? [0.60, 0.66, 0.80] : [0.66, 0.60, 0.46];
      // ju tyngre rustning, desto blankare metall
      const shine = Math.min(0.35, arm * 0.02);
      const metal = F([raw[0] + shine, raw[1] + shine, raw[2] + shine]);
      const edge = city ? trim : gold;

      // förstärkta axelplåtar redan från första delen
      for (const s of [-1, 1]) {
        put(B.box, P(0.6 * s, 2.15 + bob, 0), 0.36, 0.11, 0.4, metal, 0, 0, -0.15 * s, 0.1);
      }
      if (tier >= 1) {
        // bröstharnesk med kant
        put(B.box, P(0, 1.8 + bob, 0.2 + lean * 0.18), 0.66, 0.5, 0.3, metal, lean, 0, 0, 0.08);
        put(B.box, P(0, 1.56 + bob, 0.3 + lean * 0.18), 0.5, 0.07, 0.1, edge, lean, 0, 0, 0.35);
      }
      if (tier >= 2) {
        // lårsköldar
        for (const s of [-1, 1]) {
          put(B.box, P(0.3 * s, 1.0 + bob, 0.12), 0.26, 0.42, 0.2, metal, 0.1, 0, 0.1 * s, 0.08);
        }
      }
      if (tier >= 3) {
        // ryggplåt och krage
        put(B.box, P(0, 1.9 + bob, -0.34), 0.62, 0.6, 0.14, metal, 0, 0, 0, 0.08);
        put(B.cyl, P(0, 2.1 + bob, 0), 0.3, 0.1, 0.3, metal, 0, 0, 0, 0.2);
      }
      if (tier >= 4) {
        // svävande plattor som kretsar kring bäraren
        for (let i = 0; i < 3; i++) {
          const a = time * 0.9 + i * (Math.PI * 2 / 3);
          put(B.box, [x + Math.cos(a) * 1.15, y + 1.7 + bob + Math.sin(time * 1.6 + i) * 0.12,
            z + Math.sin(a) * 1.15], 0.08, 0.3, 0.18, edge, 0, a, 0, 0.5);
        }
      }
    }

    // ---- hals + huvud
    put(B.cyl, P(0, 2.06 + bob, 0), 0.18, 0.14, 0.18, suit, 0, 0, 0, inv);
    if (city) {
      // hjälm med visir, ögonbrynsrand och kam
      put(B.sphere, P(0, 2.3 + bob, 0.02 + lean * 0.08), 0.5, 0.54, 0.5, plate, lean * 0.5, 0, 0, inv);
      put(B.box, P(0, 2.31 + bob, 0.25), 0.4, 0.13, 0.12, trim, 0, 0, 0, 1.1);
      put(B.box, P(0, 2.43 + bob, 0.22), 0.44, 0.05, 0.08, gold, 0, 0, 0, 0.25);
      put(B.box, P(0, 2.56 + bob, -0.04), 0.06, 0.2, 0.42, accent, -0.1, 0, 0, 0.3);
    } else {
      // bart ansikte under läderhuva
      put(B.sphere, P(0, 2.28 + bob, 0.02 + lean * 0.08), 0.46, 0.5, 0.46,
        [lerp(0.83, 1, f), lerp(0.62, 0.4, f), lerp(0.46, 0.35, f)], lean * 0.5, 0, 0, inv);
      put(B.cone, P(0, 2.52 + bob, -0.08), 0.64, 0.56, 0.64, suit, -0.3, 0, 0, inv);
      put(B.box, P(0, 2.4 + bob, 0.18), 0.5, 0.09, 0.28, suit, -0.35, 0, 0, inv);
    }

    const armSwing = swing * 0.7;
    if (city) {
      // ---- cyborgen: båda armarna sträckta framåt, laser ur handflatorna
      const charge = this.fireTimer > 0 ? 1 : 0.3;
      for (const s of [-1, 1]) {
        put(B.box, P(0.5 * s, 1.9 + bob, 0.12), 0.19, 0.34, 0.19, suit, 0.5, 0, -0.1 * s, inv);
        put(B.box, P(0.48 * s, 1.62 + bob, 0.38), 0.22, 0.24, 0.5, plate, 0, 0, 0, inv);
        put(B.sphere, P(0.48 * s, 1.6 + bob, 0.68), 0.17, 0.17, 0.17, trim, 0, 0, 0,
          0.5 + charge * (s === this.shotSide ? 1.3 : 0.5));
      }
    } else {
      // ---- vänsterarm i två segment med handskydd
      const shY = 1.95 + bob, shX = -0.55;
      const elbY = shY - 0.36 * Math.cos(armSwing), elbZ = 0.36 * Math.sin(armSwing);
      put(B.box, P(shX, shY - 0.18 * Math.cos(armSwing), 0.18 * Math.sin(armSwing)),
        0.19, 0.4, 0.19, suit, -armSwing, 0, 0.1, inv);
      const foreSw = armSwing * 0.8 - 0.35;
      put(B.box, P(shX, elbY - 0.2 * Math.cos(foreSw), elbZ + 0.2 * Math.sin(foreSw)),
        0.23, 0.42, 0.23, plate, -foreSw, 0, 0.1, inv);
      put(B.box, P(shX, elbY - 0.42 * Math.cos(foreSw), elbZ + 0.42 * Math.sin(foreSw)),
        0.2, 0.16, 0.2, suit, -foreSw, 0, 0, inv);
      // ---- högerarm hålls fram mot vapnet, med pansrad underarm
      put(B.box, P(0.5, 1.9 + bob, 0.12), 0.19, 0.34, 0.19, suit, 0.5, 0, -0.1, inv);
      put(B.box, P(0.48, 1.62 + bob, 0.38), 0.22, 0.24, 0.5, plate, 0, 0, 0, inv);

      // ---- svärdet i höger hand: vilar över axeln, sveper i attacken
      const grip = P(0.52, 1.48 + bob, 0.3);
      let sYaw, up;
      if (this.swingTime > 0) {
        const t = 1 - this.swingTime / this.swingDur;
        const ease = t * t * (3 - 2 * t);
        if (this.swingFinisher) {
          // finisher: rakt överhandshugg uppifrån och ner
          sYaw = yaw;
          up = lerp(0.95, -0.5, ease);
        } else {
          sYaw = yaw + lerp(-1.7, 1.7, ease) * this.swingSide;
          up = 0.12;
        }
      } else {
        sYaw = yaw + 0.35;
        up = 0.82;
      }
      const horiz = Math.sqrt(1 - up * up);
      const bd = { x: Math.sin(sYaw) * horiz, y: up, z: Math.cos(sYaw) * horiz };
      const rxB = -Math.asin(up);
      // klinga, parerstång, grepp och knopp
      const hot = this.swingTime > 0 && this.swingFinisher;
      B.box.push(grip[0] + bd.x * 0.95, grip[1] + bd.y * 0.95, grip[2] + bd.z * 0.95,
        0.11, 0.045, 1.5, hot ? [1.0, 0.42, 0.10] : [0.75, 0.78, 0.85],
        rxB, sYaw, 0, hot ? 0.55 : this.swingTime > 0 ? 0.35 : 0.06);
      B.box.push(grip[0] + bd.x * 0.14, grip[1] + bd.y * 0.14, grip[2] + bd.z * 0.14,
        0.4, 0.09, 0.1, gold, rxB, sYaw, 0, 0.1);
      B.box.push(grip[0] - bd.x * 0.08, grip[1] - bd.y * 0.08, grip[2] - bd.z * 0.08,
        0.08, 0.08, 0.3, suit, rxB, sYaw, 0, 0);
      B.octa.push(grip[0] - bd.x * 0.28, grip[1] - bd.y * 0.28, grip[2] - bd.z * 0.28,
        0.1, 0.13, 0.1, gold, 0, time * 2, 0, 0.15);
    }

    // Följeslagarna från uppgraderingen: maskindrönare i staden, féer i
    // Vildheim. Samma tjänst, helt olika varelse.
    for (let i = 0; i < this.stats.drones; i++) {
      const a = this.droneAngle + (i / this.stats.drones) * TAU;
      const dx = Math.cos(a) * 2.1, dz = Math.sin(a) * 2.1;
      const dy = y + 2.4 + Math.sin(time * 2 + i) * 0.18;
      if (city) {
        B.octa.push(x + dx, dy, z + dz, 0.42, 0.55, 0.42, [1.0, 0.75, 0.25], 0, a * 2, 0, 0.85);
      } else {
        // fé: en glödande kärna med två fladdrande vingar och ett stoftspår
        const flap = Math.sin(time * 18 + i * 2) * 0.5;
        B.sphere.push(x + dx, dy, z + dz, 0.22, 0.26, 0.22, [1.0, 0.88, 0.45], 0, 0, 0, 1.0);
        for (const s of [-1, 1]) {
          B.octa.push(x + dx, dy + 0.22, z + dz, 0.07, 0.34, 0.20,
            [0.55, 1.0, 0.85], 0, a * 2, s * (0.7 + flap), 0.6);
        }
        if (Math.random() < 0.5) {
          rend.particles.spawn({
            x: x + dx, y: dy - 0.1, z: z + dz,
            vx: rand(-0.3, 0.3), vy: rand(-0.8, -0.2), vz: rand(-0.3, 0.3),
            life: rand(0.3, 0.7), size: rand(0.08, 0.18), size2: 0,
            col: [0.75, 1.0, 0.8], alpha: 0.8, drag: 0.3,
          });
        }
      }
    }

    /*
     * Pareringsskölden: en lysande skiva framför krigaren medan fönstret är
     * öppet, som blossar upp vitt när något faktiskt slås tillbaka. Den ska
     * synas tydligt — hela poängen är att man ser att tajmingen tog.
     */
    if (this.parryTime > 0 || this.parryFlash > 0) {
      const t = Math.max(this.parryTime / 0.28, this.parryFlash);
      const hit = this.parryFlash;
      const col = [lerp(0.55, 1.0, hit), lerp(0.85, 0.97, hit), lerp(1.0, 0.7, hit)];
      const r = (1.5 + hit * 1.1) * (0.7 + t * 0.4);
      put(B.cyl, P(0, 1.35, 1.0), r, 0.1, r, col, Math.PI / 2, 0, 0, 0.8 + hit * 1.6);
      for (let i = 0; i < 5; i++) {
        const a = time * 5 + i * (TAU / 5);
        put(B.octa, P(Math.cos(a) * r * 0.8, 1.35 + Math.sin(a) * r * 0.8, 1.05),
          0.12, 0.3, 0.12, col, 0, a, 0, 1.0 + hit);
      }
    }

    rend.shadow(x, terrainHeight(x, z), z, 1.0 + (this.pos.y - terrainHeight(x, z)) * 0.05,
      0.42 * Math.max(0, 1 - (this.pos.y - terrainHeight(x, z)) * 0.09));
  }
}
