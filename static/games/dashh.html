/** Slumpar n unika kort som spelaren inte redan maxat. */
function rollChoices(levels, n = 3) {
  const pool = UPGRADES.filter((u) => (levels.get(u.id) || 0) < u.max);
  const out = [];
  while (out.length < n && pool.length) {
    const i = (Math.random() * pool.length) | 0;
    out.push(pool[i]);
    pool.splice(i, 1);
  }
  return out;
}

// ═══ player.js ═══
// Spelarkaraktären: rörelse, hopp, dash, kamerarigg och den ritade figuren.


const GRAVITY = -34;
const EYE = 1.35;

function rotY(x, z, a) {
  const c = Math.cos(a), s = Math.sin(a);
  return [c * x + s * z, -s * x + c * z];
}

function defaultStats() {
  return {
    maxHp: 100,
    speed: 9.4,
    damage: 13,
    fireRate: 4.2,        // skott per sekund
    projSpeed: 66,
    projSize: 0.34,
    multishot: 1,
    spread: 0.035,
    pierce: 0,
    crit: 0.05,
    critMult: 2.0,
    explosive: 0,         // radie, 0 = av
    lifesteal: 0,
    regen: 0,
    pickupRadius: 4.5,
    dashMax: 2,
    dashRecharge: 2.4,
    jumps: 1,
    xpMult: 1,
    drones: 0,
  };
}

class Player {
  constructor(world) {
    this.world = world;
    this.reset();
  }

  reset() {
    this.stats = defaultStats();
    this.pos = { x: 0, y: terrainHeight(0, 0) + 2, z: 0 };
    this.vel = { x: 0, y: 0, z: 0 };
    this.hp = this.stats.maxHp;
    this.yaw = 0;
    this.camYaw = 0;
    this.camPitch = -0.18;
    this.camDist = 8.5;
    this.camDistNow = 8.5;
    this.camPos = { x: 0, y: 6, z: 10 };
    this.fov = 1.15;
    this.fovNow = 1.15;
    this.grounded = false;
    this.jumpsLeft = 1;
    this.dashCharges = this.stats.dashMax;
    this.dashTimer = 0;      // återladdning
    this.dashTime = 0;       // aktiv dash
    this.dashDir = { x: 0, z: 1 };
    this.invuln = 0;
    this.fireTimer = 0;
    this.walkPhase = 0;
    this.hitFlash = 0;
    this.radius = 0.55;
    this.inWater = false;
    this.aim = { x: 0, y: 0, z: 1 };
    this.aimYaw = 0;
    this.droneAngle = 0;
    this.droneTimer = 0;
    this.alive = true;
    this.shake = 0;
    this.shotSide = 1;       // Neotropolis: lasern alternerar mellan händerna
    this.thrusting = false;
    this.swingTime = 0;      // Vildheim: pågående svärdssving
    this.swingDur = 0.26;
    this.swingSide = 1;
    this.swingFinisher = false;
    this.combo = -1;         // 0,1,2 — det tredje hugget är en finisher
    this.comboTimer = 0;
    this.fireballCdMax = 10;
    this.fireballCd = 0;
  }

  get camForward() {
    const cp = Math.cos(this.camPitch);
    return { x: Math.sin(this.camYaw) * cp, y: Math.sin(this.camPitch), z: Math.cos(this.camYaw) * cp };
  }

  look(dx, dy, sens) {
    this.camYaw -= dx * sens;
    this.camPitch = clamp(this.camPitch - dy * sens, -1.15, 0.75);
    if (this.camYaw > Math.PI) this.camYaw -= TAU;
    if (this.camYaw < -Math.PI) this.camYaw += TAU;
  }

  zoom(delta) {
    this.camDist = clamp(this.camDist + delta * 0.006, 4.2, 16);
  }

  /**
   * Styrning utan pointer lock. Mitten av skärmen är en stor fri zon där du
   * siktar med korshåret utan att kameran rör sig; först när pekaren närmar
   * sig kanterna börjar vyn svepa — mjukt och likadant i båda led.
   */
  steer(input, dt) {
    const dead = 0.42;
    const ramp = (v) => {
      const m = Math.abs(v);
      if (m <= dead) return 0;
      const t = clamp((m - dead) / (1 - dead), 0, 1);
      return (v < 0 ? -1 : 1) * t * t * (3 - 2 * t);
    };
    this.camYaw -= ramp(input.cursorNX) * 3.1 * dt;
    if (this.camYaw > Math.PI) this.camYaw -= TAU;
    if (this.camYaw < -Math.PI) this.camYaw += TAU;
    this.camPitch = clamp(this.camPitch - ramp(input.cursorNY) * 1.5 * dt, -1.15, 0.75);
  }

  /**
   * Riktningen från kameran genom muspekaren — korshåret sitter där pekaren är.
   * Utgår från kamerans faktiska blickriktning (inte den ideala vinkeln), så
   * axelförskjutningen och markklampen inte gör siktet skevt.
   */
  cursorRay() {
    const inp = this.world.input;
    const eye = this.camPos, tgt = this.camTarget || this.pos;
    let fx = tgt.x - eye.x, fy = tgt.y - eye.y, fz = tgt.z - eye.z;
    const fl = Math.hypot(fx, fy, fz) || 1;
    fx /= fl; fy /= fl; fz /= fl;
    // muslås och touch siktar båda rakt fram genom skärmens mitt
    if (!inp || inp.locked || inp.touch) return { x: fx, y: fy, z: fz };

    // kamerans egna höger- och uppvektor
    let rx = -fz, rz = fx;
    const rl = Math.hypot(rx, rz) || 1;
    rx /= rl; rz /= rl;
    const ux = -rz * fy, uy = rz * fx - rx * fz, uz = rx * fy;

    const rend = this.world.renderer;
    const aspect = rend && rend.height ? rend.width / rend.height : 1.6;
    const tan = Math.tan(this.fovNow / 2);
    const ax = inp.cursorNX * tan * aspect;
    const ay = -inp.cursorNY * tan;
    const dx = fx + rx * ax + ux * ay;
    const dy = fy + uy * ay;
    const dz = fz + rz * ax + uz * ay;
    const l = Math.hypot(dx, dy, dz) || 1;
    return { x: dx / l, y: dy / l, z: dz / l };
  }

  takeDamage(n) {
    if (this.invuln > 0 || !this.alive) return false;
    this.hp -= n;
    this.invuln = 0.55;
    this.hitFlash = 1;
    this.shake = Math.min(1.2, this.shake + 0.35 + n * 0.012);
    if (this.hp <= 0) { this.hp = 0; this.alive = false; }
    return true;
  }

  heal(n) {
    this.hp = Math.min(this.stats.maxHp, this.hp + n);
  }

  tryDash(input) {
    if (this.dashCharges <= 0 || this.dashTime > 0) return false;
    const ax = input.moveAxis();
    let dx, dz;
    if (ax.x || ax.y) {
      const f = { x: Math.sin(this.camYaw), z: Math.cos(this.camYaw) };
      const r = { x: -Math.cos(this.camYaw), z: Math.sin(this.camYaw) };
      dx = f.x * ax.y + r.x * ax.x;
      dz = f.z * ax.y + r.z * ax.x;
    } else {
      dx = Math.sin(this.yaw); dz = Math.cos(this.yaw);
    }
    const l = Math.hypot(dx, dz) || 1;
    this.dashDir.x = dx / l; this.dashDir.z = dz / l;
    this.dashCharges--;
    this.dashTime = 0.18;
    this.invuln = Math.max(this.invuln, 0.30);
    this.vel.x = this.dashDir.x * 40;
    this.vel.z = this.dashDir.z * 40;
    if (!this.grounded) this.vel.y = Math.max(this.vel.y, 1.5);
    return true;
  }

  update(dt, input, snap) {
    const st = this.stats;
    const w = this.world;

    // ---- kamera-look
    if (input.enabled) {
      if (input.touch) this.look(input.mouseDX, input.mouseDY, input.touchSensitivity);
      else if (input.locked) this.look(input.mouseDX, input.mouseDY, input.sensitivity);
      else this.steer(input, dt);
    }
    if (input.wheel) this.zoom(input.wheel);

    // ---- rörelse
    const ax = input.moveAxis();
    const f = { x: Math.sin(this.camYaw), z: Math.cos(this.camYaw) };
    const r = { x: -Math.cos(this.camYaw), z: Math.sin(this.camYaw) };
    let wishX = f.x * ax.y + r.x * ax.x;
    let wishZ = f.z * ax.y + r.z * ax.x;
    const wishLen = Math.hypot(wishX, wishZ);
    if (wishLen > 0.001) { wishX /= wishLen; wishZ /= wishLen; }

    const speed = st.speed * (this.inWater ? 0.62 : 1);
    const accel = (this.grounded ? 74 : 26) * dt;
    if (this.dashTime <= 0) {
      const tx = wishX * speed * wishLen, tz = wishZ * speed * wishLen;
      this.vel.x += clamp(tx - this.vel.x, -accel, accel);
      this.vel.z += clamp(tz - this.vel.z, -accel, accel);
      if (this.grounded && wishLen < 0.01) {
        const fr = Math.exp(-9 * dt);
        this.vel.x *= fr; this.vel.z *= fr;
      }
    } else {
      this.dashTime -= dt;
      const fade = Math.exp(-4 * dt);
      this.vel.x *= fade; this.vel.z *= fade;
      w.particles.spawn({
        x: this.pos.x, y: this.pos.y + 0.9 + rand(-0.4, 0.4), z: this.pos.z,
        vx: rand(-1.5, 1.5), vy: rand(0, 2), vz: rand(-1.5, 1.5),
        life: rand(0.25, 0.5), size: rand(0.35, 0.75), size2: 0,
        col: [0.35, 0.95, 1.0], alpha: 0.9, drag: 0.5,
      });
    }

    // ---- hopp / flygning / dash
    const canFly = w.worldId === 'city';
    this.thrusting = false;
    if (canFly && input.down('Space')) {
      // cyborg-thrusters: håll mellanslag för att lyfta och flyga
      this.vel.y = Math.min(this.vel.y + 58 * dt, 11);
      if (this.pos.y > 58) this.vel.y = Math.min(this.vel.y, 0);   // mjukt höjdtak
      this.grounded = false;
      this.thrusting = true;
      if (Math.random() < 0.65) {
        w.particles.spawn({
          x: this.pos.x + rand(-0.25, 0.25), y: this.pos.y + 0.3, z: this.pos.z + rand(-0.25, 0.25),
          vx: rand(-1, 1), vy: rand(-7, -4), vz: rand(-1, 1),
          life: rand(0.25, 0.45), size: rand(0.3, 0.55), size2: 0,
          col: [1.0, 0.45, 0.6], alpha: 0.85, drag: 0.3,
        });
      }
    } else if (input.pressed('Space')) {
      if (this.grounded || this.jumpsLeft > 0) {
        if (!this.grounded) this.jumpsLeft--;
        this.vel.y = 13.2;
        this.grounded = false;
        w.sound.jump();
        w.particles.burst(this.pos.x, this.pos.y + 0.1, this.pos.z, 6,
          { speed: 3, life: 0.35, size: 0.5, col: [0.6, 0.8, 0.9], alpha: 0.5, grav: -6, drag: 0.4 });
      }
    }
    if ((input.pressed('ShiftLeft') || input.pressed('ShiftRight') || input.pressed('KeyE')) && this.tryDash(input)) {
      w.sound.dash();
      w.particles.burst(this.pos.x, this.pos.y + 0.9, this.pos.z, 18,
        { speed: 9, life: 0.4, size: 0.7, col: [0.3, 0.9, 1.0], alpha: 0.8, drag: 0.6 });
    }

    // ---- gravitation och mark (i staden glidflyger cyborgen)
    const gravF = this.dashTime > 0 ? 0.25 : this.thrusting ? 0 : canFly && !this.grounded ? 0.4 : 1;
    this.vel.y += GRAVITY * dt * gravF;
    if (canFly && this.vel.y < -13) this.vel.y = -13;
    this.pos.x += this.vel.x * dt;
    this.pos.y += this.vel.y * dt;
    this.pos.z += this.vel.z * dt;

    clampToArena(this.pos);
    if (w.colliders.resolve(this.pos, this.radius)) {
      // glid längs hindret istället för att fastna
      this.vel.x *= 0.85; this.vel.z *= 0.85;
    }

    const gh = terrainHeight(this.pos.x, this.pos.z);
    const wasAir = !this.grounded;
    if (this.pos.y <= gh) {
      if (wasAir && this.vel.y < -12) {
        w.sound.land();
        w.particles.burst(this.pos.x, gh + 0.1, this.pos.z, 8,
          { speed: 4, life: 0.3, size: 0.5, col: [0.75, 0.72, 0.6], alpha: 0.55, grav: -10, drag: 0.5 });
      }
      this.pos.y = gh;
      this.vel.y = 0;
      this.grounded = true;
      this.jumpsLeft = st.jumps;
    } else {
      this.grounded = false;
    }

    const wasWater = this.inWater;
    this.inWater = this.pos.y < WATER_LEVEL + 0.15;
    if (this.inWater && !wasWater) {
      w.particles.burst(this.pos.x, WATER_LEVEL + 0.2, this.pos.z, 14,
        { speed: 5, life: 0.5, size: 0.55, col: [0.45, 0.8, 0.95], alpha: 0.75, grav: -14, drag: 0.4 });
    }

    // ---- riktning och timers: gubben vänder sig dit korshåret pekar
    const turnRate = (wishLen > 0.02 || input.fireDown) ? 22 : 15;
    const face = this.aimYaw === undefined ? this.camYaw : this.aimYaw;
    this.yaw += angleDelta(this.yaw, face) * Math.min(1, dt * turnRate);
    const planar = Math.hypot(this.vel.x, this.vel.z);
    this.walkPhase += dt * (this.grounded ? planar * 1.15 : 3);

    this.invuln = Math.max(0, this.invuln - dt);
    this.hitFlash = Math.max(0, this.hitFlash - dt * 3);
    this.fireTimer = Math.max(0, this.fireTimer - dt);
    this.swingTime = Math.max(0, this.swingTime - dt);
    this.comboTimer = Math.max(0, this.comboTimer - dt);
    this.fireballCd = Math.max(0, this.fireballCd - dt);
    this.shake = Math.max(0, this.shake - dt * 2.4);
    if (this.dashCharges < st.dashMax) {
      this.dashTimer += dt;
      if (this.dashTimer >= st.dashRecharge) { this.dashTimer = 0; this.dashCharges++; }
    } else this.dashTimer = 0;
    if (st.regen > 0 && this.hp < st.maxHp) this.heal(st.regen * dt);
    this.droneAngle += dt * 1.6;
    this.droneTimer -= dt;

    // ---- kamera
    this.updateCamera(dt, planar);
  }

  updateCamera(dt, planar) {
    // axelkamera: fokus ligger något åt skärm-höger så figuren inte skymmer siktet
    const rx = -Math.cos(this.camYaw), rz = Math.sin(this.camYaw);
    const focus = {
      x: this.pos.x + rx * 0.8,
      y: this.pos.y + EYE + 0.25,
      z: this.pos.z + rz * 0.8,
    };
    const dir = this.camForward;
    const want = this.camDist;
    // dra in kameran om terrängen är i vägen
    let allowed = want;
    for (let i = 1; i <= 8; i++) {
      const t = (i / 8) * want;
      const px = focus.x - dir.x * t, py = focus.y - dir.y * t, pz = focus.z - dir.z * t;
      if (py < terrainHeight(px, pz) + 0.7) { allowed = Math.max(1.8, t - 0.5); break; }
    }
    // snabb men inte hackig indragning när något skymmer, mjuk utfällning
    this.camDistNow = damp(this.camDistNow, allowed, allowed < this.camDistNow ? 0.0001 : 0.02, dt);

    const tx = focus.x - dir.x * this.camDistNow;
    const ty = focus.y - dir.y * this.camDistNow + 0.35;
    const tz = focus.z - dir.z * this.camDistNow;
    this.camPos.x = damp(this.camPos.x, tx, 0.0008, dt);
    this.camPos.y = damp(this.camPos.y, ty, 0.0008, dt);
    this.camPos.z = damp(this.camPos.z, tz, 0.0008, dt);
    const minY = terrainHeight(this.camPos.x, this.camPos.z) + 0.6;
    if (this.camPos.y < minY) this.camPos.y = minY;

    const wantFov = 1.15 + smoothstep(6, 22, planar) * 0.13 + (this.dashTime > 0 ? 0.14 : 0);
    this.fovNow = damp(this.fovNow, wantFov, 0.002, dt);
    this.camTarget = focus;
  }

  /** Kameran som renderaren vill ha den, inklusive skärmskak. */
  camera(time) {
    const s = this.shake * this.shake;
    const jx = Math.sin(time * 47) * s * 0.35, jy = Math.cos(time * 41) * s * 0.35;
    return {
      pos: { x: this.camPos.x + jx, y: this.camPos.y + jy, z: this.camPos.z },
      target: { x: this.camTarget.x + jx * 0.5, y: this.camTarget.y + jy * 0.5, z: this.camTarget.z },
      fov: this.fovNow,
    };
  }

  /** Siktriktning från kameran, med lätt målhjälp. */
  aimDir(enemies) {
    const cf = this.cursorRay();
    const origin = { x: this.camPos.x, y: this.camPos.y, z: this.camPos.z };
    const far = { x: origin.x + cf.x * 70, y: origin.y + cf.y * 70, z: origin.z + cf.z * 70 };
    const muzzle = this.muzzle();
    let dx = far.x - muzzle.x, dy = far.y - muzzle.y, dz = far.z - muzzle.z;
    let l = Math.hypot(dx, dy, dz) || 1;
    dx /= l; dy /= l; dz /= l;

    // mild sikthjälp mot närmaste fiende inom en smal kon. I Neotropolis flyger
    // fienderna — striden är 3D — så konen är bredare där, och med tummen som
    // sikte behövs mer hjälp än med mus.
    const inp2 = this.world.input;
    let bestDot = this.world.worldId === 'city' ? 0.955 : 0.978;
    if (inp2 && inp2.touch) bestDot -= 0.03;
    let best = null;
    for (const e of enemies) {
      if (!e.alive) continue;
      let ex = e.pos.x - muzzle.x, ey = e.pos.y + e.height * 0.5 - muzzle.y, ez = e.pos.z - muzzle.z;
      const d = Math.hypot(ex, ey, ez);
      if (d > 55 || d < 0.001) continue;
      ex /= d; ey /= d; ez /= d;
      const dot = ex * dx + ey * dy + ez * dz;
      if (dot > bestDot) { bestDot = dot; best = { x: ex, y: ey, z: ez }; }
    }
    if (best) {
      dx = lerp(dx, best.x, 0.65); dy = lerp(dy, best.y, 0.65); dz = lerp(dz, best.z, 0.65);
      l = Math.hypot(dx, dy, dz) || 1;
      dx /= l; dy /= l; dz /= l;
    }
    this.aim.x = dx; this.aim.y = dy; this.aim.z = dz;
    this.aimYaw = Math.atan2(dx, dz);   // gubben vänder sig hit
    return this.aim;
  }

  muzzle() {
    if (this.world.worldId === 'city') {
      // lasern skjuts ur handflatorna, växelvis vänster/höger
      const [ox, oz] = rotY(0.48 * this.shotSide, 0.7, this.yaw);
      return { x: this.pos.x + ox, y: this.pos.y + 1.6, z: this.pos.z + oz };
    }
    const [ox, oz] = rotY(0.42, 0.75, this.yaw);
    return { x: this.pos.x + ox, y: this.pos.y + 1.25, z: this.pos.z + oz };
  }

  /** Ritar figuren i renderarens batchar. */
  draw(rend, time) {
    const B = rend.dyn;
    const f = this.hitFlash;
    const city = this.world.worldId === 'city';
    // Vildheim: vildmarkskrigare i läder med brons och bärnstensmagi.
    // Neotropolis: gunmetal-cyborg med magenta energi och iskalla detaljer.
    const base = city ? {
      plate: [0.16, 0.16, 0.21], suit: [0.06, 0.07, 0.10], accent: [0.85, 0.20, 0.45],
      trim: [1.0, 0.30, 0.55], gold: [0.55, 0.95, 1.0], cape: [0.20, 0.03, 0.12],
    } : {
      plate: [0.40, 0.26, 0.14], suit: [0.19, 0.12, 0.07], accent: [0.30, 0.34, 0.18],
      trim: [1.0, 0.62, 0.22], gold: [0.72, 0.52, 0.24], cape: [0.11, 0.22, 0.12],
    };
    const F = (c0) => [lerp(c0[0], 1.0, f), lerp(c0[1], 0.35, f), lerp(c0[2], 0.4, f)];
    const plate = F(base.plate), suit = F(base.suit), accent = F(base.accent), cape = F(base.cape);
    const trim = base.trim, gold = base.gold;

    const y = this.pos.y, x = this.pos.x, z = this.pos.z, yaw = this.yaw;
    const csY = Math.cos(yaw), snY = Math.sin(yaw);
    const P = (lx, ly, lz) => [x + csY * lx + snY * lz, y + ly, z - snY * lx + csY * lz];
    const put = (batch, p, sx, sy, sz, col, rx = 0, ryOff = 0, rz = 0, g = 0) =>
      batch.push(p[0], p[1], p[2], sx, sy, sz, col, rx, yaw + ryOff, rz, g);

    const inv = this.invuln > 0 ? 0.3 + Math.sin(time * 30) * 0.15 : 0;
    const dash = this.dashTime > 0 ? 1 : 0;
    const planar = Math.hypot(this.vel.x, this.vel.z);
    const moving = this.grounded && planar > 0.6;
    const air = this.grounded ? 0 : 1;
    const amp = this.grounded ? clamp(planar * 0.10, 0, 0.9) : 0.3;
    const swing = Math.sin(this.walkPhase) * amp;
    const bob = moving ? Math.abs(Math.sin(this.walkPhase)) * 0.07 : 0;
    const breathe = 1 + Math.sin(time * 2.1) * 0.012;
    const lean = clamp(planar * 0.011, 0, 0.18) + dash * 0.3;

    // ---- ben i två segment: lårplåt, benskena, knäskydd och känga
    for (const s of [-1, 1]) {
      const ph = this.walkPhase + (s > 0 ? 0 : Math.PI);
      const sw = (moving || air ? Math.sin(ph) * amp : 0) + air * 0.3;
      const lift = (moving ? Math.max(0, -Math.cos(ph)) * 0.5 : 0) + air * 0.45;
      const hipY = 1.08 + bob, hx = 0.27 * s;
      const kneeY = hipY - 0.5 * Math.cos(sw), kneeZ = -0.5 * Math.sin(sw);
      const shinSw = sw + lift;
      const footY = kneeY - 0.48 * Math.cos(shinSw), footZ = kneeZ - 0.48 * Math.sin(shinSw);
      put(B.box, P(hx, hipY - 0.25 * Math.cos(sw), -0.25 * Math.sin(sw)),
        0.30, 0.52, 0.34, plate, sw, 0, 0, inv);
      put(B.sphere, P(hx, kneeY, kneeZ), 0.24, 0.2, 0.24, accent, sw, 0, 0, city ? 0.25 : 0);
      put(B.box, P(hx, kneeY - 0.24 * Math.cos(shinSw), kneeZ - 0.24 * Math.sin(shinSw)),
        0.24, 0.5, 0.27, suit, shinSw, 0, 0, inv);
      put(B.box, P(hx, footY + 0.07, footZ + 0.09), 0.28, 0.16, 0.44, plate, shinSw * 0.3, 0, 0, inv);
    }

    // ---- höftparti med sidoplåtar
    put(B.box, P(0, 1.16 + bob, 0), 0.74, 0.3, 0.48, plate, 0, 0, 0, inv);
    for (const s of [-1, 1]) put(B.box, P(0.42 * s, 1.04 + bob, 0), 0.14, 0.4, 0.4, plate, 0, 0, 0.12 * s, inv);
    put(B.box, P(0, 1.14 + bob, 0.26), 0.2, 0.14, 0.06, gold, 0, 0, 0, 0.3);

    // ---- bål: underdräkt och väst som andas
    put(B.box, P(0, 1.56 + bob, lean * 0.1), 0.6, 0.76, 0.42, suit, lean, 0, 0, inv);
    put(B.box, P(0, 1.76 + bob, 0.08 + lean * 0.18), 0.8 * breathe, 0.56, 0.5, plate, lean, 0, 0, inv);
    if (city) {
      // glödande energikärna + magdetalj
      put(B.octa, P(0, 1.78 + bob, 0.3 + lean * 0.2), 0.24, 0.34, 0.2, trim, 0, time * 1.5, 0, 1.0);
      put(B.box, P(0, 1.38 + bob, 0.24), 0.3, 0.24, 0.06, accent, 0, 0, 0, 0.25);
    } else {
      // axelrem tvärs över västen + bärnstensamulett som glöder när eldbollen är redo
      put(B.box, P(0, 1.72 + bob, 0.3), 0.16, 0.62, 0.05, suit, 0, 0, 0.6, inv);
      const ready = this.fireballCd <= 0;
      put(B.octa, P(0, 1.62 + bob, 0.32), 0.13, 0.2, 0.11, trim, 0, time * 1.5, 0,
        ready ? 0.9 + Math.sin(time * 5) * 0.25 : 0.12);
      put(B.box, P(0, 1.38 + bob, 0.24), 0.34, 0.14, 0.06, gold, 0, 0, 0, 0.1);
    }

    // ---- mantel som flödar bakåt när man springer och flaxar i dashen
    const cp = Math.min(0.24 + planar * 0.045 + dash * 0.5 + Math.sin(time * 2.3) * 0.04, 1.75);
    put(B.box, P(0, 1.92 - 0.48 * Math.cos(cp) + bob, -0.28 - 0.48 * Math.sin(cp)),
      0.56, 0.95, 0.05, cape, cp, 0, Math.sin(time * 1.7) * 0.05, 0.05);

    if (city) {
      // ---- thrusters på ryggen — glöder hårt i dashen och flygningen
      for (const s of [-1, 1]) {
        put(B.box, P(0.24 * s, 1.86 + bob, -0.3), 0.16, 0.3, 0.18, suit, 0.1, 0, 0, inv);
        put(B.octa, P(0.24 * s, 1.7 + bob, -0.34), 0.11, 0.16, 0.11, trim, 0, time * 4, 0,
          0.35 + (dash || this.thrusting ? 1.6 : 0));
      }
    } else {
      // ---- läderränsel på ryggen
      put(B.box, P(0, 1.78 + bob, -0.32), 0.42, 0.42, 0.2, suit, 0.05, 0, 0, inv);
      put(B.box, P(0, 1.9 + bob, -0.33), 0.44, 0.1, 0.22, gold, 0.05, 0, 0, 0);
    }

    // ---- axelskydd med guldrand
    for (const s of [-1, 1]) {
      put(B.sphere, P(0.55 * s, 2.02 + bob, 0), 0.44, 0.30, 0.44, plate, 0, 0, -0.15 * s, inv);
      put(B.box, P(0.55 * s, 2.13 + bob, 0), 0.3, 0.05, 0.3, gold, 0, 0, -0.15 * s, 0.3);
    }

    // ---- hals + huvud
    put(B.cyl, P(0, 2.06 + bob, 0), 0.18, 0.14, 0.18, suit, 0, 0, 0, inv);
    if (city) {
      // hjälm med visir, ögonbrynsrand och kam
      put(B.sphere, P(0, 2.3 + bob, 0.02 + lean * 0.08), 0.5, 0.54, 0.5, plate, lean * 0.5, 0, 0, inv);
      put(B.box, P(0, 2.31 + bob, 0.25), 0.4, 0.13, 0.12, trim, 0, 0, 0, 1.1);
      put(B.box, P(0, 2.43 + bob, 0.22), 0.44, 0.05, 0.08, gold, 0, 0, 0, 0.25);
      put(B.box, P(0, 2.56 + bob, -0.04), 0.06, 0.2, 0.42, accent, -0.1, 0, 0, 0.3);
    } else {
      // bart ansikte under läderhuva
      put(B.sphere, P(0, 2.28 + bob, 0.02 + lean * 0.08), 0.46, 0.5, 0.46,
        [lerp(0.83, 1, f), lerp(0.62, 0.4, f), lerp(0.46, 0.35, f)], lean * 0.5, 0, 0, inv);
      put(B.cone, P(0, 2.52 + bob, -0.08), 0.64, 0.56, 0.64, suit, -0.3, 0, 0, inv);
      put(B.box, P(0, 2.4 + bob, 0.18), 0.5, 0.09, 0.28, suit, -0.35, 0, 0, inv);
    }

    const armSwing = swing * 0.7;
    if (city) {
      // ---- cyborgen: båda armarna sträckta framåt, laser ur handflatorna
      const charge = this.fireTimer > 0 ? 1 : 0.3;
      for (const s of [-1, 1]) {
        put(B.box, P(0.5 * s, 1.9 + bob, 0.12), 0.19, 0.34, 0.19, suit, 0.5, 0, -0.1 * s, inv);
        put(B.box, P(0.48 * s, 1.62 + bob, 0.38), 0.22, 0.24, 0.5, plate, 0, 0, 0, inv);
        put(B.sphere, P(0.48 * s, 1.6 + bob, 0.68), 0.17, 0.17, 0.17, trim, 0, 0, 0,
          0.5 + charge * (s === this.shotSide ? 1.3 : 0.5));
      }
    } else {
      // ---- vänsterarm i två segment med handskydd
      const shY = 1.95 + bob, shX = -0.55;
      const elbY = shY - 0.36 * Math.cos(armSwing), elbZ = 0.36 * Math.sin(armSwing);
      put(B.box, P(shX, shY - 0.18 * Math.cos(armSwing), 0.18 * Math.sin(armSwing)),
        0.19, 0.4, 0.19, suit, -armSwing, 0, 0.1, inv);
      const foreSw = armSwing * 0.8 - 0.35;
      put(B.box, P(shX, elbY - 0.2 * Math.cos(foreSw), elbZ + 0.2 * Math.sin(foreSw)),
        0.23, 0.42, 0.23, plate, -foreSw, 0, 0.1, inv);
      put(B.box, P(shX, elbY - 0.42 * Math.cos(foreSw), elbZ + 0.42 * Math.sin(foreSw)),
        0.2, 0.16, 0.2, suit, -foreSw, 0, 0, inv);
      // ---- högerarm hålls fram mot vapnet, med pansrad underarm
      put(B.box, P(0.5, 1.9 + bob, 0.12), 0.19, 0.34, 0.19, suit, 0.5, 0, -0.1, inv);
      put(B.box, P(0.48, 1.62 + bob, 0.38), 0.22, 0.24, 0.5, plate, 0, 0, 0, inv);

      // ---- svärdet i höger hand: vilar över axeln, sveper i attacken
      const grip = P(0.52, 1.48 + bob, 0.3);
      let sYaw, up;
      if (this.swingTime > 0) {
        const t = 1 - this.swingTime / this.swingDur;
        const ease = t * t * (3 - 2 * t);
        if (this.swingFinisher) {
          // finisher: rakt överhandshugg uppifrån och ner
          sYaw = yaw;
          up = lerp(0.95, -0.5, ease);
        } else {
          sYaw = yaw + lerp(-1.7, 1.7, ease) * this.swingSide;
          up = 0.12;
        }
      } else {
        sYaw = yaw + 0.35;
        up = 0.82;
      }
      const horiz = Math.sqrt(1 - up * up);
      const bd = { x: Math.sin(sYaw) * horiz, y: up, z: Math.cos(sYaw) * horiz };
      const rxB = -Math.asin(up);
      // klinga, parerstång, grepp och knopp
      const hot = this.swingTime > 0 && this.swingFinisher;
      B.box.push(grip[0] + bd.x * 0.95, grip[1] + bd.y * 0.95, grip[2] + bd.z * 0.95,
        0.11, 0.045, 1.5, hot ? [1.0, 0.42, 0.10] : [0.75, 0.78, 0.85],
        rxB, sYaw, 0, hot ? 0.55 : this.swingTime > 0 ? 0.35 : 0.06);
      B.box.push(grip[0] + bd.x * 0.14, grip[1] + bd.y * 0.14, grip[2] + bd.z * 0.14,
        0.4, 0.09, 0.1, gold, rxB, sYaw, 0, 0.1);
      B.box.push(grip[0] - bd.x * 0.08, grip[1] - bd.y * 0.08, grip[2] - bd.z * 0.08,
        0.08, 0.08, 0.3, suit, rxB, sYaw, 0, 0);
      B.octa.push(grip[0] - bd.x * 0.28, grip[1] - bd.y * 0.28, grip[2] - bd.z * 0.28,
        0.1, 0.13, 0.1, gold, 0, time * 2, 0, 0.15);
    }

    // dronare från uppgraderingen
    for (let i = 0; i < this.stats.drones; i++) {
      const a = this.droneAngle + (i / this.stats.drones) * TAU;
      const dx = Math.cos(a) * 2.1, dz = Math.sin(a) * 2.1;
      const dy = y + 2.4 + Math.sin(time * 2 + i) * 0.18;
      B.octa.push(x + dx, dy, z + dz, 0.42, 0.55, 0.42, [1.0, 0.75, 0.25], 0, a * 2, 0, 0.85);
    }

    rend.shadow(x, terrainHeight(x, z), z, 1.0 + (this.pos.y - terrainHeight(x, z)) * 0.05,
      0.42 * Math.max(0, 1 - (this.pos.y - terrainHeight(x, z)) * 0.09));
  }
}

// Fiendetyper, deras AI och vågsystemet.


const TYPES = {
  grunt:   { hp: 22,  speed: 6.7, radius: 0.70, height: 1.7, dmg: 9,  xp: 3,  col: [0.93, 0.28, 0.30], ai: 'melee' },
  spitter: { hp: 17,  speed: 4.7, radius: 0.65, height: 1.6, dmg: 8,  xp: 5,  col: [0.66, 0.34, 0.96], ai: 'ranged', range: 22, cool: 2.1, bullet: 27 },
  charger: { hp: 38,  speed: 5.4, radius: 0.85, height: 1.9, dmg: 19, xp: 8,  col: [0.98, 0.62, 0.16], ai: 'charge' },
  tank:    { hp: 105, speed: 3.0, radius: 1.35, height: 2.5, dmg: 25, xp: 15, col: [0.28, 0.80, 0.62], ai: 'melee' },
  boss:    { hp: 560, speed: 3.7, radius: 2.60, height: 4.6, dmg: 34, xp: 90, col: [1.00, 0.24, 0.50], ai: 'boss', cool: 1.5, bullet: 22 },

  // --- Neotropolis egna maskiner (utnyttjar att striden är i tre dimensioner)
  drone:  { hp: 14,  speed: 10.5, radius: 0.50, height: 0.9, dmg: 7,  xp: 3,  col: [1.00, 0.85, 0.25], ai: 'drone', turn: 11 },
  sniper: { hp: 34,  speed: 7.6,  radius: 0.70, height: 1.6, dmg: 24, xp: 10, col: [0.35, 1.00, 0.72], ai: 'sniper', turn: 5, cool: 2.6, bullet: 70 },
  hover:  { hp: 155, speed: 3.4,  radius: 1.90, height: 2.0, dmg: 20, xp: 17, col: [0.55, 0.60, 1.00], ai: 'hover', turn: 0.8, cool: 2.4, bullet: 32, shield: true },
};

// Neotropolis-varianternas neonskal.
const CITY_COLS = {
  grunt: [1.0, 0.22, 0.5], spitter: [0.4, 0.9, 1.0], charger: [1.0, 0.55, 0.1],
  tank: [0.45, 0.5, 1.0], boss: [0.85, 0.2, 1.0],
};

class Enemy {
  constructor(type, x, z, wave, worldId = 'wild') {
    const t = TYPES[type];
    this.type = type;
    this.def = t;
    this.boss = type === 'boss';
    this.fly = worldId === 'city';
    const hpMul = 1 + (wave - 1) * 0.23 + (wave > 10 ? (wave - 10) * 0.09 : 0);
    this.maxHp = Math.round(t.hp * hpMul);
    this.hp = this.maxHp;
    this.dmg = t.dmg * (1 + (wave - 1) * 0.07);
    this.speed = t.speed * (1 + Math.min(0.35, (wave - 1) * 0.018));
    this.radius = t.radius;
    this.height = t.height;
    this.xp = t.xp;
    this.col = ((this.fly && CITY_COLS[type]) || t.col).slice();
    this.pos = { x, y: terrainHeight(x, z), z };
    this.vel = { x: 0, y: 0, z: 0 };
    this.yaw = 0;
    this.alive = true;
    this.flash = 0;
    this.hitCd = 0;
    this.fireCd = rand(0.4, 1.6);
    this.state = 'idle';
    this.stateT = 0;
    this.phase = rand(TAU);
    this.grounded = true;
    this.slow = 0;
    this.attackIndex = 0;
    this.walk = rand(TAU);   // gångcykel, drivs av faktisk fart
    this.planar = 0;
    this.perch = null;       // taksnipern: byggnaden den sitter på
    this.aimT = 0;
    this.aimPitch = 0;
    this.shieldFlash = 0;
  }

  damage(n, ctx, crit) {
    if (!this.alive) return 0;
    // hover-plattformens frontsköld: måste flankeras
    if (this.def.shield) {
      const src = ctx.player.pos;
      const ang = Math.atan2(src.x - this.pos.x, src.z - this.pos.z);
      if (Math.abs(angleDelta(this.yaw, ang)) < 1.05) {
        n *= 0.2;
        this.shieldFlash = 1;
        const fx = this.pos.x + Math.sin(this.yaw) * 1.6, fz = this.pos.z + Math.cos(this.yaw) * 1.6;
        ctx.particles.burst(fx, this.pos.y + 1.3, fz, 5, {
          speed: 5, life: 0.25, size: 0.4, col: [0.6, 0.85, 1.0], alpha: 0.9, drag: 0.7,
        });
      }
    }
    ctx.damageDealt += Math.min(n, this.hp);
    this.hp -= n;
    this.flash = 1;
    ctx.particles.burst(this.pos.x, this.pos.y + this.height * 0.6, this.pos.z, crit ? 10 : 5, {
      speed: crit ? 9 : 5, life: 0.34, size: crit ? 0.5 : 0.34,
      col: crit ? [1.0, 0.85, 0.3] : [1.0, 0.55, 0.35], alpha: 0.9, drag: 0.5, grav: -6,
    });
    if (this.hp <= 0) { this.alive = false; return 1; }
    return 0;
  }

  update(dt, ctx) {
    const p = ctx.player;
    const dx = p.pos.x - this.pos.x, dz = p.pos.z - this.pos.z;
    const dist = Math.hypot(dx, dz) || 0.001;
    const nx = dx / dist, nz = dz / dist;
    this.stateT -= dt;
    this.hitCd -= dt;
    this.fireCd -= dt;
    this.flash = Math.max(0, this.flash - dt * 3.5);
    this.slow = Math.max(0, this.slow - dt);
    const slowF = this.slow > 0 ? 0.55 : 1;

    let wishX = 0, wishZ = 0, speed = this.speed * slowF;

    switch (this.def.ai) {
      case 'melee':
        wishX = nx; wishZ = nz;
        break;

      case 'ranged': {
        const want = this.def.range;
        if (dist > want + 3) { wishX = nx; wishZ = nz; }
        else if (dist < want - 6) { wishX = -nx; wishZ = -nz; }
        else {
          // cirkla runt spelaren
          wishX = -nz * Math.sign(Math.sin(this.phase * 3.1));
          wishZ = nx * Math.sign(Math.sin(this.phase * 3.1));
          speed *= 0.8;
        }
        if (this.fireCd <= 0 && dist < want + 8) {
          this.fireCd = this.def.cool * rand(0.85, 1.2);
          this.state = 'shoot'; this.stateT = 0.3;
          ctx.spawnEnemyBullet(this, p, this.def.bullet, this.dmg * 0.8);
        }
        break;
      }

      case 'charge': {
        if (this.state === 'charging') {
          speed = 0;
          if (this.stateT <= 0) { this.state = 'recover'; this.stateT = 0.8; }
          ctx.particles.spawn({
            x: this.pos.x, y: this.pos.y + 0.6, z: this.pos.z,
            vx: rand(-1, 1), vy: rand(0.5, 2), vz: rand(-1, 1),
            life: 0.3, size: 0.5, col: [1.0, 0.6, 0.15], alpha: 0.8, drag: 0.5,
          });
        } else if (this.state === 'windup') {
          speed = 0;
          if (this.stateT <= 0) {
            this.state = 'charging'; this.stateT = 0.65;
            this.vel.x = nx * 30; this.vel.z = nz * 30;
            ctx.sound.tone({ f: 160, f2: 420, dur: 0.18, type: 'sawtooth', vol: 0.08 });
          }
        } else if (this.state === 'recover') {
          speed = this.speed * 0.3;
          wishX = nx; wishZ = nz;
          if (this.stateT <= 0) this.state = 'idle';
        } else {
          wishX = nx; wishZ = nz;
          speed = this.speed * 0.75;
          if (dist < 15 && dist > 4) { this.state = 'windup'; this.stateT = 0.55; }
        }
        break;
      }

      // Svärmdrönare: cirklar högt ovanför och störtdyker i intervaller.
      case 'drone': {
        if (this.state === 'dive') {
          speed = this.speed * 1.9;
          wishX = this.diveX; wishZ = this.diveZ;
          if (this.stateT <= 0) { this.state = 'recover'; this.stateT = rand(0.6, 1.1); }
        } else if (this.state === 'recover') {
          speed = this.speed * 0.9;
          wishX = -nx; wishZ = -nz;
          if (this.stateT <= 0) { this.state = 'circle'; this.stateT = rand(0.7, 1.5); }
        } else {
          const side = Math.sin(this.phase * 2.3) < 0 ? -1 : 1;
          wishX = -nz * side + nx * 0.35;
          wishZ = nx * side + nz * 0.35;
          speed = this.speed * 0.5;
          if (this.stateT <= 0 && dist < 30) {
            this.state = 'dive'; this.stateT = 0.8;
            this.diveX = nx; this.diveZ = nz;
            ctx.sound.droneDive();
          }
        }
        break;
      }

      // Taksnipern: slår sig ner på ett hustak, laddar och skjuter långt.
      case 'sniper': {
        this.aimPitch = Math.atan2((p.pos.y + 1.1) - (this.pos.y + 1.15), Math.max(dist, 0.1));
        const list = ctx.buildings;
        // överger taket om spelaren kommer för nära det
        if (this.perch && dist < 11 &&
            Math.hypot(this.perch.x - p.pos.x, this.perch.z - p.pos.z) < 16) {
          this.perch = null;
        }
        if (!this.perch && list && list.length) {
          let best = null, bestScore = 1e9;
          for (let k = 0; k < 22; k++) {
            const b = list[(Math.random() * list.length) | 0];
            const d = Math.hypot(b.x - p.pos.x, b.z - p.pos.z);
            if (d < 18 || d > 44) continue;
            // bra skjutavstånd till spelaren, men nära nog att flyga dit snabbt
            const own = Math.hypot(b.x - this.pos.x, b.z - this.pos.z);
            const score = Math.abs(d - 28) + own * 0.7 + Math.abs(b.h - 18) * 0.3;
            if (score < bestScore) { bestScore = score; best = b; }
          }
          this.perch = best;
          this.aimT = 0;
        }
        if (this.perch) {
          const px = this.perch.x - this.pos.x, pz = this.perch.z - this.pos.z;
          const pd = Math.hypot(px, pz);
          if (pd > 1.2) {
            wishX = px / pd; wishZ = pz / pd;
            speed = Math.min(this.speed, pd * 3.2);   // bromsa in mot taket
            this.state = 'travel';
            this.aimT = 0;
          } else {
            speed = 0;
            this.state = 'aim';
            if (this.fireCd <= 0) {
              this.aimT += dt;
              // röd siktlinje som telegraferar skottet
              const beads = this.aimT > 1.0 ? 3 : 1;
              for (let k = 0; k < beads; k++) {
                const t = Math.random();
                ctx.particles.spawn({
                  x: lerp(this.pos.x, p.pos.x, t),
                  y: lerp(this.pos.y + 1.15, p.pos.y + 1.1, t),
                  z: lerp(this.pos.z, p.pos.z, t),
                  life: 0.09, size: 0.1 + this.aimT * 0.06, size2: 0.03,
                  col: [1.0, 0.2, 0.2], alpha: 0.5 + this.aimT * 0.3, drag: 0,
                });
              }
              if (this.aimT >= 1.5) {
                this.aimT = 0;
                this.fireCd = this.def.cool * rand(0.9, 1.3);
                ctx.spawnEnemyBullet(this, p, this.def.bullet, this.dmg);
                ctx.sound.snipe();
                if (Math.random() < 0.45) this.perch = null;   // byter position ibland
              }
            } else this.aimT = 0;
          }
        } else {
          // inga tak att välja: håll avstånd som en vanlig skytt
          if (dist > 26) { wishX = nx; wishZ = nz; }
          else { wishX = -nz; wishZ = nx; speed *= 0.7; }
        }
        break;
      }

      // Hover-plattform: tung, sköld framåt, vänder långsamt — måste flankeras.
      case 'hover': {
        if (dist > 18) { wishX = nx; wishZ = nz; }
        else if (dist < 11) { wishX = -nx; wishZ = -nz; speed *= 0.75; }
        else {
          const side = Math.sin(this.phase * 0.7) < 0 ? -1 : 1;
          wishX = -nz * side; wishZ = nx * side;
          speed *= 0.6;
        }
        if (this.fireCd <= 0 && dist < 26 &&
            Math.abs(angleDelta(this.yaw, Math.atan2(nx, nz))) < 0.5) {
          this.fireCd = this.def.cool * rand(0.9, 1.15);
          this.state = 'salvo';
          for (let k = 0; k < 3; k++) {
            const spread = (k - 1) * 0.09;
            const c = Math.cos(spread), s = Math.sin(spread);
            const dy = ((p.pos.y + 1.1) - (this.pos.y + 1.4)) / Math.max(dist, 1);
            ctx.spawnEnemyBulletDir(this, nx * c + nz * s, dy, -nx * s + nz * c,
              this.def.bullet, this.dmg * 0.7);
          }
          ctx.sound.salvo();
        }
        break;
      }

      case 'boss': {
        if (this.state === 'volley') {
          speed = this.speed * 0.2;
          if (this.stateT <= 0) { this.state = 'idle'; this.stateT = rand(1.6, 2.6); }
        } else if (this.state === 'slam') {
          speed = 0;
          if (this.stateT <= 0) {
            ctx.shockwave(this.pos.x, this.pos.y, this.pos.z, 13, this.dmg);
            this.state = 'idle'; this.stateT = rand(1.8, 2.8);
          }
        } else if (this.state === 'summon') {
          speed = 0;
          if (this.stateT <= 0) {
            const minion = ctx.worldId === 'city' ? 'drone' : 'grunt';
            for (let i = 0; i < 3; i++) {
              const a = rand(TAU), d = rand(5, 9);
              ctx.spawnEnemy(minion, this.pos.x + Math.cos(a) * d, this.pos.z + Math.sin(a) * d);
            }
            this.state = 'idle'; this.stateT = rand(2.2, 3.2);
          }
        } else {
          wishX = nx; wishZ = nz;
          if (this.stateT <= 0) {
            const roll = Math.random();
            if (dist < 11 && roll < 0.45) { this.state = 'slam'; this.stateT = 0.9; }
            else if (roll < 0.7) {
              this.state = 'volley'; this.stateT = 0.9;
              const n = 14;
              for (let i = 0; i < n; i++) {
                const a = (i / n) * TAU + this.phase;
                ctx.spawnEnemyBulletDir(this, Math.sin(a), 0.02, Math.cos(a), this.def.bullet, this.dmg * 0.55);
              }
              ctx.sound.tone({ f: 120, f2: 300, dur: 0.3, type: 'square', vol: 0.10 });
            } else { this.state = 'summon'; this.stateT = 0.8; }
          }
        }
        break;
      }
    }

    // separation så de inte staplas på varandra
    let sx = 0, sz = 0;
    for (const o of ctx.enemies) {
      if (o === this || !o.alive) continue;
      const ox = this.pos.x - o.pos.x, oz = this.pos.z - o.pos.z;
      const d2 = ox * ox + oz * oz;
      const min = this.radius + o.radius + 0.25;
      if (d2 < min * min && d2 > 0.0001) {
        const d = Math.sqrt(d2);
        sx += (ox / d) * (1 - d / min);
        sz += (oz / d) * (1 - d / min);
      }
    }
    wishX += sx * 1.9; wishZ += sz * 1.9;

    const wl = Math.hypot(wishX, wishZ);
    if (wl > 0.001) {
      const accel = 30 * dt;
      const tx = (wishX / wl) * speed, tz = (wishZ / wl) * speed;
      this.vel.x += clamp(tx - this.vel.x, -accel, accel);
      this.vel.z += clamp(tz - this.vel.z, -accel, accel);
    } else {
      const f = Math.exp(-6 * dt);
      this.vel.x *= f; this.vel.z *= f;
    }

    if (this.fly) {
      // Neotropolis: monstren svävar. Snipern sätter sig på taket, drönarna
      // cirklar högt och dyker, resten söker spelarens höjd.
      const gh = terrainHeight(this.pos.x, this.pos.z);
      let wantY;
      if (this.def.ai === 'sniper' && this.perch) {
        wantY = this.perch.h + 1.0;
      } else {
        const off = this.def.ai === 'drone' ? (this.state === 'dive' ? 0.5 : 6.5)
          : this.def.ai === 'hover' ? 2.6
          : this.boss ? 1.5 : 0.5;
        wantY = p.pos.y + off + Math.sin(this.phase * 1.7) * 0.9;
      }
      wantY = Math.max(gh + 1.0, wantY);
      this.vel.y += clamp((wantY - this.pos.y) * 4 - this.vel.y * 2.2, -26, 26) * dt;
    } else {
      this.vel.y -= 30 * dt;
    }
    this.pos.x += this.vel.x * dt;
    this.pos.y += this.vel.y * dt;
    this.pos.z += this.vel.z * dt;

    clampToArena(this.pos);
    ctx.colliders.resolve(this.pos, this.radius);

    const gh = terrainHeight(this.pos.x, this.pos.z);
    if (this.pos.y <= gh) { this.pos.y = gh; this.vel.y = 0; this.grounded = true; }
    else this.grounded = false;

    // vänd mot spelaren — hover-plattformen vrider sig trögt, därav flanken
    this.yaw += angleDelta(this.yaw, Math.atan2(nx, nz)) * Math.min(1, dt * (this.def.turn || 8));
    this.phase += dt;
    this.shieldFlash = Math.max(0, this.shieldFlash - dt * 3);
    this.planar = Math.hypot(this.vel.x, this.vel.z);
    this.walk += dt * (this.planar * 1.5 + 0.6);

    // chargern frustar under uppladdningen
    if (this.def.ai === 'charge' && this.state === 'windup' && Math.random() < 0.45) {
      const hx = this.pos.x + Math.sin(this.yaw) * 1.5, hz = this.pos.z + Math.cos(this.yaw) * 1.5;
      ctx.particles.spawn({
        x: hx, y: this.pos.y + 0.9, z: hz,
        vx: Math.sin(this.yaw) * 3 + rand(-1, 1), vy: rand(0.5, 1.5), vz: Math.cos(this.yaw) * 3 + rand(-1, 1),
        life: rand(0.3, 0.5), size: 0.5, size2: 0.1, col: [0.8, 0.8, 0.85], alpha: 0.5, drag: 0.6,
      });
    }

    // kontaktskada
    const contact = this.radius + p.radius + 0.35;
    if (dist < contact && Math.abs(this.pos.y - p.pos.y) < this.height + 1.2 && this.hitCd <= 0) {
      const boost = this.state === 'charging' ? 1.5 : 1;
      if (ctx.player.takeDamage(this.dmg * boost)) {
        this.hitCd = 0.75;
        ctx.sound.hurt();
        ctx.particles.burst(p.pos.x, p.pos.y + 1.2, p.pos.z, 12,
          { speed: 6, life: 0.4, size: 0.5, col: [1.0, 0.25, 0.3], alpha: 0.9, drag: 0.5 });
        if (this.state === 'charging') { this.state = 'recover'; this.stateT = 1.0; this.vel.x *= -0.3; this.vel.z *= -0.3; }
      }
    }
  }

  draw(rend, time) {
    const B = rend.dyn;
    const f = this.flash;
    const c = [lerp(this.col[0], 1, f), lerp(this.col[1], 1, f), lerp(this.col[2], 1, f)];
    const dark = [c[0] * 0.42, c[1] * 0.42, c[2] * 0.42];
    const belly = [lerp(c[0], 1, 0.35), lerp(c[1], 1, 0.35), lerp(c[2], 1, 0.35)];
    const bone = [0.92, 0.88, 0.78];
    const x = this.pos.x, y = this.pos.y, z = this.pos.z, yaw = this.yaw;
    const csY = Math.cos(yaw), snY = Math.sin(yaw);
    // Lokala koordinater: +z = framåt (mot spelaren), +x = höger.
    const P = (lx, ly, lz) => [x + csY * lx + snY * lz, y + ly, z - snY * lx + csY * lz];
    const put = (batch, p, sx, sy, sz, col, rx = 0, ryOff = 0, rz = 0, g = 0) =>
      batch.push(p[0], p[1], p[2], sx, sy, sz, col, rx, yaw + ryOff, rz, g);
    const pop = 1 + f * 0.06;                 // liten "träffstuds" i skalan
    const glow = 0.2 + f * 0.9;
    const blink = Math.sin(time * 1.7 + this.phase * 9) > 0.96 ? 0.15 : 1;

    switch (this.type) {
      case 'grunt': {
        const run = this.walk * 1.7;
        const sq = 1 + Math.sin(run * 2) * 0.05;
        const hop = Math.abs(Math.sin(run)) * 0.10;
        // ben som tassar
        for (const s of [-1, 1]) {
          const ph = run + (s > 0 ? 0 : Math.PI);
          const sw = Math.sin(ph) * 0.75;
          put(B.box, P(0.34 * s, 0.34 + Math.max(0, -Math.cos(ph)) * 0.1, Math.sin(sw) * 0.12),
            0.26, 0.55, 0.32, dark, sw, 0, 0, 0);
        }
        // kropp med ljusare mage
        put(B.sphere, P(0, 0.95 + hop, 0), 1.35 * pop, 1.3 * sq * pop, 1.25 * pop, c, 0, 0, 0, glow * 0.4);
        put(B.sphere, P(0, 0.8 + hop, 0.34), 0.85, 0.72, 0.55, belly, 0, 0, 0, 0);
        // gapande käft med tänder
        const gape = 0.1 + (Math.sin(time * 7 + this.phase * 3) * 0.5 + 0.5) * 0.16;
        put(B.box, P(0, 0.82 + hop, 0.58), 0.66, gape + 0.14, 0.28, [0.08, 0.02, 0.05], 0.15, 0, 0, 0);
        for (const s of [-1, 1]) {
          put(B.cone, P(0.2 * s, 0.78 + hop, 0.68), 0.09, 0.2, 0.07, bone, Math.PI, 0, 0, 0);
        }
        // ögon med pupiller (blinkar)
        for (const s of [-1, 1]) {
          put(B.sphere, P(0.28 * s, 1.32 + hop, 0.46), 0.3, 0.3 * blink, 0.22, [1, 0.97, 0.9], 0, 0, 0, 0.5);
          put(B.sphere, P(0.28 * s, 1.32 + hop, 0.58), 0.13, 0.13 * blink, 0.1, [0.05, 0.02, 0.02], 0, 0, 0, 0);
        }
        // horn och ryggtaggar
        for (const s of [-1, 1]) {
          put(B.cone, P(0.32 * s, 1.74 + hop, -0.02), 0.2, 0.5, 0.2, bone, -0.15, 0, -0.55 * s, 0);
        }
        put(B.cone, P(0, 1.48 + hop, -0.48), 0.18, 0.42, 0.14, dark, -1.0, 0, 0, 0);
        put(B.cone, P(0, 1.12 + hop, -0.6), 0.14, 0.32, 0.11, dark, -1.25, 0, 0, 0);
        // armar
        for (const s of [-1, 1]) {
          const sw = Math.sin(run + (s > 0 ? Math.PI : 0)) * 0.6;
          put(B.box, P(0.72 * s, 0.95 + hop, 0.05), 0.2, 0.5, 0.2, c, sw - 0.3, 0, -0.2 * s, 0);
        }
        break;
      }
      case 'spitter': {
        const hover = 0.5 + Math.sin(this.phase * 2.2) * 0.14;
        const charge = clamp(1 - this.fireCd / (this.def.cool || 1), 0, 1);
        // slöja i två lager som roterar åt olika håll
        put(B.cone, P(0, 0.75 + hover * 0.5, 0), 1.45 * pop, 1.8, 1.45 * pop, c, 0, time * 0.5, 0, glow * 0.4);
        put(B.cone, P(0, 0.55 + hover * 0.5, 0), 1.15, 1.5, 1.15, dark, 0, -time * 0.7, 0, 0.15);
        // bål, huvud och huva
        put(B.sphere, P(0, 1.7 + hover, 0), 0.8, 0.9, 0.8, dark, 0, 0, 0, glow * 0.5);
        put(B.sphere, P(0, 2.25 + hover, 0.05), 0.72, 0.66, 0.72, c, 0, 0, 0, glow * 0.5);
        put(B.cone, P(0, 2.62 + hover, -0.08), 0.6, 0.7, 0.6, dark, -0.25, 0, 0, 0);
        // cyklopöga
        put(B.sphere, P(0, 2.3 + hover, 0.38), 0.42, 0.42 * blink, 0.3, [1, 0.98, 0.92], 0, 0, 0, 0.6);
        put(B.sphere, P(0, 2.3 + hover, 0.55), 0.2, 0.2 * blink, 0.12, [0.4, 0.05, 0.5], 0, 0, 0, 0.3);
        // eldrör som glöder upp inför skottet
        put(B.cyl, P(0, 1.75 + hover, 0.55), 0.3, 0.75, 0.3, dark, Math.PI / 2, 0, 0, 0.1 + charge * 0.6);
        const orb = 0.22 + charge * 0.16;
        put(B.sphere, P(0, 1.75 + hover, 0.95), orb, orb, orb, [0.85, 0.5, 1.0], 0, 0, 0, 0.3 + charge * 1.4);
        // hängande armar som svajar
        for (const s of [-1, 1]) {
          put(B.cone, P(0.68 * s, 1.7 + hover, 0.08), 0.16, 0.8, 0.16, c,
            Math.PI + Math.sin(this.phase * 2 + s) * 0.15, 0, 0.12 * s, glow * 0.3);
        }
        break;
      }
      case 'charger': {
        const gallop = this.walk * 1.35;
        const wind = this.state === 'windup' ? Math.sin(time * 42) * 0.1 : 0;
        const rage = this.state === 'windup' || this.state === 'charging' ? 1 : 0;
        const lean = clamp(this.planar * 0.02, 0, 0.22);
        // fyra ben i galopp: frampar och bakpar i motfas
        for (const fz of [0.62, -0.72]) {
          for (const s of [-1, 1]) {
            const ph = gallop + (fz > 0 ? 0 : Math.PI) + (s > 0 ? 0 : 0.5);
            const sw = Math.sin(ph) * 0.65;
            put(B.box, P(0.52 * s, 0.42 + Math.max(0, -Math.cos(ph)) * 0.12, fz + Math.sin(sw) * 0.15),
              0.28, 0.72, 0.34, dark, sw, 0, 0, 0);
          }
        }
        // kropp som lutar framåt med farten, bogparti
        put(B.box, P(0, 1.15, -0.1), 1.35 * pop, 1.0 * pop, 1.9, c, lean + wind * 0.3, wind, 0,
          glow * 0.4 + rage * 0.3);
        put(B.box, P(0, 1.62, -0.55), 1.05, 0.55, 0.95, dark, -0.15, 0, 0, 0);
        // sänkt huvud med nos
        put(B.box, P(0, 0.98, 1.12), 0.85, 0.68, 0.8, dark, -0.22 - rage * 0.15, wind, 0, 0);
        put(B.box, P(0, 0.8, 1.5), 0.5, 0.35, 0.3, [0.1, 0.06, 0.08], -0.2, 0, 0, 0);
        // horn av ben, pekar framåt-utåt
        for (const s of [-1, 1]) {
          put(B.cone, P(0.44 * s, 1.18, 1.42), 0.17, 0.8, 0.17, bone, 1.15, 0, -0.35 * s, 0);
        }
        // glödande ögon — brinner starkare vid anfall
        for (const s of [-1, 1]) {
          put(B.sphere, P(0.26 * s, 1.12, 1.48), 0.13, 0.11, 0.1, [1, 0.25, 0.1], 0, 0, 0, 0.9 + rage * 1.3);
        }
        // piskande svans
        put(B.cone, P(0, 1.5, -1.05), 0.13, 0.6, 0.13, dark,
          -2.3 + Math.sin(time * 4 + this.phase) * 0.25, 0, 0, 0);
        break;
      }
      case 'tank': {
        const stomp = this.walk * 0.85;
        const sway = Math.sin(stomp) * 0.05;
        // tunga stampande ben
        for (const s of [-1, 1]) {
          const sw = Math.sin(stomp + (s > 0 ? 0 : Math.PI)) * 0.35;
          put(B.box, P(0.68 * s, 0.62, Math.sin(sw) * 0.25), 0.62, 1.25, 0.72, dark, sw, 0, 0, 0);
        }
        // höft, bål som svajar, bröstplåt
        put(B.box, P(0, 1.45, 0), 1.7, 0.55, 1.15, dark, 0, 0, sway * 0.4, 0);
        put(B.box, P(0, 2.3, 0), 2.3 * pop, 1.5 * pop, 1.5, c, 0, 0, sway, glow * 0.4);
        put(B.box, P(0, 2.32, 0.78), 1.6, 1.05, 0.22, dark, 0, 0, sway, 0);
        // axlar, armar och nävar
        for (const s of [-1, 1]) {
          const sw = Math.sin(stomp + (s > 0 ? Math.PI : 0)) * 0.28;
          put(B.sphere, P(1.5 * s, 2.95, 0), 1.15, 0.95, 1.05, dark, 0, 0, sway, 0);
          put(B.box, P(1.55 * s, 1.95, Math.sin(sw) * 0.3), 0.52, 1.5, 0.52, c, sw, 0, 0.06 * s, glow * 0.3);
          put(B.box, P(1.55 * s, 1.15, Math.sin(sw) * 0.55), 0.68, 0.6, 0.7, dark, sw * 0.5, 0, 0, 0);
        }
        // huvud med lysande visir
        put(B.box, P(0, 3.35, 0.25), 0.72, 0.6, 0.65, dark, 0, 0, sway, 0);
        put(B.box, P(0, 3.38, 0.58), 0.55, 0.16, 0.12, [0.5, 1.0, 0.9], 0, 0, 0, 1.3);
        // pulserande energikärna + ryggkristaller
        put(B.octa, P(0, 2.3, 0.92), 0.42, 0.55, 0.42, [0.6, 1.0, 0.85], 0, time * 2.5, 0,
          0.9 + Math.sin(time * 4) * 0.35);
        put(B.octa, P(0, 3.1, -0.7), 0.5, 0.9, 0.5, c, 0.5, 0, 0.15, 0.7);
        put(B.octa, P(0.5, 2.7, -0.8), 0.35, 0.6, 0.35, c, 0.4, 0.6, -0.2, 0.6);
        put(B.octa, P(-0.5, 2.65, -0.75), 0.32, 0.55, 0.32, c, 0.45, -0.5, 0.25, 0.6);
        break;
      }
      // --------------------------------------------- Neotropolis-maskinerna

      case 'drone': {
        const spin = time * 30;
        const diving = this.state === 'dive';
        put(B.box, P(0, 0.38, 0), 0.5, 0.26, 0.66, c, diving ? 0.35 : 0, 0, 0,
          glow + (diving ? 0.9 : 0.15));
        for (const [ax, az] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
          put(B.box, P(0.3 * ax, 0.38, 0.3 * az), 0.4, 0.06, 0.09, dark, 0, Math.atan2(ax, az), 0, 0);
          put(B.octa, P(0.52 * ax, 0.46, 0.52 * az), 0.6, 0.05, 0.6, [0.75, 0.8, 0.9],
            0, spin * (ax * az > 0 ? 1 : -1), 0, 0.3);
        }
        // sensoröga
        put(B.sphere, P(0, 0.36, 0.36), 0.25, 0.25 * blink, 0.18, [1, 0.97, 0.88], 0, 0, 0, 0.6);
        put(B.sphere, P(0, 0.36, 0.45), 0.12, 0.12 * blink, 0.08, [1, 0.25, 0.12], 0, 0, 0,
          diving ? 1.6 : 0.8);
        break;
      }

      case 'sniper': {
        const chg = clamp(this.aimT / 1.5, 0, 1);
        const perched = this.state === 'aim';
        // tripodben, hopfällda under färd
        for (let i = 0; i < 3; i++) {
          const a = (i / 3) * TAU + 0.5;
          const spread = perched ? 0.45 : 0.16;
          put(B.cone, P(Math.cos(a) * spread, 0.34, Math.sin(a) * spread),
            0.15, 0.72, 0.15, dark, Math.PI + (perched ? 0.3 : 0.05),
            Math.atan2(Math.cos(a), Math.sin(a)), 0, 0);
        }
        put(B.box, P(0, 0.88, 0), 0.66, 0.46, 0.76, c, 0, 0, 0, glow * 0.5);
        put(B.sphere, P(0, 1.2, 0.06), 0.5, 0.46, 0.5, dark, 0, 0, 0, 0);
        // lång pipa som följer spelaren i höjdled
        const bp = Math.PI / 2 - this.aimPitch;
        put(B.cyl, P(0, 1.16, 0.9), 0.12, 1.6, 0.12, [0.24, 0.27, 0.33], bp, 0, 0, 0.05);
        put(B.box, P(0, 1.16, 0.35), 0.26, 0.2, 0.5, dark, 0, 0, 0, 0);
        // kikarsikte som laddar upp inför skottet
        put(B.octa, P(0, 1.46, 0.2), 0.2, 0.28, 0.2, [1.0, 0.35 - chg * 0.25, 0.3],
          0, time * 3, 0, 0.35 + chg * 1.7);
        break;
      }

      case 'hover': {
        const sh = this.shieldFlash;
        // skrov
        put(B.box, P(0, 1.05, 0), 3.3, 0.5, 2.5, c, 0, 0, 0, glow * 0.35);
        put(B.box, P(0, 0.78, 0), 2.7, 0.3, 1.9, dark, 0, 0, 0, 0);
        // frontsköld — lyser till när den blockar
        put(B.box, P(0, 1.35, 1.4), 3.5, 1.5, 0.22,
          [lerp(0.35, 1, sh), lerp(0.72, 0.95, sh), 1.0], -0.2, 0, 0, 0.4 + sh * 1.6);
        put(B.box, P(0, 2.12, 1.32), 3.5, 0.14, 0.3, [0.6, 0.85, 1.0], -0.2, 0, 0, 0.9);
        // torn med dubbelpipor
        put(B.sphere, P(0, 1.6, -0.25), 1.35, 1.0, 1.35, dark, 0, 0, 0, glow * 0.4);
        for (const s of [-1, 1]) {
          put(B.cyl, P(0.32 * s, 1.55, 0.75), 0.15, 1.2, 0.15, [0.28, 0.3, 0.38],
            Math.PI / 2, 0, 0, this.state === 'salvo' ? 0.7 : 0.08);
        }
        put(B.octa, P(0, 2.15, -0.25), 0.4, 0.5, 0.4, [0.7, 0.8, 1.0], 0, time * 2, 0, 0.9);
        // lyftmotorer under
        for (const [ax, az] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {
          put(B.cyl, P(1.25 * ax, 0.6, 0.9 * az), 0.44, 0.42, 0.44, dark, 0, 0, 0, 0);
          put(B.octa, P(1.25 * ax, 0.32, 0.9 * az), 0.34, 0.26, 0.34, [0.5, 0.72, 1.0],
            0, time * 5, 0, 1.0);
        }
        break;
      }

      case 'boss': {
        const pulse = 1 + Math.sin(time * 3) * 0.04;
        const gape = this.state === 'volley' || this.state === 'slam'
          ? 0.75 : 0.2 + Math.sin(time * 2.3) * 0.08;
        // massiv kropp
        put(B.sphere, P(0, 2.5 * pulse, 0), 4.5 * pop, 4.4 * pulse * pop, 4.5 * pop, c, 0, 0, 0, glow * 0.5 + 0.2);
        // hornkrona som lutar utåt
        for (let i = 0; i < 6; i++) {
          const ai = (i / 6) * TAU + 0.26;
          const lx = Math.cos(ai) * 1.9, lz = Math.sin(ai) * 1.9;
          put(B.cone, P(lx, 4.55, lz), 0.5, 1.6, 0.5, dark, 0.55, Math.atan2(lx, lz), 0, 0.25);
        }
        // tre ögon med pupiller
        put(B.sphere, P(0, 3.1, 1.95), 0.85, 0.85 * blink, 0.5, [1, 0.95, 0.9], 0, 0, 0, 0.7);
        put(B.sphere, P(0, 3.1, 2.28), 0.4, 0.4 * blink, 0.2, [0.6, 0.02, 0.1], 0, 0, 0, 0.5);
        for (const s of [-1, 1]) {
          put(B.sphere, P(0.95 * s, 3.6, 1.7), 0.42, 0.42 * blink, 0.28, [1, 0.95, 0.9], 0, 0, 0, 0.6);
          put(B.sphere, P(0.95 * s, 3.6, 1.9), 0.18, 0.18 * blink, 0.1, [0.6, 0.02, 0.1], 0, 0, 0, 0.4);
        }
        // käft med tandrader — gapar vid attack
        put(B.box, P(0, 1.75, 1.9), 1.7, 0.5 + gape, 0.5, [0.06, 0.01, 0.04], 0.2, 0, 0, 0);
        for (const s of [-1.5, -0.5, 0.5, 1.5]) {
          put(B.cone, P(0.32 * s, 2.12 + gape * 0.4, 2.02), 0.13, 0.3, 0.1, bone, Math.PI, 0, 0, 0);
          put(B.cone, P(0.32 * s + 0.16, 1.45 - gape * 0.4, 1.98), 0.11, 0.26, 0.09, bone, 0, 0, 0, 0);
        }
        // armar med klor
        for (const s of [-1, 1]) {
          const sw = Math.sin(time * 1.1 + s) * 0.12;
          put(B.box, P(2.9 * s, 2.6, 0.3), 1.0, 2.8, 1.0, dark, sw, 0, 0.12 * s, glow * 0.4);
          for (let k = -1; k <= 1; k++) {
            put(B.cone, P(2.9 * s + k * 0.3, 1.0, 0.55 + k * 0.12), 0.16, 0.55, 0.16, bone,
              Math.PI - 0.25, 0, k * 0.2, 0);
          }
        }
        // svajande tentakler under kroppen
        for (let i = 0; i < 5; i++) {
          const a = (i / 5) * TAU + time * 0.4;
          const lx = Math.cos(a) * 2.3, lz = Math.sin(a) * 2.3;
          put(B.cone, P(lx, 0.55, lz), 0.3, 1.3, 0.3, dark,
            Math.PI + Math.sin(time * 2 + i * 2) * 0.25, Math.atan2(lx, lz), 0, 0.2);
        }
        // kretsande skärvor
        for (let i = 0; i < 5; i++) {
          const a = time * 1.2 + (i / 5) * TAU;
          B.octa.push(x + Math.cos(a) * 4.2, y + 2.6 + Math.sin(a * 2 + i) * 0.8, z + Math.sin(a) * 4.2,
            0.8, 1.1, 0.8, [1, 0.5, 0.7], 0, a * 3, 0, 1.1);
        }
        if (this.state === 'slam') {
          B.sphere.push(x, y + 0.2, z, 6 + Math.sin(time * 30) * 1.5, 0.4, 6, [1, 0.4, 0.2], 0, 0, 0, 1.2);
        }
        break;
      }
    }

    const air = Math.max(0, this.pos.y - terrainHeight(x, z));
    rend.shadow(x, terrainHeight(x, z), z, this.radius * 2.1, 0.4 * Math.max(0, 1 - air * 0.1));
  }
}

class WaveManager {
  constructor() { this.reset(); }

  reset() {
    this.wave = 0;
    this.state = 'idle';
    this.timer = 2.0;
    this.queue = [];
    this.spawnTimer = 0;
    this.spawnedThisWave = 0;
  }

  compose(wave, worldId) {
    const list = [];
    if (wave % 5 === 0) list.push('boss');
    const budget = 5 + wave * 2.2;
    let spent = 0;

    const options = [];
    if (worldId === 'city') {
      // Neotropolis har sin egen robotpark
      options.push(['drone', 0.7]);
      if (wave >= 2) options.push(['sniper', 2.5]);
      if (wave >= 3) options.push(['spitter', 1.6]);
      if (wave >= 4) options.push(['hover', 4.2]);
    } else {
      options.push(['grunt', 1]);
      if (wave >= 2) options.push(['spitter', 1.6]);
      if (wave >= 3) options.push(['charger', 2.2]);
      if (wave >= 5) options.push(['tank', 3.4]);
    }

    while (spent < budget) {
      const [type, cost] = options[randInt(0, options.length - 1)];
      if (type === 'drone') {
        // drönare kommer alltid i svärm
        const n = randInt(2, 4);
        for (let i = 0; i < n; i++) list.push('drone');
        spent += cost * n;
      } else {
        list.push(type);
        spent += cost;
      }
    }
    return list;
  }

  startWave(ctx) {
    this.wave++;
    this.queue = this.compose(this.wave, ctx.worldId);
    this.spawnTimer = 0;
    this.state = 'spawning';
    ctx.onWaveStart(this.wave, this.queue.includes('boss'));
  }

  update(dt, ctx) {
    if (this.state === 'idle') {
      this.timer -= dt;
      if (this.timer <= 0) this.startWave(ctx);
      return;
    }
    if (this.state === 'spawning') {
      this.spawnTimer -= dt;
      if (this.spawnTimer <= 0 && this.queue.length) {
        const type = this.queue.shift();
        this.spawnAtRing(type, ctx);
        this.spawnTimer = type === 'boss' ? 1.2 : rand(0.20, 0.55);
      }
      if (!this.queue.length) this.state = 'clearing';
      return;
    }
    if (this.state === 'clearing') {
      if (!ctx.enemies.some((e) => e.alive)) {
        this.state = 'idle';
        this.timer = 4.5;
        ctx.onWaveClear(this.wave);
      }
    }
  }

  spawnAtRing(type, ctx) {
    const p = ctx.player.pos;
    for (let tries = 0; tries < 24; tries++) {
      const a = rand(TAU);
      const d = rand(38, 62);
      let x = p.x + Math.cos(a) * d, z = p.z + Math.sin(a) * d;
      const r = Math.hypot(x, z);
      if (r > ARENA_RADIUS - 6) { const s = (ARENA_RADIUS - 8) / r; x *= s; z *= s; }
      if (ctx.worldId !== 'city' && terrainHeight(x, z) < WATER_LEVEL + 0.4 && tries < 18) continue;
      ctx.spawnEnemy(type, x, z);
      return;
    }
    ctx.spawnEnemy(type, p.x + 30, p.z + 30);
  }
}
