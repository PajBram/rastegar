<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>DASHH — Voidfall</title>
<style>
  :root{
    --neon:#4df3ff;
    --neon2:#b07bff;
    --hot:#ff3d7f;
    --gold:#ffcc4d;
    --good:#4dffa6;
    --bg:#05060c;
    --panel:rgba(10,14,26,.82);
    --line:rgba(77,243,255,.35);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:#eaf6ff;
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;touch-action:none}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
  .hidden{display:none !important}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  .topbar{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:6px 12px;min-width:66px;text-align:center;backdrop-filter:blur(6px)}
  .stat .label{display:block;font-size:9px;letter-spacing:.18em;opacity:.6}
  .stat span:last-child{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
  #waveNum{color:var(--neon)} #levelNum{color:var(--neon2)}
  #killNum{color:var(--hot)} #fpsNum{color:var(--good)} #goldNum{color:var(--gold)}
  .stat.hidden{display:none}

  #bottom{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(560px,72vw)}
  .bar{position:relative;height:20px;border-radius:10px;overflow:hidden;
    background:rgba(4,8,16,.75);border:1px solid var(--line);margin-bottom:7px}
  .bar > div{position:absolute;inset:0;width:100%;transform-origin:left center;
    transition:transform .12s ease-out}
  #hpFill{background:linear-gradient(90deg,#ff2d6f,#ff7a4d)}
  .bar.xp{height:9px}
  #xpFill{background:linear-gradient(90deg,var(--neon),var(--neon2))}
  #hpText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;letter-spacing:.08em;text-shadow:0 1px 3px #000}
  /* rustningsnivån sitter i hälsobalken, till höger om siffrorna */
  #armTag{position:absolute;right:8px;top:0;bottom:0;display:flex;align-items:center;
    font-size:11px;font-weight:700;letter-spacing:.06em;color:#cfe0ff;
    text-shadow:0 1px 3px #000}
  #armTag.hidden{display:none}
  #dashRow{display:flex;gap:6px;justify-content:center;margin-top:2px}
  .pip{width:44px;height:6px;border-radius:3px;background:rgba(255,255,255,.13);
    border:1px solid rgba(77,243,255,.25)}
  .pip.on{background:var(--neon);box-shadow:0 0 10px var(--neon)}
  #fireRow{position:relative;height:15px;width:150px;margin:6px auto 0;border-radius:8px;
    overflow:hidden;background:rgba(4,8,16,.75);border:1px solid rgba(255,150,60,.4)}
  #fireFill{position:absolute;inset:0;transform-origin:left center;transform:scaleX(0);
    background:linear-gradient(90deg,#ff7a2d,#ffcc4d)}
  #fireRow span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:9px;letter-spacing:.18em;font-weight:700;text-shadow:0 1px 2px #000}
  #fireRow.ready{box-shadow:0 0 16px rgba(255,150,60,.7)}
  #parryRow{position:relative;height:15px;width:150px;margin:5px auto 0;border-radius:8px;
    overflow:hidden;background:rgba(4,8,16,.75);border:1px solid rgba(120,200,255,.4)}
  #parryFill{position:absolute;inset:0;transform-origin:left center;transform:scaleX(0);
    background:linear-gradient(90deg,#4dc3ff,#9ff0ff)}
  #parryRow span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:9px;letter-spacing:.14em;font-weight:700;text-shadow:0 1px 2px #000}
  #parryRow.ready{box-shadow:0 0 14px rgba(120,200,255,.6)}
  #parryRow.hidden{display:none}
  #comboRow{display:flex;gap:7px;justify-content:center;margin-top:7px}
  #comboRow i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,180,90,.3);transition:transform .1s}
  #comboRow i.lit{background:#ff9c3d;box-shadow:0 0 10px #ff9c3d;border-color:#ffcc4d}
  #comboRow i.next{background:var(--gold);box-shadow:0 0 18px var(--gold);
    border-color:#fff;animation:comboPulse .55s infinite alternate}
  @keyframes comboPulse{from{transform:scale(1)}to{transform:scale(1.45)}}

  /* uppdragsraden i äventyret */
  #objective{position:absolute;top:60px;left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:10px;background:var(--panel);
    border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;
    padding:6px 14px;backdrop-filter:blur(6px);white-space:nowrap}
  #objective.hidden{display:none}
  #objLabel{font-size:10px;letter-spacing:.2em;opacity:.7}
  #objValue{font-size:14px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
  #objective.done{border-left-color:var(--good)} #objective.done #objValue{color:var(--good)}

  #bossBar{position:absolute;top:76px;left:50%;transform:translateX(-50%);width:min(520px,70vw)}
  /* med uppdragsraden på plats får bosshälsan flytta ner */
  #hud.obj #bossBar{top:112px}
  #bossBar .name{font-size:11px;letter-spacing:.25em;text-align:center;margin-bottom:4px;
    color:var(--hot);text-shadow:0 0 12px var(--hot)}
  #bossBar .bar{height:14px;border-color:rgba(255,61,127,.5)}
  #bossFill{background:linear-gradient(90deg,#ff3d7f,#ffcc4d)}

  #minimap{position:absolute;right:16px;bottom:16px;width:160px;height:160px;border-radius:50%;
    border:1px solid var(--line);background:rgba(4,10,20,.6);backdrop-filter:blur(4px)}

  #crosshair{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;
    opacity:.85}
  #crosshair::before,#crosshair::after{content:"";position:absolute;background:var(--neon);
    box-shadow:0 0 6px var(--neon)}
  #crosshair::before{left:50%;top:0;width:2px;height:8px;margin-left:-1px}
  #crosshair::after{left:50%;bottom:0;width:2px;height:8px;margin-left:-1px}
  #crossdot{position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px 0 0 -2px;
    border-radius:50%;background:#fff;box-shadow:0 0 8px var(--neon)}

  /* skadesiffror: en pool av element som projiceras från världen varje bildruta */
  #floaters{position:absolute;inset:0;overflow:hidden}
  .flt{position:absolute;left:0;top:0;font-weight:900;font-size:19px;line-height:1;
    letter-spacing:.02em;text-shadow:0 2px 6px rgba(0,0,0,.85);will-change:transform,opacity;
    opacity:0;white-space:nowrap;font-variant-numeric:tabular-nums}
  .flt.crit{font-size:24px;color:var(--gold)}
  .flt.norm{color:#fff}

  #vignette{position:absolute;inset:0;opacity:0;background:radial-gradient(ellipse at center,
    transparent 42%, rgba(255,20,60,.55) 100%);transition:opacity .18s}

  #banner{position:absolute;left:50%;top:26%;transform:translate(-50%,-50%);text-align:center;
    font-size:46px;font-weight:800;letter-spacing:.2em;opacity:0;
    text-shadow:0 0 30px var(--neon);white-space:nowrap}
  #banner .sub{display:block;font-size:14px;letter-spacing:.35em;opacity:.75;margin-top:6px;
    font-weight:500;text-shadow:none}

  #toasts{position:absolute;left:22px;bottom:22px;display:flex;flex-direction:column-reverse;gap:5px}
  .toast{background:var(--panel);border-left:3px solid var(--gold);padding:6px 12px;border-radius:4px;
    font-size:12px;letter-spacing:.05em;animation:toastIn .25s ease-out}
  @keyframes toastIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}

  /* ---------- Touch ---------- */
  #touchUI{display:none}
  body.touch #touchUI{display:block}
  body.touch #crosshair{opacity:.7}

  #stick{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;
    border:2px solid rgba(77,243,255,.35);background:rgba(6,12,22,.32);
    opacity:0;transition:opacity .12s;pointer-events:none}
  #stick.on{opacity:1}
  #knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;
    border-radius:50%;background:rgba(77,243,255,.5);box-shadow:0 0 18px rgba(77,243,255,.5)}

  #tPad{position:absolute;right:14px;bottom:16px;width:210px;height:210px;pointer-events:none}
  .tBtn{position:absolute;pointer-events:auto;border-radius:50%;border:1px solid var(--line);
    background:rgba(10,16,28,.62);color:#eaf6ff;font-size:24px;line-height:1;
    display:flex;align-items:center;justify-content:center;
    -webkit-tap-highlight-color:transparent;backdrop-filter:blur(3px);
    transition:transform .08s,background .08s}
  .tBtn.held{transform:scale(.9);background:rgba(77,243,255,.4)}
  .tBtn--atk{right:0;bottom:34px;width:92px;height:92px;font-size:19px;font-weight:800;
    letter-spacing:.08em;border-color:rgba(255,61,127,.5);background:rgba(60,10,26,.6)}
  .tBtn--dash{right:96px;bottom:6px;width:66px;height:66px;font-size:12px;font-weight:800;
    letter-spacing:.08em}
  .tBtn--jump{right:8px;bottom:132px;width:66px;height:66px}
  .tBtn--fire{right:104px;bottom:82px;width:62px;height:62px;font-size:22px;
    border-color:rgba(255,150,60,.5)}
  .tBtn--fire.cool{opacity:.35}
  .tBtn--fire.hidden{display:none}
  .tBtn--parry{right:170px;bottom:60px;width:62px;height:62px;font-size:22px;
    border-color:rgba(120,200,255,.55)}
  .tBtn--parry.cool{opacity:.35}
  .tBtn--parry.hidden{display:none}

  /* HUD:en krymper och flyttar ihop sig på en telefon */
  @media (max-width:760px){
    #verTag{display:none}
    .topbar{top:8px;gap:5px;transform:translateX(-50%) scale(.82);transform-origin:top center}
    #minimap{width:96px;height:96px;right:10px;top:64px;bottom:auto}
    #objective{top:46px;transform:translateX(-50%) scale(.85)}
    #hud.obj #bossBar{top:92px}
    #bottom{width:min(300px,68vw);bottom:auto;top:112px;left:14px;transform:none}
    .bar{height:14px} .bar.xp{height:7px} #hpText{font-size:10px}
    .pip{width:30px;height:5px}
    #fireRow{width:120px;height:13px;margin-left:0}
    #banner{font-size:30px;top:34%}
    #toasts{bottom:auto;top:210px;left:14px}
    .wares{gap:8px} .ware{width:min(150px,42vw);padding:10px 8px 9px}
    .ware .icon{font-size:22px} .ware .desc{font-size:10px;min-height:28px}
    .cards{gap:10px} .card{width:min(260px,80vw);padding:14px 12px}
    .card .icon{font-size:30px;margin-bottom:6px}
    .keys{gap:6px} .key{padding:7px 10px;font-size:11px}
    .worlds,.modes{gap:12px}
    .world,.mode{width:min(300px,86vw);padding:16px 14px}
    .world .wDesc,.mode .wDesc{min-height:0}
    .screen{padding:18px 14px}
    .results{gap:8px} .result{padding:10px 14px;min-width:88px} .result .rv{font-size:20px}
  }

  /* ---------- Overlays ---------- */
  #overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,rgba(8,10,22,.78),rgba(2,3,8,.95));
    backdrop-filter:blur(7px);overflow-y:auto;-webkit-overflow-scrolling:touch}
  /* på en låg skärm måste innehållet få växa nedåt i stället för att kapas */
  @media (max-height:760px){#overlay{align-items:flex-start}}
  .screen{text-align:center;max-width:860px;padding:26px}
  .title{font-size:clamp(56px,11vw,120px);font-weight:900;letter-spacing:.1em;line-height:.95;
    background:linear-gradient(180deg,#fff,var(--neon) 55%,var(--neon2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 26px rgba(77,243,255,.45))}
  .subtitle{font-size:clamp(13px,2vw,18px);letter-spacing:.6em;opacity:.7;margin:2px 0 26px 10px}
  .betaTag{display:inline-block;vertical-align:middle;margin-left:14px;padding:4px 12px;
    border-radius:999px;font-size:11px;font-weight:800;letter-spacing:.22em;
    color:#04121a;background:linear-gradient(180deg,#ffe08a,var(--gold));
    box-shadow:0 0 22px rgba(255,204,77,.5);transform:translateY(-2px)}
  .betaNote{font-size:11px;letter-spacing:.12em;opacity:.5;margin:-14px 0 22px}
  #verTag{position:absolute;left:14px;top:14px;font-size:10px;letter-spacing:.2em;
    opacity:.35;font-weight:700}
  .keys{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:22px 0 26px}
  .key{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 14px;
    font-size:12px;letter-spacing:.06em;display:flex;align-items:center;gap:9px}
  .key b{background:rgba(77,243,255,.14);border:1px solid var(--line);border-radius:5px;
    padding:2px 8px;font-size:11px;font-weight:700;color:var(--neon)}
  .cta{pointer-events:auto;cursor:pointer;border:0;border-radius:12px;padding:16px 46px;
    font-size:17px;font-weight:800;letter-spacing:.2em;color:#04121a;
    background:linear-gradient(180deg,#8ff9ff,var(--neon));
    box-shadow:0 0 40px rgba(77,243,255,.45);transition:transform .12s,box-shadow .12s}
  .cta:hover{transform:translateY(-2px);box-shadow:0 0 60px rgba(77,243,255,.7)}
  .cta.alt{background:linear-gradient(180deg,#ffb3d1,var(--hot));color:#1a040c;margin-left:12px;
    box-shadow:0 0 40px rgba(255,61,127,.35)}
  .cta.alt:hover{box-shadow:0 0 60px rgba(255,61,127,.6)}
  .hint{margin-top:16px;font-size:11px;letter-spacing:.2em;opacity:.45}

  /* fortsätt-rutan när det finns en checkpoint */
  .resume{margin:0 0 24px;padding:18px 20px 14px;border-radius:14px;
    background:linear-gradient(165deg,rgba(58,44,12,.85),rgba(18,12,5,.9));
    border:1px solid rgba(255,204,77,.35);display:inline-block}
  .resume .cta{background:linear-gradient(180deg,#ffe08a,var(--gold));color:#1a1204;
    box-shadow:0 0 40px rgba(255,204,77,.45)}
  .resume .hint{margin-top:10px}

  /* världsval */
  .worlds{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:6px 0 22px}
  .world{pointer-events:auto;cursor:pointer;width:min(300px,42vw);padding:22px 18px 16px;
    border-radius:16px;text-align:center;position:relative;border:1px solid var(--line);
    transition:transform .14s,box-shadow .14s,border-color .14s}
  .world.wild{background:linear-gradient(165deg,rgba(20,60,35,.92),rgba(6,18,12,.95))}
  .world.city{background:linear-gradient(165deg,rgba(55,15,60,.92),rgba(10,6,24,.95))}
  .world:hover{transform:translateY(-6px)}
  .world.wild:hover{border-color:#4dffa6;box-shadow:0 16px 50px rgba(77,255,166,.25)}
  .world.city:hover{border-color:var(--hot);box-shadow:0 16px 50px rgba(255,61,127,.3)}
  .world .wIcon,.mode .wIcon{font-size:44px;line-height:1;margin-bottom:10px}
  .world .wName,.mode .wName{font-size:20px;font-weight:900;letter-spacing:.18em;margin-bottom:8px}
  .world.wild .wName{color:#4dffa6;text-shadow:0 0 18px rgba(77,255,166,.5)}
  .world.city .wName{color:var(--hot);text-shadow:0 0 18px rgba(255,61,127,.55)}
  .world .wDesc,.mode .wDesc{font-size:12px;line-height:1.55;opacity:.8;min-height:56px}
  .world .wTag,.mode .wTag{margin-top:10px;font-size:9px;letter-spacing:.25em;opacity:.55;
    border-top:1px solid rgba(255,255,255,.12);padding-top:8px}

  /* spelsättsval — samma kortform som världarna, egna färger */
  .modes{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin:6px 0 22px}
  .mode{pointer-events:auto;cursor:pointer;width:min(300px,42vw);padding:22px 18px 16px;
    border-radius:16px;text-align:center;position:relative;border:1px solid var(--line);
    transition:transform .14s,box-shadow .14s,border-color .14s}
  .mode.surv{background:linear-gradient(165deg,rgba(14,44,66,.92),rgba(5,12,22,.95))}
  .mode.adv{background:linear-gradient(165deg,rgba(58,44,12,.92),rgba(18,12,5,.95))}
  .mode:hover{transform:translateY(-6px)}
  .mode.surv:hover{border-color:var(--neon);box-shadow:0 16px 50px rgba(77,243,255,.28)}
  .mode.adv:hover{border-color:var(--gold);box-shadow:0 16px 50px rgba(255,204,77,.28)}
  .mode.surv .wName{color:var(--neon);text-shadow:0 0 18px rgba(77,243,255,.5)}
  .mode.adv .wName{color:var(--gold);text-shadow:0 0 18px rgba(255,204,77,.55)}
  .hint.back{pointer-events:auto;cursor:pointer;margin-top:10px}
  .hint.back:hover{opacity:.8}

  /* level up */
  .lvlTitle{font-size:15px;letter-spacing:.45em;color:var(--gold);
    text-shadow:0 0 22px rgba(255,204,77,.6);margin-bottom:4px}
  .lvlSub{font-size:34px;font-weight:900;letter-spacing:.1em;margin-bottom:26px}
  .cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
  .card{pointer-events:auto;cursor:pointer;width:220px;padding:20px 16px 18px;border-radius:14px;
    background:linear-gradient(180deg,rgba(20,26,44,.95),rgba(10,13,24,.95));
    border:1px solid var(--line);text-align:center;position:relative;
    transition:transform .14s,border-color .14s,box-shadow .14s}
  /* markerat kort: tydligt vald, väntar på bekräftelse */
  .card.picked{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold),0 14px 44px rgba(255,204,77,.35);
    transform:translateY(-6px)}
  .card.picked .name{color:var(--gold)}
  .cta[disabled]{opacity:.4;cursor:default;filter:grayscale(.6)}
  .cta[disabled]:hover{transform:none;box-shadow:0 0 40px rgba(77,243,255,.45)}
  .card:hover{transform:translateY(-6px);border-color:var(--neon);
    box-shadow:0 14px 40px rgba(77,243,255,.28)}
  .card .icon{font-size:38px;line-height:1;margin-bottom:10px}
  .card .name{font-size:15px;font-weight:800;letter-spacing:.08em;color:var(--neon);margin-bottom:8px}
  .card .desc{font-size:12px;line-height:1.5;opacity:.78}
  .card .num{position:absolute;top:8px;left:10px;font-size:10px;opacity:.4;letter-spacing:.1em}
  .card .lv{position:absolute;top:8px;right:10px;font-size:10px;color:var(--gold);letter-spacing:.1em}

  /* shop */
  .screen.shop{max-width:940px}
  .purse{display:inline-block;margin:-14px 0 20px;padding:7px 20px;border-radius:999px;
    background:rgba(255,204,77,.10);border:1px solid rgba(255,204,77,.35);
    font-size:12px;letter-spacing:.22em}
  .purse b{font-size:17px;color:var(--gold);margin-left:8px;font-variant-numeric:tabular-nums}
  .wares{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-bottom:26px}
  .ware{pointer-events:auto;cursor:pointer;width:186px;padding:14px 12px 12px;border-radius:12px;
    background:linear-gradient(180deg,rgba(20,26,44,.95),rgba(10,13,24,.95));
    border:1px solid var(--line);text-align:center;position:relative;
    transition:transform .12s,border-color .12s,box-shadow .12s}
  .ware:hover{transform:translateY(-4px);border-color:var(--gold);
    box-shadow:0 12px 34px rgba(255,204,77,.25)}
  .ware .icon{font-size:28px;line-height:1;margin-bottom:6px}
  .ware .name{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--gold);margin-bottom:5px}
  .ware .desc{font-size:11px;line-height:1.45;opacity:.75;min-height:32px}
  .ware .price{margin-top:9px;font-size:13px;font-weight:800;letter-spacing:.1em;
    border-top:1px solid rgba(255,255,255,.12);padding-top:7px}
  .ware .price i{color:var(--gold);font-style:normal;font-size:11px;margin-left:2px}
  .ware .own{position:absolute;top:8px;right:10px;font-size:10px;letter-spacing:.1em;opacity:.6}
  /* har man inte råd syns varan ändå — man ska se vad man sparar till */
  .ware.poor{opacity:.42;cursor:not-allowed}
  .ware.poor:hover{transform:none;border-color:var(--line);box-shadow:none}
  .ware.sold{opacity:.3;cursor:default}
  .ware.sold:hover{transform:none;border-color:var(--line);box-shadow:none}

  /* game over */
  .goTitle{font-size:clamp(44px,9vw,86px);font-weight:900;letter-spacing:.12em;color:var(--hot);
    text-shadow:0 0 40px rgba(255,61,127,.6)}
  .results{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:26px 0 30px}
  .result{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 22px;min-width:110px}
  .result .rl{font-size:10px;letter-spacing:.2em;opacity:.55;margin-bottom:5px}
  .result .rv{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
  #loadErr{max-width:620px;font-size:13px;line-height:1.6;opacity:.85}
</style>
</head>

<script>
// ═══ math.js ═══
// Små matte-hjälpare: skalärer, vektorer och 4x4-matriser (kolumn-major, som WebGL vill ha dem).

const TAU = Math.PI * 2;
const DEG = Math.PI / 180;

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const sign = (v) => (v < 0 ? -1 : 1);

function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}

// Rör sig mot ett mål med konstant hastighet per sekund.
function approach(cur, target, rate) {
  if (cur < target) return Math.min(cur + rate, target);
  return Math.max(cur - rate, target);
}

// Ramhastighetsoberoende utjämning: t = hur mycket som är kvar efter 1 sekund.
function damp(cur, target, smoothing, dt) {
  return lerp(target, cur, Math.pow(smoothing, dt));
}

const rand = (a = 1, b) => (b === undefined ? Math.random() * a : a + Math.random() * (b - a));
const randInt = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = (arr) => arr[(Math.random() * arr.length) | 0];

// Kortaste vinkelskillnad, resultat i [-PI, PI].
function angleDelta(a, b) {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU;
  if (d < -Math.PI) d += TAU;
  return d;
}

const v3 = (x = 0, y = 0, z = 0) => ({ x, y, z });
const distXZ = (a, b) => Math.hypot(a.x - b.x, a.z - b.z);
const dist3 = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);

function hsl(h, s, l) {
  // h,s,l i 0..1 -> [r,g,b]
  const f = (n) => {
    const k = (n + h * 12) % 12;
    const a = s * Math.min(l, 1 - l);
    return l - a * Math.max(-1, Math.min(k - 3, Math.min(9 - k, 1)));
  };
  return [f(0), f(8), f(4)];
}

// ---------------------------------------------------------------- mat4

const mat4 = () => new Float32Array(16);

function identity(o) {
  o.fill(0); o[0] = o[5] = o[10] = o[15] = 1; return o;
}

function perspective(o, fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2);
  o.fill(0);
  o[0] = f / aspect; o[5] = f; o[11] = -1;
  o[10] = (far + near) / (near - far);
  o[14] = (2 * far * near) / (near - far);
  return o;
}

function lookAt(o, eye, center, up) {
  let zx = eye.x - center.x, zy = eye.y - center.y, zz = eye.z - center.z;
  let l = Math.hypot(zx, zy, zz) || 1;
  zx /= l; zy /= l; zz /= l;
  let xx = up.y * zz - up.z * zy, xy = up.z * zx - up.x * zz, xz = up.x * zy - up.y * zx;
  l = Math.hypot(xx, xy, xz) || 1;
  xx /= l; xy /= l; xz /= l;
  const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
  o[0] = xx; o[1] = yx; o[2] = zx; o[3] = 0;
  o[4] = xy; o[5] = yy; o[6] = zy; o[7] = 0;
  o[8] = xz; o[9] = yz; o[10] = zz; o[11] = 0;
  o[12] = -(xx * eye.x + xy * eye.y + xz * eye.z);
  o[13] = -(yx * eye.x + yy * eye.y + yz * eye.z);
  o[14] = -(zx * eye.x + zy * eye.y + zz * eye.z);
  o[15] = 1;
  return o;
}

function multiply(o, a, b) {
  for (let c = 0; c < 4; c++) {
    const b0 = b[c * 4], b1 = b[c * 4 + 1], b2 = b[c * 4 + 2], b3 = b[c * 4 + 3];
    o[c * 4]     = a[0] * b0 + a[4] * b1 + a[8]  * b2 + a[12] * b3;
    o[c * 4 + 1] = a[1] * b0 + a[5] * b1 + a[9]  * b2 + a[13] * b3;
    o[c * 4 + 2] = a[2] * b0 + a[6] * b1 + a[10] * b2 + a[14] * b3;
    o[c * 4 + 3] = a[3] * b0 + a[7] * b1 + a[11] * b2 + a[15] * b3;
  }
  return o;
}

function invert(o, m) {
  const a00 = m[0], a01 = m[1], a02 = m[2], a03 = m[3];
  const a10 = m[4], a11 = m[5], a12 = m[6], a13 = m[7];
  const a20 = m[8], a21 = m[9], a22 = m[10], a23 = m[11];
  const a30 = m[12], a31 = m[13], a32 = m[14], a33 = m[15];
  const b00 = a00 * a11 - a01 * a10, b01 = a00 * a12 - a02 * a10;
  const b02 = a00 * a13 - a03 * a10, b03 = a01 * a12 - a02 * a11;
  const b04 = a01 * a13 - a03 * a11, b05 = a02 * a13 - a03 * a12;
  const b06 = a20 * a31 - a21 * a30, b07 = a20 * a32 - a22 * a30;
  const b08 = a20 * a33 - a23 * a30, b09 = a21 * a32 - a22 * a31;
  const b10 = a21 * a33 - a23 * a31, b11 = a22 * a33 - a23 * a32;
  let det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;
  if (!det) return identity(o);
  det = 1 / det;
  o[0] = (a11 * b11 - a12 * b10 + a13 * b09) * det;
  o[1] = (a02 * b10 - a01 * b11 - a03 * b09) * det;
  o[2] = (a31 * b05 - a32 * b04 + a33 * b03) * det;
  o[3] = (a22 * b04 - a21 * b05 - a23 * b03) * det;
  o[4] = (a12 * b08 - a10 * b11 - a13 * b07) * det;
  o[5] = (a00 * b11 - a02 * b08 + a03 * b07) * det;
  o[6] = (a32 * b02 - a30 * b05 - a33 * b01) * det;
  o[7] = (a20 * b05 - a22 * b02 + a23 * b01) * det;
  o[8] = (a10 * b10 - a11 * b08 + a13 * b06) * det;
  o[9] = (a01 * b08 - a00 * b10 - a03 * b06) * det;
  o[10] = (a30 * b04 - a31 * b02 + a33 * b00) * det;
  o[11] = (a21 * b02 - a20 * b04 - a23 * b00) * det;
  o[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det;
  o[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;
  o[14] = (a31 * b01 - a30 * b03 - a32 * b00) * det;
  o[15] = (a20 * b03 - a21 * b01 + a22 * b00) * det;
  return o;
}

// ═══ noise.js ═══
// Deterministiskt värdebrus + världens höjdfunktion.

const SEED = 20260813;

function hash2(ix, iy) {
  let h = Math.imul(ix | 0, 374761393) + Math.imul(iy | 0, 668265263) + SEED;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function valueNoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy);
  const c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
}

/** Fraktalt brus, resultat ungefär i [-1, 1]. */
function fbm(x, y, octaves = 4) {
  let sum = 0, amp = 1, norm = 0, fx = x, fy = y;
  for (let i = 0; i < octaves; i++) {
    sum += (valueNoise(fx, fy) * 2 - 1) * amp;
    norm += amp;
    amp *= 0.5;
    fx = fx * 2.03 + 17.3; fy = fy * 2.03 - 9.1;
  }
  return sum / norm;
}

const WATER_LEVEL = 0;
const ARENA_RADIUS = 112;   // så långt spelaren kommer
const WORLD_SIZE = 300;     // terrängmeshens sida

// ------------------------------------------------------------ världsväxeln

let WORLD_ID = 'wild';      // 'wild' = Vildheim, 'city' = Neotropolis
function setWorld(id) { WORLD_ID = id; }

// ------------------------------------------------------------- årstiden
//
// Vildheim har fyra årstider som slumpas när en körning börjar. Årstiden
// styr både markens färg (terrängmeshen) och växtligheten (utplaceringen),
// så den måste bo här där båda kommer åt den. Byter man årstid måste
// världen byggas om — se `Renderer.buildWorld`.

const SEASONS = {
  spring: {
    name: 'Spring', grass: [0.24, 0.46, 0.20], grass2: [0.35, 0.56, 0.26],
    leaf: [1.05, 1.08, 0.95], flowers: 1.7, snow: 0, bare: 0,
    // ljusa, nyutslagna löv och marken full av blom
  },
  summer: {
    name: 'Summer', grass: [0.20, 0.40, 0.20], grass2: [0.28, 0.47, 0.24],
    leaf: [0.95, 1.0, 0.9], flowers: 1.0, snow: 0, bare: 0,
  },
  autumn: {
    name: 'Autumn', grass: [0.38, 0.36, 0.18], grass2: [0.46, 0.41, 0.21],
    leaf: [1.5, 0.85, 0.45], flowers: 0.45, snow: 0, bare: 0.25,
    // lövverket går i rost och en fjärdedel av träden har fällt bladen
  },
  winter: {
    name: 'Winter', grass: [0.62, 0.68, 0.72], grass2: [0.72, 0.77, 0.82],
    leaf: [0.7, 0.78, 0.85], flowers: 0.05, snow: 1, bare: 0.6,
  },
};

let SEASON = SEASONS.summer;
let SEASON_ID = 'summer';
function setSeason(id) {
  if (!SEASONS[id]) return;
  SEASON_ID = id;
  SEASON = SEASONS[id];
}
function randomSeasonId() {
  const keys = Object.keys(SEASONS);
  return keys[Math.floor(Math.random() * keys.length)];
}

// ------------------------------------------------------- Neotropolis (stad)

const CITY_CELL = 26;       // kvartersstorlek — gator ligger på cellgränserna
const CITY_N = Math.floor(WORLD_SIZE / CITY_CELL);

/** Deterministisk byggnad för kvarterscell (i, j), eller null för gata/torg. */
function cityBuildingOfCell(i, j) {
  if (i < 0 || j < 0 || i >= CITY_N || j >= CITY_N) return null;
  const r = hash2(i * 13 + 101, j * 17 + 57);
  const cx = -WORLD_SIZE / 2 + (i + 0.5) * CITY_CELL;
  const cz = -WORLD_SIZE / 2 + (j + 0.5) * CITY_CELL;
  const dc = Math.hypot(cx, cz);
  if (dc < 22) return null;                       // startplazan hålls öppen
  if (r < 0.24 && dc < 96) return null;           // torg och parker
  const r2 = hash2(i * 29 - 11, j * 31 + 5);
  const r3 = hash2(i * 7 + 913, j * 3 - 401);
  const hx = 6 + r2 * 4.5;
  const hz = 6 + r3 * 4.5;
  let h = 7 + Math.floor(r * 5) * 4 + r2 * 14;
  if (dc > 96) h += (dc - 96) * 1.6;              // skyskrapemur stänger arenan
  const ox = (r3 - 0.5) * (CITY_CELL - 2 * hx - 5);
  const oz = (r2 - 0.5) * (CITY_CELL - 2 * hz - 5);
  // Höga hus smalnar av i avsatser. Avsatserna bor HÄR — utseendet
  // (renderer), kollisionen (terrain) och markhöjden (nedan) läser samma
  // lista, annars glider de isär och man går på luft vid en avsats.
  const tiers = [];
  if (h > 46) {
    tiers.push({ f: 1, top: h * 0.52 }, { f: 0.78, top: h * 0.8 }, { f: 0.6, top: h });
  } else if (h > 26) {
    tiers.push({ f: 1, top: h * 0.62 }, { f: 0.76, top: h });
  } else {
    tiers.push({ f: 1, top: h });
  }
  return { x: cx + ox, z: cz + oz, hx, hz, h, neon: (r * 7.31) % 1, tiers };
}

/** Byggnaden vars kvarter täcker (x, z), eller null. */
function cityBuildingAt(x, z) {
  return cityBuildingOfCell(
    Math.floor((x + WORLD_SIZE / 2) / CITY_CELL),
    Math.floor((z + WORLD_SIZE / 2) / CITY_CELL),
  );
}

function cityBuildings() {
  const out = [];
  for (let i = 0; i < CITY_N; i++) {
    for (let j = 0; j < CITY_N; j++) {
      const b = cityBuildingOfCell(i, j);
      if (b) out.push(b);
    }
  }
  return out;
}

/** Markhöjd i världskoordinater. I staden ingår hustaken (väggar är kollisioner). */
function terrainHeight(x, z) {
  if (WORLD_ID === 'city') {
    const b = cityBuildingAt(x, z);
    if (b && Math.abs(x - b.x) < b.hx && Math.abs(z - b.z) < b.hz) {
      // uppifrån och ner: högsta avsats vars fotavtryck täcker punkten
      for (let i = b.tiers.length - 1; i >= 0; i--) {
        const t = b.tiers[i];
        if (Math.abs(x - b.x) < b.hx * t.f && Math.abs(z - b.z) < b.hz * t.f) return t.top;
      }
      return b.tiers[0].top;
    }
    return 0;
  }
  return wildHeight(x, z);
}

/** Vildheims kuperade terräng. */
function wildHeight(x, z) {
  const d = Math.hypot(x, z);
  let h = fbm(x * 0.0105, z * 0.0105, 4) * 15.5;
  h += fbm(x * 0.045 + 31.7, z * 0.045 - 12.3, 3) * 2.4;
  h += 2.2;
  // Startområdet planas ut så man inte föds i en backe.
  h = lerp(3.2, h, smoothstep(9, 44, d));
  // Bergsrand som stänger arenan.
  if (d > 96) {
    const t = (d - 96) / 46;
    h += t * t * 86;
  }
  return h;
}

/** Marknormal via differenser. */
function terrainNormal(x, z, out = { x: 0, y: 1, z: 0 }) {
  const e = 0.75;
  const hl = terrainHeight(x - e, z), hr = terrainHeight(x + e, z);
  const hd = terrainHeight(x, z - e), hu = terrainHeight(x, z + e);
  let nx = hl - hr, ny = 2 * e, nz = hd - hu;
  const l = Math.hypot(nx, ny, nz) || 1;
  out.x = nx / l; out.y = ny / l; out.z = nz / l;
  return out;
}

/** Lutning 0 (platt) .. 1 (lodrätt). */
function terrainSlope(x, z) {
  const n = terrainNormal(x, z);
  return clamp(1 - n.y, 0, 1);
}

/** Håller en position innanför arenan. Muterar och returnerar p. */
function clampToArena(p) {
  const d = Math.hypot(p.x, p.z);
  if (d > ARENA_RADIUS) {
    const s = ARENA_RADIUS / d;
    p.x *= s; p.z *= s;
  }
  return p;
}

// ═══ meshes.js ═══
// Proceduella meshar. Alla är centrerade i origo och 1 enhet stora,
// så instansens skala motsvarar objektets faktiska storlek.

function mesh(positions, normals, indices) {
  return {
    positions: new Float32Array(positions),
    normals: new Float32Array(normals),
    indices: new Uint16Array(indices),
  };
}

function sphere(seg = 18, rings = 12) {
  const p = [], n = [], idx = [];
  for (let r = 0; r <= rings; r++) {
    const phi = (r / rings) * Math.PI;
    for (let s = 0; s <= seg; s++) {
      const th = (s / seg) * TAU;
      const x = Math.sin(phi) * Math.cos(th), y = Math.cos(phi), z = Math.sin(phi) * Math.sin(th);
      p.push(x * 0.5, y * 0.5, z * 0.5);
      n.push(x, y, z);
    }
  }
  for (let r = 0; r < rings; r++) {
    for (let s = 0; s < seg; s++) {
      const a = r * (seg + 1) + s, b = a + seg + 1;
      idx.push(a, b, a + 1, a + 1, b, b + 1);
    }
  }
  return mesh(p, n, idx);
}

function box() {
  const p = [], n = [], idx = [];
  const faces = [
    [[1, 0, 0], [0, 1, 0], [0, 0, 1]],
    [[-1, 0, 0], [0, 1, 0], [0, 0, -1]],
    [[0, 1, 0], [0, 0, 1], [1, 0, 0]],
    [[0, -1, 0], [0, 0, -1], [1, 0, 0]],
    [[0, 0, 1], [0, 1, 0], [-1, 0, 0]],
    [[0, 0, -1], [0, 1, 0], [1, 0, 0]],
  ];
  for (const [nr, up, right] of faces) {
    const base = p.length / 3;
    for (const [su, sr] of [[-1, -1], [-1, 1], [1, 1], [1, -1]]) {
      p.push(
        (nr[0] + up[0] * su + right[0] * sr) * 0.5,
        (nr[1] + up[1] * su + right[1] * sr) * 0.5,
        (nr[2] + up[2] * su + right[2] * sr) * 0.5,
      );
      n.push(nr[0], nr[1], nr[2]);
    }
    idx.push(base, base + 1, base + 2, base, base + 2, base + 3);
  }
  return mesh(p, n, idx);
}

function cylinder(seg = 14, topScale = 1) {
  const p = [], n = [], idx = [];
  for (let s = 0; s <= seg; s++) {
    const th = (s / seg) * TAU, cx = Math.cos(th), cz = Math.sin(th);
    p.push(cx * 0.5 * topScale, 0.5, cz * 0.5 * topScale);
    n.push(cx, 0.25, cz);
    p.push(cx * 0.5, -0.5, cz * 0.5);
    n.push(cx, 0.25, cz);
  }
  for (let s = 0; s < seg; s++) {
    const a = s * 2;
    idx.push(a, a + 1, a + 2, a + 2, a + 1, a + 3);
  }
  for (const y of [0.5, -0.5]) {
    const base = p.length / 3;
    const r = y > 0 ? 0.5 * topScale : 0.5;
    p.push(0, y, 0); n.push(0, Math.sign(y), 0);
    for (let s = 0; s <= seg; s++) {
      const th = (s / seg) * TAU;
      p.push(Math.cos(th) * r, y, Math.sin(th) * r);
      n.push(0, Math.sign(y), 0);
    }
    for (let s = 0; s < seg; s++) {
      if (y > 0) idx.push(base, base + 1 + s, base + 2 + s);
      else idx.push(base, base + 2 + s, base + 1 + s);
    }
  }
  return mesh(p, n, idx);
}

function cone(seg = 14) {
  const p = [], n = [], idx = [];
  for (let s = 0; s < seg; s++) {
    const t0 = (s / seg) * TAU, t1 = ((s + 1) / seg) * TAU, tm = (t0 + t1) / 2;
    const base = p.length / 3;
    p.push(0, 0.5, 0, Math.cos(t0) * 0.5, -0.5, Math.sin(t0) * 0.5, Math.cos(t1) * 0.5, -0.5, Math.sin(t1) * 0.5);
    const nx = Math.cos(tm) * 0.89, nz = Math.sin(tm) * 0.89;
    for (let k = 0; k < 3; k++) n.push(nx, 0.45, nz);
    idx.push(base, base + 1, base + 2);
  }
  const base = p.length / 3;
  p.push(0, -0.5, 0); n.push(0, -1, 0);
  for (let s = 0; s <= seg; s++) {
    const th = (s / seg) * TAU;
    p.push(Math.cos(th) * 0.5, -0.5, Math.sin(th) * 0.5);
    n.push(0, -1, 0);
  }
  for (let s = 0; s < seg; s++) idx.push(base, base + 2 + s, base + 1 + s);
  return mesh(p, n, idx);
}

/** Platt skiva i XZ-planet — används för skuggor och markringar. */
function disc(seg = 20) {
  const p = [0, 0, 0], n = [0, 1, 0], idx = [];
  for (let s = 0; s <= seg; s++) {
    const th = (s / seg) * TAU;
    p.push(Math.cos(th) * 0.5, 0, Math.sin(th) * 0.5);
    n.push(0, 1, 0);
  }
  for (let s = 0; s < seg; s++) idx.push(0, s + 2, s + 1);
  return mesh(p, n, idx);
}

/** Oktaeder — kantig kristall för orbs och pickups. */
function octahedron() {
  const p = [], n = [], idx = [];
  const v = [[0, 0.5, 0], [0.5, 0, 0], [0, 0, 0.5], [-0.5, 0, 0], [0, 0, -0.5], [0, -0.5, 0]];
  const tris = [[0, 1, 2], [0, 2, 3], [0, 3, 4], [0, 4, 1], [5, 2, 1], [5, 3, 2], [5, 4, 3], [5, 1, 4]];
  for (const t of tris) {
    const base = p.length / 3;
    const a = v[t[0]], b = v[t[1]], c = v[t[2]];
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
    const wx = c[0] - a[0], wy = c[1] - a[1], wz = c[2] - a[2];
    let nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx;
    const l = Math.hypot(nx, ny, nz) || 1;
    nx /= l; ny /= l; nz /= l;
    for (const q of [a, b, c]) { p.push(q[0], q[1], q[2]); n.push(nx, ny, nz); }
    idx.push(base, base + 1, base + 2);
  }
  return mesh(p, n, idx);
}

/** Rutnätsplan i XZ, 1x1 enheter, för vattenytan. */
function grid(res = 48) {
  const p = [], n = [], idx = [];
  for (let z = 0; z <= res; z++) {
    for (let x = 0; x <= res; x++) {
      p.push(x / res - 0.5, 0, z / res - 0.5);
      n.push(0, 1, 0);
    }
  }
  for (let z = 0; z < res; z++) {
    for (let x = 0; x < res; x++) {
      const a = z * (res + 1) + x, b = a + res + 1;
      idx.push(a, b, a + 1, a + 1, b, b + 1);
    }
  }
  return mesh(p, n, idx);
}

// ═══ gl.js ═══
// Tunt lager ovanpå WebGL2: program, meshar och instansbatchar.

function initGL(canvas) {
  const gl = canvas.getContext('webgl2', {
    antialias: true, alpha: false, depth: true, stencil: false,
    powerPreference: 'high-performance',
  });
  if (!gl) throw new Error('This browser does not support WebGL2.');
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);
  gl.cullFace(gl.BACK);
  return gl;
}

function compile(gl, type, src, name) {
  const sh = gl.createShader(type);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(sh);
    console.error(`Shaderfel i ${name}:\n${log}`);
    throw new Error(`${name}: ${log}`);
  }
  return sh;
}

function makeProgram(gl, vsSrc, fsSrc, name = 'program') {
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl, gl.VERTEX_SHADER, vsSrc, name + '.vert'));
  gl.attachShader(p, compile(gl, gl.FRAGMENT_SHADER, fsSrc, name + '.frag'));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
    throw new Error(`${name} länkfel: ${gl.getProgramInfoLog(p)}`);
  }
  const cache = new Map();
  return {
    prog: p,
    use() { gl.useProgram(p); return this; },
    loc(n) {
      if (!cache.has(n)) cache.set(n, gl.getUniformLocation(p, n));
      return cache.get(n);
    },
    m4(n, v) { gl.uniformMatrix4fv(this.loc(n), false, v); return this; },
    f(n, v) { gl.uniform1f(this.loc(n), v); return this; },
    v2(n, a, b) { gl.uniform2f(this.loc(n), a, b); return this; },
    v3(n, a, b, c) {
      if (Array.isArray(a)) gl.uniform3f(this.loc(n), a[0], a[1], a[2]);
      else gl.uniform3f(this.loc(n), a, b, c);
      return this;
    },
  };
}

function attrib(gl, loc, size, stride, offset, divisor) {
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, size, gl.FLOAT, false, stride, offset);
  if (divisor) gl.vertexAttribDivisor(loc, divisor);
}

/** Statisk mesh med position (0), normal (1) och valfri färg (2). */
function uploadMesh(gl, m) {
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const put = (data, loc, size) => {
    const b = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, b);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
    attrib(gl, loc, size, 0, 0, 0);
  };
  put(m.positions, 0, 3);
  put(m.normals, 1, 3);
  if (m.colors) put(m.colors, 2, 3);
  const ebo = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ebo);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, m.indices, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return {
    vao,
    count: m.indices.length,
    type: m.indices instanceof Uint32Array ? gl.UNSIGNED_INT : gl.UNSIGNED_SHORT,
    draw() {
      gl.bindVertexArray(vao);
      gl.drawElements(gl.TRIANGLES, this.count, this.type, 0);
    },
  };
}

// Per instans: pos(3) skala(3) färg(3) rotation(3) glöd(1) = 13 flyttal.
const INST_FLOATS = 14;   // 14:e = vindkänslighet, se INST_VS

class InstancedBatch {
  constructor(gl, m, capacity = 256) {
    this.gl = gl;
    this.capacity = capacity;
    this.count = 0;
    this.data = new Float32Array(capacity * INST_FLOATS);
    this.indexCount = m.indices.length;
    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);

    const put = (data, loc, size) => {
      const b = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, b);
      gl.bufferData(gl.ARRAY_BUFFER, data, gl.STATIC_DRAW);
      attrib(gl, loc, size, 0, 0, 0);
    };
    put(m.positions, 0, 3);
    put(m.normals, 1, 3);

    const ebo = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ebo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, m.indices, gl.STATIC_DRAW);

    this.ibo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.ibo);
    gl.bufferData(gl.ARRAY_BUFFER, this.data.byteLength, gl.DYNAMIC_DRAW);
    const st = INST_FLOATS * 4;
    attrib(gl, 2, 3, st, 0, 1);
    attrib(gl, 3, 3, st, 12, 1);
    attrib(gl, 4, 3, st, 24, 1);
    attrib(gl, 5, 3, st, 36, 1);
    attrib(gl, 6, 1, st, 48, 1);
    attrib(gl, 7, 1, st, 52, 1);
    gl.bindVertexArray(null);
  }

  clear() { this.count = 0; this.dirty = true; return this; }

  grow() {
    const gl = this.gl;
    this.capacity *= 2;
    const next = new Float32Array(this.capacity * INST_FLOATS);
    next.set(this.data);
    this.data = next;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.ibo);
    gl.bufferData(gl.ARRAY_BUFFER, next.byteLength, gl.DYNAMIC_DRAW);
  }

  /**
   * rot är [x,y,z] i radianer; glow 0..1 lägger till egenljus.
   * sway > 0 låter vinden böja objektet — 0 för allt som ska stå stilla.
   */
  push(x, y, z, sx, sy, sz, col, rx = 0, ry = 0, rz = 0, glow = 0, sway = 0) {
    if (this.count >= this.capacity) this.grow();
    const d = this.data;
    let o = this.count * INST_FLOATS;
    d[o] = x; d[o + 1] = y; d[o + 2] = z;
    d[o + 3] = sx; d[o + 4] = sy; d[o + 5] = sz;
    d[o + 6] = col[0]; d[o + 7] = col[1]; d[o + 8] = col[2];
    d[o + 9] = rx; d[o + 10] = ry; d[o + 11] = rz;
    d[o + 12] = glow;
    d[o + 13] = sway;
    this.count++;
    this.dirty = true;
  }

  draw() {
    if (!this.count) return;
    const gl = this.gl;
    gl.bindVertexArray(this.vao);
    if (this.dirty) {
      gl.bindBuffer(gl.ARRAY_BUFFER, this.ibo);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.data, 0, this.count * INST_FLOATS);
      this.dirty = false;
    }
    gl.drawElementsInstanced(gl.TRIANGLES, this.indexCount, gl.UNSIGNED_SHORT, 0, this.count);
  }
}

// Per partikel: pos(3) storlek(1) färg(4) = 8 flyttal.
const PART_FLOATS = 8;

class BillboardBatch {
  constructor(gl, capacity = 2048) {
    this.gl = gl;
    this.capacity = capacity;
    this.count = 0;
    this.data = new Float32Array(capacity * PART_FLOATS);
    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);

    const quad = new Float32Array([-1, -1, 1, -1, 1, 1, -1, 1]);
    const vb = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vb);
    gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);
    attrib(gl, 0, 2, 0, 0, 0);

    const ebo = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ebo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array([0, 1, 2, 0, 2, 3]), gl.STATIC_DRAW);

    this.ibo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, this.ibo);
    gl.bufferData(gl.ARRAY_BUFFER, this.data.byteLength, gl.DYNAMIC_DRAW);
    const st = PART_FLOATS * 4;
    attrib(gl, 1, 3, st, 0, 1);
    attrib(gl, 2, 1, st, 12, 1);
    attrib(gl, 3, 4, st, 16, 1);
    gl.bindVertexArray(null);
  }

  clear() { this.count = 0; this.dirty = true; return this; }

  grow() {
    const gl = this.gl;
    this.capacity *= 2;
    const next = new Float32Array(this.capacity * PART_FLOATS);
    next.set(this.data);
    this.data = next;
    gl.bindBuffer(gl.ARRAY_BUFFER, this.ibo);
    gl.bufferData(gl.ARRAY_BUFFER, next.byteLength, gl.DYNAMIC_DRAW);
  }

  push(x, y, z, size, r, g, b, a) {
    if (this.count >= this.capacity) this.grow();
    const d = this.data;
    let o = this.count * PART_FLOATS;
    d[o] = x; d[o + 1] = y; d[o + 2] = z; d[o + 3] = size;
    d[o + 4] = r; d[o + 5] = g; d[o + 6] = b; d[o + 7] = a;
    this.count++;
    this.dirty = true;
  }

  draw() {
    if (!this.count) return;
    const gl = this.gl;
    gl.bindVertexArray(this.vao);
    if (this.dirty) {
      gl.bindBuffer(gl.ARRAY_BUFFER, this.ibo);
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, this.data, 0, this.count * PART_FLOATS);
      this.dirty = false;
    }
    gl.drawElementsInstanced(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0, this.count);
  }
}

// ═══ shaders.js ═══
// All GLSL på ett ställe. WebGL2 / GLSL ES 3.00.

const FOG = /* glsl */`
uniform vec3 uFogCol;
uniform vec2 uFog;            // x = startavstånd, y = slutavstånd
uniform float uFogHeight;     // hur snabbt diset tunnas ut uppåt
vec3 applyFog(vec3 col, float dist){
  return mix(col, uFogCol, smoothstep(uFog.x, uFog.y, dist));
}
/* Höjdberoende dis: tätt nere i dalarna och på gatunivå, tunnare högt upp.
   Det är den som ger djup åt landskapet.

   Tunningen räknas på MEDELHÖJDEN mellan ögat och punkten, inte på punktens
   egen höjd. Ljuset från en bergstopp har ju färdats hela vägen ner genom
   det låga diset för att nå en spelare som står på marken. Med bara punktens
   höjd slutade bergsranden döljas och lade sig som en mörk mur runt hela
   världen — det såg ut som att himlen blivit grå. */
vec3 applyFogH(vec3 col, float dist, float worldY){
  float f = smoothstep(uFog.x, uFog.y, dist);
  float avgY = max((worldY + uEye.y) * 0.5, 0.0);
  f *= exp(-avgY * uFogHeight);
  return mix(col, uFogCol, clamp(f, 0.0, 1.0));
}`;

const LIGHT = /* glsl */`
uniform vec3 uSunDir;         // enhetsvektor mot ljuset
uniform vec3 uSunCol;
uniform vec3 uAmb;
uniform vec3 uSkyTint;        // himlens färg ovanifrån
uniform vec3 uGroundTint;     // markens återkast underifrån
/* Halvsfärsljus: ytor som vetter uppåt får himlens färg, nedåtvända får
   markens återkast. Tinterna ligger kring 1,0 så helhetsljusstyrkan är
   densamma som förut — det här flyttar kulör, inte exponering. */
vec3 shade(vec3 n, vec3 albedo){
  float d = max(dot(n, uSunDir), 0.0);
  float wrap = dot(n, uSunDir) * 0.5 + 0.5;       // mjukt halvljus
  float sky = n.y * 0.5 + 0.5;                    // himmelsbidrag uppifrån
  vec3 ambient = uAmb * (0.55 + 0.45 * sky) * mix(uGroundTint, uSkyTint, sky);
  return albedo * (ambient + uSunCol * (d * 0.9 + wrap * 0.22));
}
/* Smal glansdager — får metall, neon och våta ytor att fånga ljuset. */
vec3 specular(vec3 n, vec3 view, float strength){
  vec3 hv = normalize(uSunDir + view);
  return uSunCol * pow(max(dot(n, hv), 0.0), 46.0) * strength;
}`;

const TERRAIN_VS = /* glsl */`#version 300 es
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNrm;
layout(location=2) in vec3 aCol;
uniform mat4 uVP;
out vec3 vN; out vec3 vC; out vec3 vW;
void main(){
  vN = aNrm; vC = aCol; vW = aPos;
  gl_Position = uVP * vec4(aPos, 1.0);
}`;

const TERRAIN_FS = /* glsl */`#version 300 es
precision highp float;
in vec3 vN; in vec3 vC; in vec3 vW;
uniform vec3 uEye;
uniform vec3 uPlayer;
uniform float uNight;
uniform float uCity;
${LIGHT}
${FOG}
out vec4 frag;
void main(){
  vec3 n = normalize(vN);
  vec3 col = shade(n, vC);
  if (uCity > 0.5) {
    // neonlinjer längs gatorna (kvartersgränserna) + svagt gatunät
    vec2 cellPos = fract((vW.xz + 150.0) / 26.0);
    vec2 lineDist = min(cellPos, 1.0 - cellPos) * 26.0;
    float line = smoothstep(0.55, 0.12, min(lineDist.x, lineDist.y));
    col += vec3(0.10, 0.65, 0.85) * line * 0.55;
    vec2 sub = fract(vW.xz / 3.25);
    vec2 sd = min(sub, 1.0 - sub) * 3.25;
    float subline = smoothstep(0.14, 0.04, min(sd.x, sd.y));
    col += vec3(0.30, 0.10, 0.45) * subline * 0.16;
  }
  // energilampa runt spelaren — bara i mörker, gör natten läsbar
  float lamp = 0.15 + uNight * 0.85;
  float d = length(vW.xz - uPlayer.xz);
  float ring = smoothstep(3.2, 2.2, abs(d - 2.6)) * 0.10;
  col += vec3(0.25, 0.85, 1.0) * ring * lamp;
  col += vec3(0.05, 0.22, 0.30) * max(0.0, 1.0 - d * 0.06) * 0.25 * uNight;
  frag = vec4(applyFogH(col, distance(vW, uEye), vW.y), 1.0);
}`;

// -------------------------------------------------------------- instansierat

const ROT = /* glsl */`
mat3 rotMat(vec3 r){
  float cx=cos(r.x), sx=sin(r.x), cy=cos(r.y), sy=sin(r.y), cz=cos(r.z), sz=sin(r.z);
  mat3 Rx = mat3(1.0,0.0,0.0,  0.0,cx,sx,  0.0,-sx,cx);
  mat3 Ry = mat3(cy,0.0,-sy,   0.0,1.0,0.0, sy,0.0,cy);
  mat3 Rz = mat3(cz,sz,0.0,   -sz,cz,0.0,  0.0,0.0,1.0);
  return Ry * Rx * Rz;
}`;

const INST_VS = /* glsl */`#version 300 es
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNrm;
layout(location=2) in vec3 iPos;
layout(location=3) in vec3 iScale;
layout(location=4) in vec3 iCol;
layout(location=5) in vec3 iRot;
layout(location=6) in float iGlow;
layout(location=7) in float iSway;
uniform mat4 uVP;
uniform float uTime;
uniform vec2 uWind;           // riktning × styrka
${ROT}
out vec3 vN; out vec3 vC; out vec3 vW; out float vGlow;
void main(){
  mat3 R = rotMat(iRot);
  vec3 world = R * (aPos * iScale) + iPos;

  /* Vind: böjningen växer med höjden över objektets fot, så stammen står
     stilla medan kronan vaggar. Fasen kommer ur objektets världsläge, så
     varje träd och grässtrå rör sig i sin egen takt i stället för att hela
     skogen svaja som en enda kropp. Byar rullar genom landskapet via en
     långsam våg i samma led som vinden blåser. */
  if (iSway > 0.0) {
    // t: 0 vid objektets fot, 1 vid dess topp — foten står stilla
    float t = clamp((world.y - iPos.y) / max(iScale.y, 0.001) + 0.5, 0.0, 1.0);
    float phase = iPos.x * 0.35 + iPos.z * 0.27;
    float gust = 0.65 + 0.35 * sin(uTime * 0.5 + (iPos.x + iPos.z) * 0.04);
    float bend = sin(uTime * 1.7 + phase) * 0.5 + sin(uTime * 2.9 + phase * 1.7) * 0.22;
    // iSway är utslaget i meter vid full vind
    world.xz += uWind * (iSway * t * gust * (0.55 + bend));
  }

  vN = normalize(R * (aNrm / max(abs(iScale), vec3(0.0005))));
  vC = iCol; vW = world; vGlow = iGlow;
  gl_Position = uVP * vec4(world, 1.0);
}`;

const INST_FS = /* glsl */`#version 300 es
precision highp float;
in vec3 vN; in vec3 vC; in vec3 vW; in float vGlow;
uniform vec3 uEye;
${LIGHT}
${FOG}
out vec4 frag;
void main(){
  vec3 n = normalize(vN);
  vec3 view = normalize(uEye - vW);
  vec3 col = shade(n, vC);
  float rim = pow(1.0 - max(dot(n, view), 0.0), 2.5);
  col += vC * rim * (0.35 + vGlow * 1.2);
  col += vC * vGlow * 1.35;
  // självlysande ytor behöver ingen dager — de lyser redan
  col += specular(n, view, 0.22 * (1.0 - min(vGlow, 1.0)));
  float dist = distance(vW, uEye);
  col = applyFogH(col, dist, vW.y);
  frag = vec4(col, 1.0);
}`;

const SKY_VS = /* glsl */`#version 300 es
out vec2 vNdc;
void main(){
  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));

const SKY_FS = /* glsl */`#version 300 es
precision highp float;
in vec2 vNdc;
uniform mat4 uInvVP;
uniform vec3 uEye;
uniform vec3 uSunDir;
uniform vec3 uSunCol;
uniform vec3 uSkyTop;
uniform vec3 uSkyHorizon;
uniform float uNight;
uniform float uTime;
uniform float uClouds;   // 0 = klart, 1 = molnigt
out vec4 frag;

float hash13(vec3 p){
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float hash12(vec2 p){
  vec3 q = fract(vec3(p.xyx) * 0.1031);
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}

float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash12(i), hash12(i + vec2(1,0)), u.x),
             mix(hash12(i + vec2(0,1)), hash12(i + vec2(1,1)), u.x), u.y);
}

/* Fyra oktaver räcker för moln som håller ihop både nära zenit och nere
   vid horisonten, där projektionen tänjs ut som mest. */
float fbm2(vec2 p){
  float sum = 0.0, amp = 0.5;
  for (int i = 0; i < 4; i++) { sum += vnoise(p) * amp; p = p * 2.03 + 11.7; amp *= 0.5; }
  return sum;
}

void main(){
  vec4 far = uInvVP * vec4(vNdc, 1.0, 1.0);
  vec3 dir = normalize(far.xyz / far.w - uEye);

  float h = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);
  vec3 col = mix(uSkyHorizon, uSkyTop, pow(h, 0.85));

  /* Moln: blickriktningen projiceras ner på ett plan högt över spelaren och
     bruset samplas där, så täcket ligger stilla i världen i stället för att
     följa med kameran. De driver sakta med tiden. */
  if (uClouds > 0.01 && dir.y > 0.10) {
    // Nämnaren MÅSTE klampas: nära horisonten går dir.xz/dir.y mot
    // oändligheten, bruset samplas i grus och himlen blir grå sörja i
    // stället för moln. Det såg ut som mulet väder över hela kartan.
    vec2 cp = dir.xz / max(dir.y, 0.22) * 0.30 + vec2(uTime * 0.0035, uTime * 0.0022);
    float c = fbm2(cp);
    // tunnare mot horisonten, där lagret ses nästan från sidan
    // Molnen håller sig till den övre himlen. Närmare horisonten tänjs
    // projektionen ut till stora suddiga fält som läser som mulet väder i
    // stället för som moln — där gör de mer skada än nytta.
    float band = smoothstep(0.12, 0.45, dir.y);
    // Tröskeln är högt satt med flit: bara brusets toppar blir moln, så
    // himlen förblir mest öppen och molnen läser som moln, inte som mulet.
    float cover = smoothstep(0.56, 0.85, c) * band * uClouds;
    // solsidan av molnen lyser upp, undersidan är grå
    float lit = smoothstep(0.0, 0.6, dot(normalize(vec3(dir.x, 0.35, dir.z)), uSunDir));
    vec3 cloudCol = mix(mix(uSkyHorizon * 1.3, vec3(1.0), 0.68), uSunCol * 0.85 + 0.3, lit * 0.5);
    col = mix(col, cloudCol, clamp(cover, 0.0, 0.82));
  }

  // stjärnor på natten
  if (uNight > 0.01) {
    vec3 g = floor(dir * 260.0);
    float s = hash13(g);
    float star = smoothstep(0.9975, 1.0, s) * smoothstep(-0.05, 0.35, dir.y);
    col += vec3(0.85, 0.92, 1.0) * star * uNight * 2.2;
  }

  // sol/måne med halo
  float sd = max(dot(dir, uSunDir), 0.0);
  col += uSunCol * pow(sd, 900.0) * 3.2;
  col += uSunCol * pow(sd, 22.0) * 0.30;
  col += uSunCol * pow(sd, 4.0) * 0.06;

  // horisontdis
  col = mix(col, uSkyHorizon, smoothstep(0.12, -0.02, dir.y));
  frag = vec4(col, 1.0);
}`;

const WATER_VS = /* glsl */`#version 300 es
layout(location=0) in vec3 aPos;
uniform mat4 uVP;
uniform float uTime;
uniform float uSize;
uniform float uLevel;
out vec3 vW; out vec3 vN;
void main(){
  vec3 p = vec3(aPos.x * uSize, uLevel, aPos.z * uSize);
  // tre långa dyningar plus två korta krusningar tvärs över dem
  float a = sin(p.x * 0.25 + uTime * 1.3) * 0.10;
  float b = sin(p.z * 0.31 - uTime * 1.1) * 0.09;
  float c = sin((p.x + p.z) * 0.13 + uTime * 0.7) * 0.07;
  float d = sin(p.x * 0.85 - p.z * 0.62 + uTime * 2.1) * 0.030;
  float e = sin(p.x * 1.31 + p.z * 1.05 - uTime * 2.7) * 0.022;
  p.y += a + b + c + d + e;
  float dx = cos(p.x * 0.25 + uTime * 1.3) * 0.025 + cos((p.x + p.z) * 0.13 + uTime * 0.7) * 0.009
           + cos(p.x * 0.85 - p.z * 0.62 + uTime * 2.1) * 0.026
           + cos(p.x * 1.31 + p.z * 1.05 - uTime * 2.7) * 0.029;
  float dz = cos(p.z * 0.31 - uTime * 1.1) * 0.028 + cos((p.x + p.z) * 0.13 + uTime * 0.7) * 0.009
           - cos(p.x * 0.85 - p.z * 0.62 + uTime * 2.1) * 0.019
           + cos(p.x * 1.31 + p.z * 1.05 - uTime * 2.7) * 0.023;
  vN = normalize(vec3(-dx, 1.0, -dz));
  vW = p;
  gl_Position = uVP * vec4(p, 1.0);
}`;

const WATER_FS = /* glsl */`#version 300 es
precision highp float;
in vec3 vW; in vec3 vN;
uniform vec3 uEye;
uniform vec3 uSunDir;
uniform vec3 uSunCol;
uniform vec3 uAmb;
uniform vec3 uSkyTop;
uniform vec3 uSkyHor;
${FOG}
out vec4 frag;
void main(){
  vec3 n = normalize(vN);
  vec3 view = normalize(uEye - vW);
  float fres = pow(1.0 - max(dot(n, view), 0.0), 3.0);

  // Vattnet färgas av himlen det speglar i stället för av fasta blåtoner:
  // grått under mulet, brandgult i solnedgång, blått mitt på dagen. Det är
  // det som får sjöarna att höra ihop med tiden på dygnet.
  vec3 refl = mix(uSkyHor, uSkyTop, clamp(0.35 + n.y * 0.4, 0.0, 1.0));
  vec3 deep = vec3(0.02, 0.10, 0.20);
  vec3 body = mix(deep, vec3(0.06, 0.34, 0.46), 0.35) * (uAmb + 0.6);
  vec3 col = mix(body, refl, clamp(fres * 0.85 + 0.06, 0.0, 0.9));

  // en smal spegelbild av solen, plus glitter från de korta krusningarna
  vec3 hv = normalize(uSunDir + view);
  float spec = max(dot(n, hv), 0.0);
  col += uSunCol * pow(spec, 220.0) * 2.0;
  col += uSunCol * pow(spec, 26.0) * 0.10;
  col += uSunCol * fres * 0.14;

  float dist = distance(vW, uEye);
  col = applyFog(col, dist);
  frag = vec4(col, 0.78 + fres * 0.20);
}`;

// Bygger terrängmeshen, färgar den efter höjd och lutning, och strör ut
// träd, klippor och kristaller (som också fungerar som hinder).


const SAND = [0.62, 0.55, 0.36];
// Gräsets färg kommer från årstiden (noise.js) — de här är sommarens.
const GRASS = [0.20, 0.40, 0.20];
const GRASS2 = [0.28, 0.47, 0.24];
const ROCK = [0.34, 0.33, 0.37];
const SNOW = [0.90, 0.93, 0.99];
const MUD = [0.10, 0.16, 0.16];

function mix3(a, b, t, out) {
  out[0] = lerp(a[0], b[0], t);
  out[1] = lerp(a[1], b[1], t);
  out[2] = lerp(a[2], b[2], t);
  return out;
}

/** Neotropolis marknivå: platt asfalt med svag tonvariation. Husen ritas som
 *  egna lådor och ingår inte i meshen (fysiken hanterar taken separat). */
function buildCityGroundMesh(res = 60) {
  const n = res + 1;
  const positions = new Float32Array(n * n * 3);
  const normals = new Float32Array(n * n * 3);
  const colors = new Float32Array(n * n * 3);
  const step = WORLD_SIZE / res;
  const half = WORLD_SIZE / 2;
  for (let j = 0; j < n; j++) {
    for (let i = 0; i < n; i++) {
      const idx = (j * n + i) * 3;
      const x = -half + i * step, z = -half + j * step;
      positions[idx] = x; positions[idx + 1] = 0; positions[idx + 2] = z;
      normals[idx] = 0; normals[idx + 1] = 1; normals[idx + 2] = 0;
      const v = 0.85 + (fbm(x * 0.05, z * 0.05, 2) * 0.5 + 0.5) * 0.3;
      colors[idx] = 0.052 * v; colors[idx + 1] = 0.058 * v; colors[idx + 2] = 0.082 * v;
    }
  }
  const indices = new Uint32Array(res * res * 6);
  let k = 0;
  for (let j = 0; j < res; j++) {
    for (let i = 0; i < res; i++) {
      const a = j * n + i, b = a + n;
      indices[k++] = a; indices[k++] = b; indices[k++] = a + 1;
      indices[k++] = a + 1; indices[k++] = b; indices[k++] = b + 1;
    }
  }
  return { positions, normals, colors, indices };
}

/** Terrängmesh med vertexfärger (Vildheim). */
function buildTerrainMesh(res = 200) {
  const n = res + 1;
  const positions = new Float32Array(n * n * 3);
  const normals = new Float32Array(n * n * 3);
  const colors = new Float32Array(n * n * 3);
  const step = WORLD_SIZE / res;
  const half = WORLD_SIZE / 2;
  const tmp = [0, 0, 0];
  const nrm = { x: 0, y: 1, z: 0 };

  for (let j = 0; j < n; j++) {
    for (let i = 0; i < n; i++) {
      const idx = (j * n + i) * 3;
      const x = -half + i * step, z = -half + j * step;
      const h = terrainHeight(x, z);
      positions[idx] = x; positions[idx + 1] = h; positions[idx + 2] = z;

      terrainNormal(x, z, nrm);
      normals[idx] = nrm.x; normals[idx + 1] = nrm.y; normals[idx + 2] = nrm.z;

      const slope = clamp(1 - nrm.y, 0, 1);
      const variation = fbm(x * 0.09, z * 0.09, 2) * 0.5 + 0.5;
      mix3(SEASON.grass, SEASON.grass2, variation, tmp);
      // sten på branta sidor
      mix3(tmp, ROCK, smoothstep(0.22, 0.55, slope), tmp);
      // strand vid vattenlinjen
      mix3(tmp, SAND, smoothstep(1.6, 0.15, h - WATER_LEVEL), tmp);
      // sjöbotten
      mix3(tmp, MUD, smoothstep(0.0, -2.5, h - WATER_LEVEL), tmp);
      // snö på topparna
      const snowLine = SEASON.snow > 0 ? 1.5 : 30;
      mix3(tmp, SNOW, smoothstep(snowLine, snowLine + 16, h) * (1 - smoothstep(0.55, 0.8, slope)), tmp);
      // lite kornighet
      const g = 0.94 + variation * 0.12;
      colors[idx] = tmp[0] * g; colors[idx + 1] = tmp[1] * g; colors[idx + 2] = tmp[2] * g;
    }
  }

  const indices = new Uint32Array(res * res * 6);
  let k = 0;
  for (let j = 0; j < res; j++) {
    for (let i = 0; i < res; i++) {
      const a = j * n + i, b = a + n;
      indices[k++] = a; indices[k++] = b; indices[k++] = a + 1;
      indices[k++] = a + 1; indices[k++] = b; indices[k++] = b + 1;
    }
  }
  return { positions, normals, colors, indices };
}

/** Enkel rutnäts-hash för hinder, så kollisionen inte blir O(n). */
class ColliderGrid {
  constructor(cell = 8) {
    this.cell = cell;
    this.map = new Map();
  }
  /** Cirklar {x,z,r} eller rektanglar {rect:true,x,z,hx,hz,top}. Stora hinder
   *  registreras i alla celler de täcker så 3x3-sökningen alltid hittar dem. */
  add(c) {
    const rx = c.rect ? c.hx : c.r, rz = c.rect ? c.hz : c.r;
    const i0 = Math.floor((c.x - rx) / this.cell), i1 = Math.floor((c.x + rx) / this.cell);
    const j0 = Math.floor((c.z - rz) / this.cell), j1 = Math.floor((c.z + rz) / this.cell);
    for (let i = i0; i <= i1; i++) {
      for (let j = j0; j <= j1; j++) {
        const k = ((i + 512) << 10) | (j + 512);
        let list = this.map.get(k);
        if (!list) { list = []; this.map.set(k, list); }
        list.push(c);
      }
    }
  }
  /** Puttar ut en position ur alla hinder den överlappar. */
  resolve(pos, radius) {
    let hit = false;
    const cx = Math.floor(pos.x / this.cell), cz = Math.floor(pos.z / this.cell);
    for (let i = -1; i <= 1; i++) {
      for (let j = -1; j <= 1; j++) {
        const list = this.map.get((((cx + i) + 512) << 10) | ((cz + j) + 512));
        if (!list) continue;
        for (const c of list) {
          if (c.rect) {
            // hus: väggarna gäller bara under taknivån (flygande passerar ovanför)
            if (c.top !== undefined && pos.y > c.top - 0.5) continue;
            const dx = pos.x - c.x, dz = pos.z - c.z;
            const px = c.hx + radius - Math.abs(dx);
            const pz = c.hz + radius - Math.abs(dz);
            if (px > 0 && pz > 0) {
              if (px < pz) pos.x = c.x + (dx < 0 ? -1 : 1) * (c.hx + radius);
              else pos.z = c.z + (dz < 0 ? -1 : 1) * (c.hz + radius);
              hit = true;
            }
            continue;
          }
          const dx = pos.x - c.x, dz = pos.z - c.z;
          const min = c.r + radius;
          const d2 = dx * dx + dz * dz;
          if (d2 < min * min && d2 > 1e-6) {
            const d = Math.sqrt(d2);
            pos.x = c.x + (dx / d) * min;
            pos.z = c.z + (dz / d) * min;
            hit = true;
          }
        }
      }
    }
    return hit;
  }
}

/**
 * Strör ut världens objekt. Returnerar ritbara listor plus kollisionsrutnätet.
 */
function scatterProps() {
  const trees = [], rocks = [], crystals = [], grassTufts = [];
  const flowers = [], bushes = [], logs = [], mushrooms = [], reeds = [];
  const grid = new ColliderGrid(8);
  const R = 104;

  const place = (tries, fn) => {
    for (let i = 0; i < tries; i++) {
      const a = rand(TAU), d = Math.sqrt(Math.random()) * R;
      const x = Math.cos(a) * d, z = Math.sin(a) * d;
      if (Math.hypot(x, z) < 14) continue;            // håll startplatsen fri
      const h = terrainHeight(x, z);
      const nrm = terrainNormal(x, z);
      fn(x, z, h, 1 - nrm.y);
    }
  };

  // Skogen har fyra arter, fördelade efter höjd: lövträd och björk nere vid
  // vattnet, gran längre upp, och döda stammar högst där det är kargt. En
  // skog av ett enda träd sett tusen gånger är det som får en värld att
  // kännas gjord i stället för växt.
  place(760, (x, z, h, slope) => {
    if (h < WATER_LEVEL + 0.8 || h > 34 || slope > 0.34) return;
    if (Math.random() > 0.72) return;
    const alt = clamp((h - WATER_LEVEL) / 32, 0, 1);
    const r = Math.random();
    let kind;
    if (alt < 0.32) kind = r < 0.5 ? 'broadleaf' : r < 0.74 ? 'birch' : 'pine';
    else if (alt < 0.68) kind = r < 0.62 ? 'pine' : r < 0.88 ? 'broadleaf' : 'birch';
    else kind = r < 0.78 ? 'pine' : 'dead';

    // Höst och vinter fäller löven på lövträden — granen står grön året om.
    if (kind !== 'pine' && kind !== 'dead' && Math.random() < SEASON.bare) kind = 'dead';
    const scale = rand(0.8, 1.5) * (kind === 'broadleaf' ? 1.1 : 1);
    const hue = rand(0.6, 1.0);
    const trunk = kind === 'birch'
      ? [0.78, 0.76, 0.70]
      : kind === 'dead'
        ? [0.34, 0.31, 0.28]
        : [0.24 * hue, 0.16 * hue, 0.11 * hue];
    // lövverket skiftar mot gult och rost på höjden, som en höstsida
    const warm = alt * 0.5 + rand(0, 0.3);
    const seasonLeaf = (c) => [c[0] * SEASON.leaf[0], c[1] * SEASON.leaf[1], c[2] * SEASON.leaf[2]];
    trees.push({
      x, y: h, z, kind, scale, rot: rand(TAU), trunk,
      leaf: seasonLeaf(kind === 'broadleaf'
        ? [lerp(0.18, 0.52, warm), lerp(0.42, 0.50, hue), lerp(0.12, 0.16, Math.random())]
        : kind === 'birch'
          ? [lerp(0.35, 0.62, warm), lerp(0.60, 0.68, hue), 0.22]
          : [lerp(0.10, 0.24, Math.random()), lerp(0.30, 0.52, hue), lerp(0.14, 0.26, Math.random())]),
      tiers: randInt(2, 3),
      lean: rand(-0.09, 0.09),
    });
    grid.add({ x, z, r: 0.6 * scale });

    // svampar och nedfallna stammar hör hemma vid trädens fötter
    if (Math.random() < 0.16) {
      const a = rand(TAU), d = rand(1.2, 2.6);
      const mx = x + Math.cos(a) * d, mz = z + Math.sin(a) * d;
      mushrooms.push({ x: mx, y: terrainHeight(mx, mz), z: mz, scale: rand(0.5, 1.0),
        col: Math.random() < 0.55 ? [0.78, 0.20, 0.18] : [0.85, 0.72, 0.45] });
    }
    if (Math.random() < 0.05) {
      logs.push({ x, y: h, z, rot: rand(TAU), len: rand(2.4, 4.4), r: rand(0.28, 0.45),
        col: [0.26 * hue, 0.19 * hue, 0.13 * hue] });
    }
  });

  place(420, (x, z, h, slope) => {
    if (h < WATER_LEVEL - 1.2) return;
    if (Math.random() > 0.45) return;
    const scale = rand(0.7, 2.8);
    const g = rand(0.85, 1.15);
    rocks.push({
      x, y: h, z,
      sx: scale * rand(0.8, 1.4), sy: scale * rand(0.5, 1.1), sz: scale * rand(0.8, 1.4),
      rx: rand(-0.25, 0.25), ry: rand(TAU), rz: rand(-0.25, 0.25),
      col: [0.31 * g, 0.30 * g, 0.34 * g],
    });
    if (scale > 1.3) grid.add({ x, z, r: scale * 0.55 });
  });

  place(160, (x, z, h, slope) => {
    if (h < WATER_LEVEL + 1.5 || slope > 0.4) return;
    if (Math.random() > 0.22) return;
    crystals.push({
      x, y: h, z,
      scale: rand(0.9, 2.6),
      rot: rand(TAU),
      col: Math.random() < 0.5 ? [0.35, 0.85, 1.0] : [0.72, 0.45, 1.0],
      phase: rand(TAU),
    });
  });

  place(900, (x, z, h, slope) => {
    if (h < WATER_LEVEL + 0.6 || h > 30 || slope > 0.3) return;
    grassTufts.push({ x, y: h, z, scale: rand(0.35, 0.85) * (SEASON.snow ? 0.6 : 1), rot: rand(TAU) });
  });

  // Blommor växer i ängar, inte jämnt utspridda: ett lågfrekvent brus
  // avgör var marken blommar, så man går genom fält i stället för prickar.
  const MEADOW = [
    [1.0, 0.85, 0.25], [0.95, 0.35, 0.45], [0.70, 0.55, 1.0],
    [1.0, 1.0, 0.95], [1.0, 0.55, 0.20],
  ];
  place(1400, (x, z, h, slope) => {
    if (h < WATER_LEVEL + 0.7 || h > 26 || slope > 0.24) return;
    if (Math.random() > SEASON.flowers) return;   // vår blommar över, vinter knappt alls
    const meadow = fbm(x * 0.035 + 8.1, z * 0.035 - 3.7, 2);
    if (meadow < 0.12) return;
    flowers.push({
      x, y: h, z, scale: rand(0.5, 1.0), rot: rand(TAU),
      col: MEADOW[randInt(0, MEADOW.length - 1)],
    });
  });

  place(420, (x, z, h, slope) => {
    if (h < WATER_LEVEL + 0.8 || h > 30 || slope > 0.32) return;
    if (Math.random() > 0.4) return;
    const s = rand(0.7, 1.5);
    bushes.push({ x, y: h, z, scale: s, rot: rand(TAU),
      col: [lerp(0.10, 0.20, Math.random()), lerp(0.26, 0.42, Math.random()), 0.14],
      berries: Math.random() < 0.3 });
  });

  // vass står i strandkanten, precis ovanför vattenlinjen
  place(700, (x, z, h) => {
    const d = h - WATER_LEVEL;
    if (d < -0.4 || d > 0.9) return;
    if (Math.random() > 0.45) return;
    reeds.push({ x, y: h, z, scale: rand(0.8, 1.6), rot: rand(TAU) });
  });

  return { trees, rocks, crystals, grassTufts, flowers, bushes, logs, mushrooms, reeds, grid };
}

/** Neotropolis: husens kollisionslådor plus gatljus och takantenner. */
function cityProps() {
  const grid = new ColliderGrid(8);
  const buildings = cityBuildings();
  for (const b of buildings) {
    // en kollisionsrektangel per avsats, så flygaren kan runda tornens smalare topp
    for (const t of b.tiers) {
      grid.add({ rect: true, x: b.x, z: b.z, hx: b.hx * t.f, hz: b.hz * t.f, top: t.top });
    }
  }

  const lights = [];
  for (let i = 0; i <= Math.floor(WORLD_SIZE / CITY_CELL); i++) {
    for (let j = 0; j <= Math.floor(WORLD_SIZE / CITY_CELL); j++) {
      const x = -WORLD_SIZE / 2 + i * CITY_CELL;
      const z = -WORLD_SIZE / 2 + j * CITY_CELL;
      if (Math.hypot(x, z) > 104) continue;
      if (fbm(i * 3.7, j * 5.1, 1) < -0.1) continue;
      lights.push({ x, z, warm: (i + j) % 3 === 0 });
    }
  }

  const antennas = [];
  for (const b of buildings) {
    if (b.neon < 0.45 || b.h > 60) continue;
    antennas.push({
      x: b.x + (b.neon - 0.5) * b.hx, z: b.z + ((b.neon * 3) % 1 - 0.5) * b.hz,
      y: b.h, h: 2.5 + b.neon * 5,
    });
  }

  return { buildings, lights, antennas, grid };
}
